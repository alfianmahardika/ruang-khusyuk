<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E2A8"/>
      <stop offset="45%" stop-color="#D4A84B"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="gGold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C8"/>
      <stop offset="55%" stop-color="#C9962E"/>
      <stop offset="100%" stop-color="#6E5210"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#3a2a08" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- soft plate -->
  <circle cx="32" cy="32" r="30" fill="#1a140c" opacity=".18"/>
  <circle cx="32" cy="32" r="27" fill="url(#gGold)" opacity=".22"/>
  <g filter="url(#soft)" fill="url(#gGold2)" stroke="#5c4310" stroke-width=".6" stroke-linejoin="round">
    <!-- head -->
    <circle cx="32" cy="16.5" r="6.2"/>
    <!-- torso + arms in qiyam (hands folded on chest) -->
    <path d="M22.5 24.2c1.2-1.8 4.2-3.2 9.5-3.2s8.3 1.4 9.5 3.2c.7 1 .8 2.2.3 3.3l-2.8 6.2c-.5 1.1-1.6 1.8-2.8 1.8h-8.2c-1.2 0-2.3-.7-2.8-1.8l-2.8-6.2c-.5-1.1-.4-2.3.3-3.3z"/>
    <!-- folded hands -->
    <ellipse cx="32" cy="30.2" rx="5.2" ry="3.4" fill="url(#gGold)"/>
    <!-- lower robe / legs standing -->
    <path d="M24.2 35.2h15.6c1.1 0 2 .9 2 2v3.2c0 6.4-4.2 12.6-9.8 14.6-.4.1-.8.1-1.2 0C25.2 53 21 46.8 21 40.4v-3.2c0-1.1.9-2 2-2z"/>
    <!-- feet hint -->
    <ellipse cx="27.2" cy="55.2" rx="3.4" ry="1.5" opacity=".9"/>
    <ellipse cx="36.8" cy="55.2" rx="3.4" ry="1.5" opacity=".9"/>
  </g>
  <!-- highlight sheen -->
  <path d="M22 18c4-8 16-10 22-4" fill="none" stroke="#fff8dc" stroke-width="1.4" stroke-linecap="round" opacity=".35"/>
</svg>
