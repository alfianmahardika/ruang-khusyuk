  {slot:"bangun", t:T("Doa bangun tidur & mengusap wajah","Waking supplication & wiping the face","دعاء الاستيقاظ ومسح الوجه"), d:T("Al-ḥamdu lillāhilladzī aḥyānā... — HR Bukhari 6312. Nabi ﷺ bangun lalu mengusap sisa tidur dari wajahnya — HR Bukhari 183.","Al-ḥamdu lillāhilladzī aḥyānā... — Bukhari 6312. The Prophet ﷺ woke and wiped sleep from his face — Bukhari 183.","الحمد لله الذي أحيانا... — البخاري 6312. وكان ﷺ يمسح النوم عن وجهه — البخاري 183."), g:"sahih"},
  {slot:"bangun", t:T("Siwak saat bangun","Siwak on waking","السواك عند الاستيقاظ"), d:T("Nabi ﷺ bila bangun malam menggosok giginya dengan siwak — HR Bukhari 245, Muslim 255.","When the Prophet ﷺ rose at night he cleaned his teeth with the siwak — Bukhari 245, Muslim 255.","كان ﷺ إذا قام من الليل يشوص فاه بالسواك — البخاري 245 ومسلم 255."), g:"sahih"},
  {slot:"bangun", t:T("Cuci tangan tiga kali sebelum menyentuh air","Wash the hands three times before the water","غسل اليدين ثلاثًا قبل إدخالهما الإناء"), d:T("\"Jika salah seorang kalian bangun tidur, jangan celupkan tangannya ke bejana sebelum mencucinya tiga kali.\" — HR Muslim 278.","\"When one of you wakes, let him not dip his hand into the vessel until he washes it three times.\" — Muslim 278.","«إذا استيقظ أحدكم من نومه فلا يغمس يده في الإناء حتى يغسلها ثلاثًا» — مسلم 278."), g:"sahih"},
  {slot:"bangun", t:T("Tahajud & witir","Tahajjud & witr","التهجد والوتر"), d:T("Salat paling utama setelah fardhu — HR Muslim 1163. Minimal witir satu rakaat — HR Abu Dawud 1422.","The best prayer after the obligatory — Muslim 1163. At least one rak'ah of witr — Abu Dawud 1422.","أفضل الصلاة بعد الفريضة — مسلم 1163. وأقل الوتر ركعة — أبو داود 1422."), g:"sahih"},
  {slot:"subuh", t:T("Qabliyah Subuh 2 rakaat","Two rak'ahs before Fajr","ركعتا الفجر"), d:T("\"Lebih baik dari dunia dan seisinya.\" — HR Muslim 725.","\"Better than the world and all it contains.\" — Muslim 725.","«خير من الدنيا وما فيها» — مسلم 725."), g:"sahih"},
  {slot:"subuh", t:T("Subuh berjamaah di masjid","Fajr in congregation at the mosque","صلاة الفجر جماعة في المسجد"), d:T("\"Siapa salat Isya berjamaah seakan salat setengah malam; siapa salat Subuh berjamaah seakan salat semalam suntuk.\" — HR Muslim 656. Berjalan ke masjid dalam gelap: cahaya sempurna di hari kiamat — HR Abu Dawud 561, Tirmidzi 223 (sahih).","\"Whoever prays Isha in congregation is as if he prayed half the night; whoever prays Fajr in congregation is as if he prayed the whole night.\" — Muslim 656. Walking to the mosque in darkness: perfect light on the Day of Resurrection — Abu Dawud 561, Tirmidhi 223 (authentic).","«من صلى العشاء في جماعة فكأنما قام نصف الليل، ومن صلى الصبح في جماعة فكأنما صلى الليل كله» — مسلم 656. والمشّاؤون في الظلم إلى المساجد لهم النور التام يوم القيامة — أبو داود 561 والترمذي 223."), g:"sahih"},
  {slot:"subuh", t:T("Dzikir pagi","Morning adhkar","أذكار الصباح"), d:T("Sayyidul istighfar (HR Bukhari 6306), Aṣbaḥnā (HR Muslim 2723), tiga Qul 3× (HR Abu Dawud 5082), Bismillāhilladzī lā yaḍurr 3× (HR Abu Dawud 5088). Lihat tab Doa.","Sayyid al-istighfar (Bukhari 6306), Aṣbaḥnā (Muslim 2723), three Quls 3× (Abu Dawud 5082), Bismillāhilladzī lā yaḍurr 3× (Abu Dawud 5088). See the Supplications tab.","سيد الاستغفار (البخاري 6306)، أصبحنا (مسلم 2723)، المعوذات ثلاثًا (أبو داود 5082)، بسم الله الذي لا يضر ثلاثًا (أبو داود 5088). انظر تبويب الأدعية."), g:"sahih"},
  {slot:"subuh", t:T("Duduk hingga matahari terbit, lalu 2 rakaat Isyraq","Sit until sunrise, then two rak'ahs of Ishraq","الجلوس حتى الشروق ثم ركعتا الإشراق"), d:T("Pahala seperti haji dan umrah yang sempurna — HR Tirmidzi 586 (hasan).","The reward of a complete Hajj and Umrah — Tirmidhi 586 (hasan).","كأجر حجة وعمرة تامة — الترمذي 586 (حسن)."), g:"hasan"},
  {slot:"subuh", t:T("Sedekah Subuh","Dawn charity","صدقة الصباح"), d:T("\"Tidak ada satu pagi pun kecuali dua malaikat turun; yang satu berdoa: Ya Allah, berilah ganti bagi yang berinfak; yang lain: Ya Allah, berilah kehancuran bagi yang menahan.\" — HR Bukhari 1442, Muslim 1010. Sedekah memadamkan dosa seperti air memadamkan api — HR Tirmidzi 614 (hasan sahih).","\"No morning comes but two angels descend; one says: O Allah, give the spender a replacement; the other: O Allah, give the withholder ruin.\" — Bukhari 1442, Muslim 1010. Charity extinguishes sin as water extinguishes fire — Tirmidhi 614 (hasan sahih).","«ما من يوم يصبح العباد فيه إلا ملكان ينزلان، فيقول أحدهما: اللهم أعط منفقًا خلفًا، ويقول الآخر: اللهم أعط ممسكًا تلفًا» — البخاري 1442 ومسلم 1010. والصدقة تطفئ الخطيئة كما يطفئ الماء النار — الترمذي 614."), g:"sahih"},
  {slot:"pagi", t:T("Membaca Al-Qur'an (minimal satu halaman)","Read the Qur'an (at least one page)","قراءة القرآن (صفحة على الأقل)"), d:T("\"Bacalah Al-Qur'an, karena ia datang pada hari kiamat sebagai pemberi syafaat bagi pembacanya.\" — HR Muslim 804. Satu huruf = sepuluh kebaikan — HR Tirmidzi 2910 (sahih).","\"Recite the Qur'an, for it comes on the Day of Resurrection as an intercessor for its companions.\" — Muslim 804. One letter = ten rewards — Tirmidhi 2910 (authentic).","«اقرؤوا القرآن فإنه يأتي يوم القيامة شفيعًا لأصحابه» — مسلم 804. والحرف بعشر حسنات — الترمذي 2910."), g:"sahih"},
  {slot:"pagi", t:T("Salat Dhuha","Duha prayer","صلاة الضحى"), d:T("Sedekah untuk 360 ruas tulang — HR Muslim 720; wasiat Nabi ﷺ — HR Bukhari 1178.","Charity for the 360 joints — Muslim 720; the Prophet's ﷺ advice — Bukhari 1178.","صدقة عن 360 مفصلًا — مسلم 720؛ ووصية النبي ﷺ — البخاري 1178."), g:"sahih"},
  {slot:"pagi", t:T("Doa keluar rumah & niat nafkah","Supplication on leaving & the intention of providing","دعاء الخروج ونية النفقة"), d:T("Bismillāh tawakkaltu 'alallāh — HR Abu Dawud 5095 (sahih). \"Nafkah yang kau berikan kepada keluargamu adalah sedekah.\" — HR Bukhari 55. Bekerja jadi ibadah bila diniatkan.","Bismillāh tawakkaltu 'alallāh — Abu Dawud 5095 (authentic). \"What you spend on your family is charity.\" — Bukhari 55. Work becomes worship when intended so.","بسم الله توكلت على الله — أبو داود 5095. «وما أنفقت على أهلك فهو لك صدقة» — البخاري 55. فالعمل عبادة بالنية."), g:"sahih"},
  {slot:"pagi", t:T("Senyum, salam, dan kata yang baik","Smile, greet, and speak well","الابتسامة والسلام والكلمة الطيبة"), d:T("\"Senyummu kepada saudaramu adalah sedekah.\" — HR Tirmidzi 1956 (hasan). \"Sebarkanlah salam di antara kalian.\" — HR Muslim 54.","\"Your smile to your brother is charity.\" — Tirmidhi 1956 (hasan). \"Spread the salam among you.\" — Muslim 54.","«تبسمك في وجه أخيك لك صدقة» — الترمذي 1956. «أفشوا السلام بينكم» — مسلم 54."), g:"sahih"},
  {slot:"pagi", t:T("Siwak setiap wudhu","Siwak at every wudu","السواك عند كل وضوء"), d:T("\"Seandainya tidak memberatkan umatku, aku perintahkan bersiwak setiap wudhu.\" — HR Bukhari (ta'liq) 887, Ahmad 9928; sahih.","\"Were it not a burden on my ummah, I would have commanded the siwak at every wudu.\" — Bukhari 887 (mu'allaq), Ahmad 9928; authentic.","«لولا أن أشق على أمتي لأمرتهم بالسواك عند كل وضوء» — البخاري 887 معلقًا وأحمد 9928؛ صحيح."), g:"sahih"},
  {slot:"siang", t:T("Dzuhur berjamaah + rawatib 4 sebelum, 2 sesudah","Dhuhr in congregation + 4 before, 2 after","الظهر جماعة ورواتبها 4 قبل و2 بعد"), d:T("Berjamaah 27 derajat — HR Bukhari 645. Rawatib 12 rakaat → rumah di surga — HR Muslim 728.","Congregation: 27 degrees — Bukhari 645. Twelve rawatib → a house in Paradise — Muslim 728.","الجماعة بسبع وعشرين درجة — البخاري 645. والرواتب الاثنتا عشرة بيت في الجنة — مسلم 728."), g:"sahih"},
  {slot:"siang", t:T("Makan dengan tangan kanan, duduk, dan berdoa","Eat with the right hand, seated, with supplication","الأكل باليمين جالسًا مع الدعاء"), d:T("\"Makanlah dengan tangan kananmu dan dari yang dekat denganmu.\" — HR Bukhari 5376. Doa setelah makan: 'Al-ḥamdu lillāhilladzī aṭ'amanī hādzā...' — HR Abu Dawud 4023, Tirmidzi 3458 (hasan).","\"Eat with your right hand and from what is near you.\" — Bukhari 5376. After eating: 'Praise be to Allah who fed me this...' — Abu Dawud 4023, Tirmidhi 3458 (hasan).","«كل بيمينك وكل مما يليك» — البخاري 5376. وبعد الطعام: «الحمد لله الذي أطعمني هذا...» — أبو داود 4023 والترمذي 3458."), g:"sahih"},
  {slot:"siang", t:T("Qailulah (tidur siang sebentar)","Qaylulah (a short midday nap)","القيلولة"), d:T("\"Tidur sianglah, karena setan tidak tidur siang.\" — HR Thabrani (al-Ausath 28), dinilai hasan oleh al-Albani (Shahihul Jami' 4431). Para sahabat biasa qailulah setelah Jumat — HR Bukhari 939.","\"Take the midday nap, for the devils do not.\" — Tabarani (al-Awsat 28), graded hasan by al-Albani (Sahih al-Jami' 4431). The Companions napped after Friday prayer — Bukhari 939.","«قيلوا فإن الشياطين لا تقيل» — الطبراني في الأوسط 28، حسّنه الألباني (صحيح الجامع 4431). وكان الصحابة يقيلون بعد الجمعة — البخاري 939."), g:"hasan"},
  {slot:"sore", t:T("Ashar berjamaah (salat wustha)","Asr in congregation (the middle prayer)","العصر جماعة (الصلاة الوسطى)"), d:T("\"Siapa salat sebelum terbit dan sebelum terbenam matahari (Subuh dan Ashar) tidak masuk neraka.\" — HR Muslim 634. Yang meninggalkan Ashar, gugur amalnya — HR Bukhari 553.","\"Whoever prays before sunrise and before sunset (Fajr and Asr) will not enter the Fire.\" — Muslim 634. Whoever misses Asr, his deeds are void — Bukhari 553.","«لن يلج النار أحد صلى قبل طلوع الشمس وقبل غروبها» — مسلم 634. ومن ترك العصر حبط عمله — البخاري 553."), g:"sahih"},
  {slot:"sore", t:T("Dzikir petang","Evening adhkar","أذكار المساء"), d:T("Amsainā wa amsal-mulku lillāh — HR Muslim 2723; Ayat Kursi petang: dijaga hingga pagi — HR Hakim 1/562 (sahih al-Albani).","Amsainā wa amsal-mulku lillāh — Muslim 2723; Ayat al-Kursi in the evening: protected until morning — Hakim 1/562 (al-Albani: authentic).","أمسينا وأمسى الملك لله — مسلم 2723؛ وآية الكرسي مساءً: حفظ حتى الصباح — الحاكم 1/562."), g:"sahih"},
  {slot:"sore", t:T("Istighfar 100× sehari","Istighfar 100× a day","الاستغفار مائة مرة في اليوم"), d:T("\"Sungguh aku beristighfar kepada Allah seratus kali dalam sehari.\" — HR Muslim 2702.","\"Indeed I seek Allah's forgiveness a hundred times a day.\" — Muslim 2702.","«إني لأستغفر الله في اليوم مائة مرة» — مسلم 2702."), g:"sahih"},
  {slot:"sore", t:T("Salawat (minimal 10×)","Salawat (at least 10×)","الصلاة على النبي ﷺ (عشرًا على الأقل)"), d:T("\"Siapa bersalawat kepadaku sekali, Allah bersalawat kepadanya sepuluh kali.\" — HR Muslim 408.","\"Whoever sends one prayer upon me, Allah sends ten upon him.\" — Muslim 408.","«من صلى عليّ واحدة صلى الله عليه عشرًا» — مسلم 408."), g:"sahih"},
  {slot:"malam", t:T("Maghrib: segera, rawatib 2 sesudah","Maghrib promptly, 2 rak'ahs after","المغرب في أول وقتها وراتبتها البعدية"), d:T("Umatku dalam kebaikan selama tidak mengakhirkan Maghrib hingga bintang bertaburan — HR Abu Dawud 418 (hasan). Rawatib — HR Muslim 728.","My ummah remains in goodness as long as it does not delay Maghrib until the stars crowd — Abu Dawud 418 (hasan). Rawatib — Muslim 728.","«لا تزال أمتي بخير ما لم يؤخروا المغرب إلى أن تشتبك النجوم» — أبو داود 418. والراتبة — مسلم 728."), g:"sahih"},
  {slot:"malam", t:T("Waktu untuk keluarga: bermain & mengajari anak","Family time: play with and teach the children","وقت الأسرة: اللعب مع الأبناء وتعليمهم"), d:T("\"Sebaik-baik kalian adalah yang paling baik kepada keluarganya.\" — HR Tirmidzi 3895 (sahih). \"Perintahkan anak-anak kalian salat pada usia tujuh tahun.\" — HR Abu Dawud 495 (hasan sahih).","\"The best of you is the best to his family.\" — Tirmidhi 3895 (authentic). \"Command your children to pray at seven.\" — Abu Dawud 495 (hasan sahih).","«خيركم خيركم لأهله» — الترمذي 3895. «مروا أولادكم بالصلاة وهم أبناء سبع» — أبو داود 495."), g:"sahih"},
  {slot:"malam", t:T("Isya berjamaah + rawatib 2 sesudah","Isha in congregation + 2 after","العشاء جماعة وراتبتها البعدية"), d:T("Seakan salat setengah malam — HR Muslim 656.","As if praying half the night — Muslim 656.","فكأنما قام نصف الليل — مسلم 656."), g:"sahih"},
  {slot:"malam", t:T("Muhasabah: evaluasi hari ini (Jurnal)","Self-reckoning: review the day (Journal)","محاسبة النفس: مراجعة اليوم (اليوميات)"), d:T("\"Hendaklah setiap diri memperhatikan apa yang telah diperbuatnya untuk hari esok.\" — QS Al-Hasyr 18. Umar: \"Hisablah dirimu sebelum kalian dihisab.\" — atsar, Tirmidzi 2459.","\"Let every soul look to what it has sent ahead for tomorrow.\" — Al-Hashr 18. Umar: \"Call yourselves to account before you are called to account.\" — athar, Tirmidhi 2459.","﴿ولتنظر نفس ما قدمت لغد﴾ — الحشر 18. عمر: «حاسبوا أنفسكم قبل أن تحاسبوا» — أثر، الترمذي 2459."), g:"sahih"},
  {slot:"tidur", t:T("Membaca Al-Mulk sebelum tidur","Recite Al-Mulk before sleeping","قراءة الملك قبل النوم"), d:T("\"Ada surah tiga puluh ayat yang memberi syafaat bagi pembacanya hingga diampuni: Tabārakalladzī biyadihil-mulk.\" — HR Tirmidzi 2891, Abu Dawud 1400 (hasan). Nabi ﷺ tidak tidur sebelum membaca As-Sajdah dan Al-Mulk — HR Tirmidzi 2892 (sahih).","\"A surah of thirty verses intercedes for its reader until he is forgiven: Tabārakalladzī biyadihil-mulk.\" — Tirmidhi 2891, Abu Dawud 1400 (hasan). The Prophet ﷺ did not sleep before reciting As-Sajdah and Al-Mulk — Tirmidhi 2892 (authentic).","«سورة من القرآن ثلاثون آية شفعت لرجل حتى غُفر له: تبارك الذي بيده الملك» — الترمذي 2891 وأبو داود 1400. وكان ﷺ لا ينام حتى يقرأ السجدة والملك — الترمذي 2892."), g:"hasan"},
  {slot:"tidur", t:T("Wudhu, miring kanan, dzikir tidur","Wudu, right side, sleep adhkar","الوضوء والاضطجاع على الأيمن وأذكار النوم"), d:T("HR Bukhari 247 (wudhu & miring kanan), 2311 (Ayat Kursi), 5009 (akhir Al-Baqarah), 5017 (tiga Qul), 6318 (tasbih 33/33/34), 6324 (Bismika).","Bukhari 247 (wudu & right side), 2311 (Ayat al-Kursi), 5009 (end of Al-Baqarah), 5017 (three Quls), 6318 (33/33/34), 6324 (Bismika).","البخاري 247 (الوضوء والشق الأيمن)، 2311 (آية الكرسي)، 5009 (خاتمة البقرة)، 5017 (المعوذات)، 6318 (33/33/34)، 6324 (باسمك)."), g:"sahih"},
  {slot:"tidur", t:T("Memaafkan semua orang sebelum tidur","Forgive everyone before sleeping","العفو عن الجميع قبل النوم"), d:T("Amalan sahabat Anshar yang disebut Nabi ﷺ 'penghuni surga': \"Aku tidak tidur dengan menyimpan dendam kepada seorang muslim pun.\" — HR Ahmad 12697 (sanadnya sahih menurut sebagian ulama; dinilai lemah oleh yang lain). Dalil umum: \"Hendaklah mereka memaafkan dan berlapang dada.\" — QS An-Nur 22.","The practice of the Ansari whom the Prophet ﷺ called 'a man of Paradise': \"I do not sleep bearing a grudge against any Muslim.\" — Ahmad 12697 (chain graded authentic by some, weak by others). General evidence: \"Let them pardon and overlook.\" — An-Nur 22.","عمل الأنصاري الذي بشّره النبي ﷺ بالجنة: «ما أبيت وفي نفسي غش لمسلم» — أحمد 12697 (صحّحه بعضهم وضعّفه آخرون). والأصل: ﴿وليعفوا وليصفحوا﴾ — النور 22."), g:"khilaf"},
  {slot:"tidur", t:T("Tidur awal, bangun untuk tahajud","Sleep early, rise for tahajjud","النوم مبكرًا والقيام للتهجد"), d:T("Nabi ﷺ membenci tidur sebelum Isya dan mengobrol sesudahnya — HR Bukhari 568. Tidur adalah persiapan qiyam.","The Prophet ﷺ disliked sleeping before Isha and chatting after it — Bukhari 568. Sleep is preparation for standing at night.","كان ﷺ يكره النوم قبل العشاء والحديث بعدها — البخاري 568. فالنوم استعداد للقيام."), g:"sahih"},
  {slot:"mingguan", weekly:true, t:T("Puasa Senin & Kamis","Fast on Monday & Thursday","صيام الاثنين والخميس"), d:T("\"Amal diperlihatkan pada hari Senin dan Kamis, dan aku suka amalku diperlihatkan saat aku berpuasa.\" — HR Tirmidzi 747 (hasan). Senin: hari kelahiran Nabi ﷺ — HR Muslim 1162.","\"Deeds are presented on Monday and Thursday, and I love that my deeds be presented while I am fasting.\" — Tirmidhi 747 (hasan). Monday: the Prophet's ﷺ birthday — Muslim 1162.","«تُعرض الأعمال يوم الاثنين والخميس فأحب أن يُعرض عملي وأنا صائم» — الترمذي 747. والاثنين يوم مولده ﷺ — مسلم 1162."), g:"hasan"},
  {slot:"mingguan", weekly:true, t:T("Puasa Ayyamul Bidh (13, 14, 15 Hijriah)","Fast the White Days (13, 14, 15)","صيام الأيام البيض (13 و14 و15)"), d:T("Wasiat Nabi ﷺ: puasa tiga hari tiap bulan — HR Bukhari 1178; ditentukan 13–15 — HR Tirmidzi 761, Nasa'i 2422 (hasan).","The Prophet's ﷺ advice: fast three days a month — Bukhari 1178; specified as 13–15 — Tirmidhi 761, Nasa'i 2422 (hasan).","وصيته ﷺ بصيام ثلاثة أيام من كل شهر — البخاري 1178؛ وتعيينها 13–15 — الترمذي 761 والنسائي 2422."), g:"hasan"},
  {slot:"mingguan", weekly:true, t:T("Jumat: Al-Kahfi, mandi, bersegera, salawat","Friday: Al-Kahf, ghusl, go early, salawat","الجمعة: الكهف والغسل والتبكير والصلاة على النبي"), d:T("Al-Kahfi: cahaya antara dua Jumat — HR Hakim 2/368, Baihaqi (sahih al-Albani). Mandi Jumat wajib/sunnah muakkad — HR Bukhari 879. Perbanyak salawat pada hari Jumat — HR Abu Dawud 1047 (sahih).","Al-Kahf: a light between two Fridays — Hakim 2/368, Bayhaqi (al-Albani: authentic). Friday ghusl — Bukhari 879. Increase salawat on Friday — Abu Dawud 1047 (authentic).","الكهف: نور ما بين الجمعتين — الحاكم 2/368 والبيهقي. وغسل الجمعة — البخاري 879. والإكثار من الصلاة على النبي يوم الجمعة — أبو داود 1047."), g:"sahih"}
];
</script>

  "mur.adabText":T("\"Apabila dibacakan Al-Qur'an, dengarkanlah dan diamlah, agar kalian dirahmati.\" (QS Al-A'raf 204). Ini bukan suara latar: dengarkan dengan hati sebelum salat, dan ia berhenti otomatis saat mode perpisahan.","\"When the Qur'an is recited, listen to it and be silent, that you may receive mercy.\" (Al-A'raf 204). This is not background sound: listen with the heart before prayer; it stops automatically in farewell mode.","﴿وإذا قرئ القرآن فاستمعوا له وأنصتوا لعلكم ترحمون﴾ (الأعراف 204). ليس صوت خلفية: استمع بقلبك قبل الصلاة، ويتوقف تلقائيًا في وضع الوداع."),

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}};
const dkey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dayOfYear=()=>{const d=new Date();return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);};
window.__rkToast=m=>toast(m);
let toastT; function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2600);}

/* ---------------- i18n ---------------- */

const L=x=>x==null?"":(typeof x==="object"&&!Array.isArray(x)&&("id" in x))?(x[I18N.lang]||x.id||""):String(x);

/* ---------------- Router ---------------- */
const PAGES=["harian","persiapan","bacaan","sunnah","gerakan","tasbih","setelah"];
function go(p){ if(!PAGES.includes(p)) p="persiapan";
  $$(".page").forEach(s=>s.classList.toggle("on",s.id==="page-"+p)); $$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
  $("#view").scrollTop=0; try{history.replaceState(null,"","#"+p);}catch(e){}

/* ---------------- Breathing ---------------- */
const Breath={ mode:"box", running:false, timer:null, phaseT:null,
  init(){ $$("#breathMode button").forEach(b=>b.addEventListener("click",()=>{ $$("#breathMode button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); this.mode=b.dataset.m; if(this.running) this.stop(); }));
    $("#breathBtn").addEventListener("click",()=>this.running?this.stop():this.start(60)); $("#breathLong").addEventListener("click",()=>{ if(this.running) this.stop(); this.start(120); }); },
  render(){ if(!this.running){ $("#breathBtn").textContent=t("b.start"); $("#breathLbl").textContent=t("b.press"); $("#breathCnt").textContent=t("b.ready"); } },
  start(total){ this.running=true; $("#breathBtn").textContent=t("b.stop"); const orb=$("#orb"), lbl=$("#breathLbl"), cnt=$("#breathCnt");
    const phases=this.mode==="box"?[["b.in",4,1],["b.hold",4,1],["b.out",4,.6],["b.hold",4,.6]]:[["b.in",4,1],["b.hold",7,1],["b.out",8,.6]];
    let left=total, pi=0; const tick=()=>{ cnt.textContent=left+" "+t("b.left"); if(left<=0){ this.stop(true); return; } left--; this.timer=setTimeout(tick,1000); }; tick();
    const phase=()=>{ if(!this.running) return; const [k,sec,scale]=phases[pi%phases.length]; lbl.textContent=t(k)+" · "+sec; orb.style.transitionDuration=sec+"s"; orb.style.transform="scale("+scale+")"; pi++; this.phaseT=setTimeout(phase,sec*1000); };
    orb.style.transitionDuration="0s"; orb.style.transform="scale(.6)"; requestAnimationFrame(()=>requestAnimationFrame(phase)); },
  stop(done){ this.running=false; clearTimeout(this.timer); clearTimeout(this.phaseT); $("#breathBtn").textContent=t("b.start"); $("#breathLbl").textContent=done?t("b.doneLbl"):t("b.press"); $("#breathCnt").textContent=done?t("b.doneSt"):t("b.ready"); const orb=$("#orb"); orb.style.transitionDuration="2s"; orb.style.transform="scale(.6)"; if(done) toast(t("b.doneToast")); }
};

/* ---------------- Planner ---------------- */
const Planner={ key:"rk_plan", cur:"subuh",
  init(){ const h=new Date().getHours(); this.cur=h<9?"subuh":h<15?"dzuhur":h<17.5?"ashar":h<19?"maghrib":"isya"; if(this.cur==="subuh"&&new Date().getDay()===5) this.cur="subuh-jumat";
    $("#planSalat").addEventListener("change",e=>{ this.cur=e.target.value; this.render(); }); $("#planRows").addEventListener("change",e=>this.onChange(e)); $("#planSunnah").addEventListener("click",()=>this.fillSunnah()); this.render(); },
  all(){ return store.get(this.key,{}); }, plan(){ const a=this.all(); return a[this.cur]||{r1:{s:0,from:1,to:0},r2:{s:0,from:1,to:0}}; },
  save(p){ const a=this.all(); a[this.cur]=p; if(store.set(this.key,a)){ $("#planSaved").textContent=t("p.saved"); setTimeout(()=>$("#planSaved").textContent="",1500); } },
  sName(s){ return I18N.lang==="ar"?s[3]:s[1]; },
  row(label,key,r){ const s=SURAH.find(x=>x[0]===r.s); const n=s?s[2]:0; const all=!r.to||(r.from===1&&r.to===n);
    let from=""; for(let i=1;i<=n;i++) from+=`<option value="${i}" ${i===r.from?"selected":""}>${i}</option>`;
    let to=`<option value="0" ${all?"selected":""}>${t("p.all")}</option>`; for(let i=1;i<=n;i++) to+=`<option value="${i}" ${!all&&i===r.to?"selected":""}>${i}</option>`;
    return `<div class="card" style="padding:12px"><div class="eyebrow" style="font-size:10.5px">${label}</div>
      <select data-k="${key}" data-f="s" style="margin-top:6px"><option value="0">${t("p.pick")}</option>${SURAH.map(x=>`<option value="${x[0]}" ${x[0]===r.s?"selected":""}>${x[0]}. ${esc(this.sName(x))} (${x[2]})</option>`).join("")}</select>
      ${s?`<div class="two" style="margin-top:8px;grid-template-columns:1fr 1fr;gap:8px"><div><span class="dim">${t("p.from")}</span><select data-k="${key}" data-f="from" ${all?"disabled":""}>${from}</select></div><div><span class="dim">${t("p.to")}</span><select data-k="${key}" data-f="to">${to}</select></div></div>
      <div class="dim" style="margin-top:6px">${esc(this.sName(s))} · ${L(MUFASSAL(s[0]))} · ${all?n+" "+t("p.ayat")+" ("+t("p.whole")+")":Math.max(0,r.to-r.from+1)+" "+t("p.ayat")}</div>`:""}</div>`; },
  render(){ $("#planSalat").innerHTML=PLAN_GUIDE.map(g=>`<option value="${g.id}" ${g.id===this.cur?"selected":""}>${esc(L(g.nama))}</option>`).join("");
    const p=this.plan(); $("#planRows").innerHTML=this.row(t("p.r1"),"r1",p.r1)+this.row(t("p.r2"),"r2",p.r2); const g=PLAN_GUIDE.find(x=>x.id===this.cur);
    $("#planGuide").innerHTML=`<div class="eyebrow">${t("p.guide")} ${esc(L(g.nama))}</div>`+g.text.map(x=>`<div class="dalil"><div><b>${esc(x[0])}</b> — ${L(x[1])}</div></div>`).join(""); $("#planSunnah").style.display=g.sunnah?"":"none"; },
  onChange(e){ const sel=e.target.closest("select"); if(!sel) return; const p=this.plan(), r=p[sel.dataset.k], f=sel.dataset.f, v=+sel.value;
    if(f==="s"){ r.s=v; r.from=1; r.to=0; } else if(f==="to"){ if(v===0){ r.from=1; r.to=0; } else { r.to=v; if(r.from>v) r.from=v; } } else if(f==="from"){ r.from=v; if(r.to&&r.to<v) r.to=v; }
    this.save(p); this.render(); },
  fillSunnah(){ const g=PLAN_GUIDE.find(x=>x.id===this.cur); if(!g.sunnah) return; this.save({r1:{s:g.sunnah[0][0],from:1,to:0},r2:{s:g.sunnah[1][0],from:1,to:0}}); this.render(); toast(t("p.filled")); }
};

const Sunnah={ seg:"harian", state:[], doaIdx:0,
  init(){ $$("#sunnahSeg button").forEach(b=>b.addEventListener("click",()=>{ this.seg=b.dataset.s; $$("#sunnahSeg button").forEach(x=>x.classList.toggle("on",x===b)); ["harian","salat","doa"].forEach(s=>$("#sun-"+s).style.display=s===this.seg?"":"none"); $("#view").scrollTop=0; }));
    this.key="rk_daily_"+dkey(); this.state=store.get(this.key,[]);
    $("#dailyList").addEventListener("click",e=>{ const el=e.target.closest(".check"); if(!el) return; const i=+el.dataset.i; this.state=this.state.includes(i)?this.state.filter(x=>x!==i):[...this.state,i]; store.set(this.key,this.state); this.renderDaily(); });
    $("#dailyReset").addEventListener("click",()=>{ this.state=[]; store.set(this.key,this.state); this.renderDaily(); });

  render(){ this.renderDaily(); this.renderSalat(); this.renderDoaSel(); this.renderDoa(); },
  pct(arr){ const base=DAILY.filter(d=>!d.weekly).length; const done=arr.filter(i=>DAILY[i]&&!DAILY[i].weekly).length; return done/base; },
  renderDaily(){ const slots=["bangun","subuh","pagi","siang","sore","malam","tidur","mingguan"];
    $("#dailyList").innerHTML=slots.map(sl=>{ const items=DAILY.map((d,i)=>({d,i})).filter(x=>x.d.slot===sl); if(!items.length) return ""; return `<div class="slot"><div class="sh"><span class="eyebrow">${t("slot."+sl)}</span><i></i></div>`+items.map(({d,i})=>`<div class="check ${this.state.includes(i)?"on":""}" data-i="${i}"><div class="box"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><div style="min-width:0"><div class="row" style="gap:8px"><span class="t">${esc(L(d.t))}</span>${gradePill(d.g)}</div><div class="d">${L(d.d)}</div></div></div>`).join("")+`</div>`; }).join("");
    const pct=this.pct(this.state); $("#dailyRing").setAttribute("stroke-dashoffset",(263.9*(1-Math.min(1,pct))).toFixed(1)); $("#dailyPct").textContent=Math.round(pct*100)+"%"; $("#dailyDone").textContent=this.state.length;

  renderDoaSel(){ const groups=[]; DOA.forEach(d=>{ const g=L(d.g); if(!groups.includes(g)) groups.push(g); }); $("#doaSel").innerHTML=groups.map(g=>`<optgroup label="${esc(g)}">`+DOA.map((d,i)=>L(d.g)===g?`<option value="${i}" ${i===this.doaIdx?"selected":""}>${esc(L(d.nama))}</option>`:"").join("")+`</optgroup>`).join(""); },
  renderDoa(){ const d=DOA[this.doaIdx]; const pill=d.grade==="dhaif"?`<span class="pill rose">${t("s.notSahih")}</span>`:gradePill(d.grade);

  chartSalat(all){ const svg=$("#chartSalat"), tip=$("#tip1"); svg.innerHTML=""; const cats=SALAT.map((s,i)=>{ const xs=all.filter(e=>e.salat===i); return {s:L(s),n:xs.length,avg:xs.length?xs.reduce((a,e)=>a+e.score,0)/xs.length:0}; }).filter(c=>c.n); if(!cats.length){ svg.innerHTML=`<text x="180" y="100" text-anchor="middle">${esc(t("a.noData"))}</text>`; return; }
    const W=360,H=200,Lp=28,R=10,Tp=18,B=34,pw=W-Lp-R,ph=H-Tp-B,bw=Math.min(44,pw/cats.length-8); let h=""; [0,5,10].forEach(v=>{ const y=Tp+ph-(v/10)*ph; h+=`<line class="grid" x1="${Lp}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${Lp-6}" y="${y+4}" text-anchor="end">${v}</text>`; });

  chartDays(all){ const svg=$("#chartDays"), tip=$("#tip2"); svg.innerHTML=""; const days=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=dkey(d); const xs=all.filter(e=>e.day===k); days.push({k,lbl:d.getDate(),n:xs.length,avg:xs.length?xs.reduce((a,e)=>a+e.score,0)/xs.length:null}); }

  init(){ const a=$("#audioEl"); $("#murBtn").addEventListener("click",()=>{ $("#murSheet").classList.add("on"); this.list(); }); $("#murClose").addEventListener("click",()=>$("#murSheet").classList.remove("on")); $("#murSheet").addEventListener("click",e=>{ if(e.target.id==="murSheet") $("#murSheet").classList.remove("on"); });

    $("#seek").addEventListener("input",e=>{ if(a.duration) a.currentTime=e.target.value/1000*a.duration; }); $("#loop").addEventListener("change",e=>{ a.loop=e.target.checked; $("#loopChip").classList.toggle("on",e.target.checked); store.set("rk_loop",e.target.checked); }); $("#vol").addEventListener("input",e=>{ a.volume=e.target.value/100; store.set("rk_vol",+e.target.value); });
    a.loop=!!store.get("rk_loop",false); $("#loop").checked=a.loop; $("#loopChip").classList.toggle("on",a.loop); const v=store.get("rk_vol",70); $("#vol").value=v; a.volume=v/100; this.curId=store.get("rk_track",null);

  open(){ return new Promise(res=>{ try{ const r=indexedDB.open("rk_murattal",1); r.onupgradeneeded=()=>{ r.result.createObjectStore("tracks",{keyPath:"id",autoIncrement:true}); }; r.onsuccess=()=>{ this.db=r.result; res(); }; r.onerror=()=>res(); }catch(e){ res(); } }); },
  fmt(s){ s=Math.floor(s||0); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); },
  list(){ if(!this.db){ $("#trackList").innerHTML=`<p class="dim">${t("mur.none")}</p>`; return; } const tx=this.db.transaction("tracks","readonly").objectStore("tracks").getAll(); tx.onsuccess=()=>{ this.tracks=tx.result||[]; this.renderList(); if(this.curId!=null&&!this.url){ const tr=this.tracks.find(x=>x.id===this.curId); if(tr) this.select(tr.id,false); } }; },
  renderList(){ const el=$("#trackList"); if(!this.tracks.length){ el.innerHTML=`<p class="dim">${t("mur.none")}</p>`; $("#player").style.display="none"; return; } el.innerHTML=this.tracks.map(tr=>`<div class="track ${tr.id===this.curId?"on":""}" data-id="${tr.id}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg><span class="nm">${esc(tr.name)}</span><button class="btn sm ghost" data-del="${tr.id}" style="font-size:11px;padding:4px 10px">${t("mur.remove")}</button></div>`).join(""); $("#player").style.display=this.curId!=null?"":"none"; },

  remove(id){ if(!this.db) return; this.db.transaction("tracks","readwrite").objectStore("tracks").delete(id).onsuccess=()=>{ if(this.curId===id){ this.curId=null; store.set("rk_track",null); $("#audioEl").pause(); $("#audioEl").removeAttribute("src"); this.url=null; } this.list(); }; },
  select(id,play){ const tr=this.tracks.find(x=>x.id===id); if(!tr) return; const a=$("#audioEl"); if(this.curId!==id||!this.url){ if(this.url) URL.revokeObjectURL(this.url); this.url=URL.createObjectURL(tr.blob); a.src=this.url; } this.curId=id; store.set("rk_track",id); this.renderList(); if(play) a.play().catch(()=>{}); this.ui(); },
  pause(){ $("#audioEl").pause(); },
  ui(){ const a=$("#audioEl"); const playing=!a.paused&&!a.ended&&a.src; $("#murBtn").classList.toggle("playing",!!playing); $("#ppIcon").innerHTML=playing?'<path d="M7 6h4v12H7zM13 6h4v12h-4z"/>':'<path d="M7 5v14l11-7z"/>'; }
};

 {g:"subuh",items:[
  {k:"qabliyah_subuh",t:G("Dua rakaat qabliyah Subuh","Two rak'ahs before Fajr","ركعتا الفجر"),d:G("Lebih baik dari dunia dan seisinya.","Better than the world and all it contains.","خير من الدنيا وما فيها."),
   arab:"رَكْعَتَا الْفَجْرِ خَيْرٌ مِنَ الدُّنْيَا وَمَا فِيهَا",src:"HR. Muslim no. 725",gr:"sahih"},
  {k:"subuh",fardhu:true,t:G("Salat Subuh berjamaah","Fajr prayer in congregation","صلاة الفجر في جماعة"),d:G("Seperti salat semalam suntuk.","Like praying the whole night.","كأنما صلى الليل كله."),
   arab:"وَمَنْ صَلَّى الصُّبْحَ فِي جَمَاعَةٍ فَكَأَنَّمَا صَلَّى اللَّيْلَ كُلَّهُ",src:"HR. Muslim no. 656",gr:"sahih"},
  {k:"dzikir_badasholat",t:G("Dzikir ba'da salat","Dhikr after prayer","الأذكار بعد الصلاة"),d:G("Tasbih, tahmid, takbir 33× lalu tahlil — dosa diampuni walau sebanyak buih laut.","Tasbih, tahmid, takbir 33× then tahlil — sins forgiven even if like sea foam.","التسبيح والتحميد والتكبير ٣٣ ثم التهليل، غُفرت خطاياه وإن كانت مثل زبد البحر."),
   arab:"مَنْ سَبَّحَ اللَّهَ فِي دُبُرِ كُلِّ صَلَاةٍ ثَلَاثًا وَثَلَاثِينَ ... غُفِرَتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ",src:"HR. Muslim no. 597",gr:"sahih"},
  {k:"dzikir_pagi",t:G("Dzikir pagi (Sayyidul Istighfar)","Morning adhkar (Sayyid al-Istighfar)","أذكار الصباح (سيد الاستغفار)"),d:G("Siapa membacanya di siang hari dengan yakin lalu wafat sebelum sore, ia penghuni surga.","Whoever says it by day with certainty and dies before evening is of the people of Paradise.","من قالها من النهار موقنًا بها فمات قبل أن يمسي فهو من أهل الجنة."),
   arab:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",src:"HR. Bukhari no. 6306",gr:"sahih"},
  {k:"sedekah_subuh",t:G("Sedekah subuh","Morning charity","صدقة الصباح"),d:G("Setiap pagi dua malaikat turun: satu mendoakan ganti bagi yang berinfak, satu mendoakan kebinasaan harta yang menahan.","Every morning two angels descend: one prays for the spender to be compensated, the other for the withholder's loss.","كل صباح ينزل ملكان: أحدهما يدعو للمنفق بالخلف والآخر على الممسك بالتلف."),
   arab:"مَا مِنْ يَوْمٍ يُصْبِحُ الْعِبَادُ فِيهِ إِلَّا مَلَكَانِ يَنْزِلَانِ، فَيَقُولُ أَحَدُهُمَا: اللَّهُمَّ أَعْطِ مُنْفِقًا خَلَفًا، وَيَقُولُ الْآخَرُ: اللَّهُمَّ أَعْطِ مُمْسِكًا تَلَفًا",src:"HR. Bukhari no. 1442, Muslim no. 1010",gr:"sahih"},
  {k:"tilawah",t:G("Tilawah Al-Qur'an","Reciting the Qur'an","تلاوة القرآن"),d:G("Al-Qur'an datang memberi syafaat bagi pembacanya.","The Qur'an will intercede for its companions.","يأتي القرآن شفيعًا لأصحابه."),
   arab:"اقْرَءُوا الْقُرْآنَ فَإِنَّهُ يَأْتِي يَوْمَ الْقِيَامَةِ شَفِيعًا لِأَصْحَابِهِ",src:"HR. Muslim no. 804",gr:"sahih"}
 ]},
 {g:"pagi",items:[
  {k:"dhuha",t:G("Salat Dhuha","Duha prayer","صلاة الضحى"),d:G("Dua rakaat Dhuha mencukupi sedekah untuk setiap ruas tubuh.","Two rak'ahs of Duha suffice as charity for every joint.","ركعتا الضحى تجزئ عن صدقة كل مفصل."),
   arab:"يُصْبِحُ عَلَى كُلِّ سُلَامَى مِنْ أَحَدِكُمْ صَدَقَةٌ ... وَيُجْزِئُ مِنْ ذَلِكَ رَكْعَتَانِ يَرْكَعُهُمَا مِنَ الضُّحَى",src:"HR. Muslim no. 720",gr:"sahih"},
  {k:"birrul_walidain",t:G("Berbakti kepada orang tua","Kindness to parents","بر الوالدين"),d:G("Hubungi, doakan, bantu. Termasuk amalan paling dicintai Allah (HR. Bukhari 527).","Call, pray for, help them. Among the deeds most beloved to Allah (Bukhari 527).","تواصل وادعُ وساعد. من أحب الأعمال إلى الله (البخاري ٥٢٧)."),
   arab:"وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا",src:"QS. Al-Isra' [17]: 23",gr:"quran"},
  {k:"ilmu",t:G("Menuntut ilmu","Seeking knowledge","طلب العلم"),d:G("Jalan menuju ilmu dimudahkan menuju surga.","The path to knowledge is made an easy path to Paradise.","طريق العلم طريق إلى الجنة."),
   arab:"مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ",src:"HR. Muslim no. 2699",gr:"sahih"},
  {k:"kerja_halal",t:G("Bekerja / mencari nafkah halal","Earning a lawful living","الكسب الحلال"),d:G("Tak ada makanan lebih baik daripada hasil kerja tangan sendiri.","No food is better than what one earns by one's own hands.","ما أكل أحد طعامًا خيرًا من عمل يده."),
   arab:"مَا أَكَلَ أَحَدٌ طَعَامًا قَطُّ خَيْرًا مِنْ أَنْ يَأْكُلَ مِنْ عَمَلِ يَدِهِ",src:"HR. Bukhari no. 2072",gr:"sahih"}
 ]},
 {g:"siang",items:[
  {k:"adab_makan",t:G("Adab makan: bismillah, tangan kanan","Eating etiquette: bismillah, right hand","آداب الطعام: التسمية واليمين"),d:G("Sebut nama Allah, makan dengan tangan kanan dan dari yang terdekat.","Say Allah's name, eat with the right hand and from what is near you.","سمِّ الله وكُل بيمينك وكُل مما يليك."),
   arab:"يَا غُلَامُ، سَمِّ اللَّهَ، وَكُلْ بِيَمِينِكَ، وَكُلْ مِمَّا يَلِيكَ",src:"HR. Bukhari no. 5376, Muslim no. 2022",gr:"sahih"},
  {k:"qailulah",opt:true,t:G("Qailulah (tidur siang sejenak)","Qaylulah (short midday nap)","القيلولة"),d:G("Kebiasaan para sahabat; membantu bangun malam.","A habit of the Companions; helps for night prayer.","عادة الصحابة، وتعين على قيام الليل."),
   arab:"مَا كُنَّا نَقِيلُ وَلَا نَتَغَدَّى إِلَّا بَعْدَ الْجُمُعَةِ",src:"HR. Bukhari no. 939, Muslim no. 859",gr:"sahih"},
  {k:"dzuhur",fardhu:true,t:G("Salat Dzuhur tepat waktu","Dhuhr prayer on time","صلاة الظهر في وقتها"),d:G("Salat di awal waktu adalah amalan paling dicintai Allah.","Prayer on time is the deed most beloved to Allah.","الصلاة على وقتها أحب الأعمال إلى الله."),
   arab:"الصَّلَاةُ عَلَى وَقْتِهَا",src:"HR. Bukhari no. 527, Muslim no. 85",gr:"sahih"},
  {k:"rawatib",t:G("Salat rawatib (12 rakaat)","Rawatib sunnah (12 rak'ahs)","السنن الرواتب (١٢ ركعة)"),d:G("2 sebelum Subuh, 4 sebelum & 2 sesudah Dzuhur, 2 sesudah Maghrib, 2 sesudah Isya.","2 before Fajr, 4 before & 2 after Dhuhr, 2 after Maghrib, 2 after Isha.","٢ قبل الفجر، ٤ قبل الظهر و٢ بعده، ٢ بعد المغرب، ٢ بعد العشاء."),
   arab:"مَنْ صَلَّى اثْنَتَيْ عَشْرَةَ رَكْعَةً فِي يَوْمٍ وَلَيْلَةٍ بُنِيَ لَهُ بِهِنَّ بَيْتٌ فِي الْجَنَّةِ",src:"HR. Muslim no. 728",gr:"sahih"}
 ]},
 {g:"sore",items:[
  {k:"ashar",fardhu:true,t:G("Salat Ashar","Asr prayer","صلاة العصر"),d:G("Siapa menjaga dua salat dingin (Subuh & Ashar) masuk surga.","Whoever keeps the two cool prayers (Fajr & Asr) enters Paradise.","من صلى البردين دخل الجنة."),
   arab:"مَنْ صَلَّى الْبَرْدَيْنِ دَخَلَ الْجَنَّةَ",src:"HR. Bukhari no. 574, Muslim no. 635",gr:"sahih"},
  {k:"dzikir_petang",t:G("Dzikir petang","Evening adhkar","أذكار المساء"),d:G("Bertasbih sebelum terbit dan terbenam matahari. Subhanallah wa bihamdihi 100× menghapus dosa (Bukhari 6405, Muslim 2691).","Glorify before sunrise and sunset. SubhanAllah wa bihamdihi 100× erases sins (Bukhari 6405, Muslim 2691).","سبّح قبل الطلوع والغروب. سبحان الله وبحمده مائة مرة تحط الخطايا (البخاري ٦٤٠٥، مسلم ٢٦٩١)."),
   arab:"وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ غُرُوبِهَا",src:"QS. Thaha [20]: 130",gr:"quran"}
 ]},
 {g:"maghrib",items:[
  {k:"maghrib",fardhu:true,t:G("Salat Maghrib","Maghrib prayer","صلاة المغرب"),d:G("Jagalah semua salat dengan sungguh-sungguh.","Guard all the prayers diligently.","حافظوا على الصلوات."),
   arab:"حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَىٰ وَقُومُوا لِلَّهِ قَانِتِينَ",src:"QS. Al-Baqarah [2]: 238",gr:"quran"},
  {k:"isya",fardhu:true,t:G("Salat Isya berjamaah","Isha prayer in congregation","صلاة العشاء في جماعة"),d:G("Seperti salat setengah malam.","Like praying half the night.","كأنما قام نصف الليل."),
   arab:"مَنْ صَلَّى الْعِشَاءَ فِي جَمَاعَةٍ فَكَأَنَّمَا قَامَ نِصْفَ اللَّيْلِ",src:"HR. Muslim no. 656",gr:"sahih"},
  {k:"muhasabah",t:G("Muhasabah (evaluasi diri)","Self-accounting (muhasabah)","محاسبة النفس"),d:G("Lihat apa yang telah disiapkan untuk esok. Isi jurnal di tab Setelah.","Reflect on what you have prepared for tomorrow. Use the After tab's journal.","انظر ما قدّمت لغد. استخدم يوميات تبويب بعد الصلاة."),
   arab:"يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَلْتَنظُرْ نَفْسٌ مَّا قَدَّمَتْ لِغَدٍ",src:"QS. Al-Hasyr [59]: 18",gr:"quran"},
  {k:"almulk",t:G("Membaca surah Al-Mulk","Reciting Surah Al-Mulk","قراءة سورة الملك"),d:G("Surah 30 ayat yang memberi syafaat hingga pembacanya diampuni.","A 30-verse surah that interceded until its reciter was forgiven.","سورة ثلاثون آية شفعت لرجل حتى غُفر له."),
   arab:"إِنَّ سُورَةً مِنَ الْقُرْآنِ ثَلَاثُونَ آيَةً شَفَعَتْ لِرَجُلٍ حَتَّى غُفِرَ لَهُ، وَهِيَ تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ",src:"HR. Tirmidzi no. 2891, Abu Dawud no. 1400 (hasan)",gr:"hasan"}
 ]},
 {g:"tidur",items:[
  {k:"wudhu_tidur",t:G("Wudhu sebelum tidur, berbaring ke kanan","Wudu before sleep, lie on the right side","الوضوء قبل النوم والاضطجاع على الأيمن"),d:G("Tidur dalam keadaan suci.","Sleep in a state of purity.","النوم على طهارة."),
   arab:"إِذَا أَتَيْتَ مَضْجَعَكَ فَتَوَضَّأْ وُضُوءَكَ لِلصَّلَاةِ، ثُمَّ اضْطَجِعْ عَلَى شِقِّكَ الْأَيْمَنِ",src:"HR. Bukhari no. 247, Muslim no. 2710",gr:"sahih"},
  {k:"ayat_kursi",t:G("Ayat Kursi","Ayat al-Kursi","آية الكرسي"),d:G("Penjaga dari Allah menyertai hingga pagi, setan tak mendekat.","A guardian from Allah stays with you till morning; no devil comes near.","لا يزال عليك من الله حافظ ولا يقربك شيطان حتى تصبح."),
   arab:"إِذَا أَوَيْتَ إِلَى فِرَاشِكَ فَاقْرَأْ آيَةَ الْكُرْسِيِّ، لَنْ يَزَالَ عَلَيْكَ مِنَ اللَّهِ حَافِظٌ، وَلَا يَقْرَبُكَ شَيْطَانٌ حَتَّى تُصْبِحَ",src:"HR. Bukhari no. 5010 (juga no. 2311)",gr:"sahih"},
  {k:"muawwidzat",t:G("Al-Ikhlas, Al-Falaq, An-Nas","Al-Ikhlas, Al-Falaq, An-Nas","الإخلاص والمعوذتان"),d:G("Tiup ke telapak tangan, baca tiga surah, usap tubuh — 3×.","Blow into palms, recite the three surahs, wipe the body — 3×.","انفث في الكفين واقرأ السور الثلاث وامسح الجسد ثلاثًا."),
   arab:"كَانَ إِذَا أَوَى إِلَى فِرَاشِهِ كُلَّ لَيْلَةٍ جَمَعَ كَفَّيْهِ ثُمَّ نَفَثَ فِيهِمَا فَقَرَأَ فِيهِمَا: قُلْ هُوَ اللَّهُ أَحَدٌ، وَقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، وَقُلْ أَعُوذُ بِرَبِّ النَّاسِ",src:"HR. Bukhari no. 5017",gr:"sahih"},
  {k:"tasbih_tidur",t:G("Tasbih 33, tahmid 33, takbir 34","Tasbih 33, tahmid 33, takbir 34","التسبيح ٣٣ والتحميد ٣٣ والتكبير ٣٤"),d:G("Diajarkan Nabi ﷺ kepada Fatimah & Ali: lebih baik dari pembantu.","Taught by the Prophet ﷺ to Fatimah & Ali: better than a servant.","علّمه النبي ﷺ فاطمة وعليًا: خير لكما من خادم."),
   arab:"تُسَبِّحَانِ ثَلَاثًا وَثَلَاثِينَ، وَتَحْمَدَانِ ثَلَاثًا وَثَلَاثِينَ، وَتُكَبِّرَانِ أَرْبَعًا وَثَلَاثِينَ، فَهُوَ خَيْرٌ لَكُمَا مِنْ خَادِمٍ",src:"HR. Bukhari no. 3705, Muslim no. 2727",gr:"sahih"},
  {k:"doa_tidur",t:G("Doa sebelum tidur","Supplication before sleep","دعاء النوم"),d:G("Serahkan jiwa kepada Allah.","Entrust your soul to Allah.","سلّم نفسك لله."),
   arab:"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا",src:"HR. Bukhari no. 6324",gr:"sahih"}
 ]},
 {g:"sepanjang",items:[
  {k:"istighfar",t:G("Istighfar (≥ 70–100×)","Istighfar (≥ 70–100×)","الاستغفار (٧٠–١٠٠ مرة)"),d:G("Nabi ﷺ beristighfar lebih dari 70× sehari.","The Prophet ﷺ sought forgiveness more than 70 times a day.","كان النبي ﷺ يستغفر أكثر من سبعين مرة في اليوم."),
   arab:"وَاللَّهِ إِنِّي لَأَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ فِي الْيَوْمِ أَكْثَرَ مِنْ سَبْعِينَ مَرَّةً",src:"HR. Bukhari no. 6307",gr:"sahih"},
  {k:"shalawat",t:G("Shalawat kepada Nabi ﷺ","Salawat upon the Prophet ﷺ","الصلاة على النبي ﷺ"),d:G("Satu shalawat dibalas sepuluh oleh Allah.","One salawat is returned tenfold by Allah.","من صلى عليه واحدة صلى الله عليه عشرًا."),
   arab:"مَنْ صَلَّى عَلَيَّ وَاحِدَةً صَلَّى اللَّهُ عَلَيْهِ عَشْرًا",src:"HR. Muslim no. 408",gr:"sahih"},
  {k:"lisan",t:G("Menjaga lisan","Guarding the tongue","حفظ اللسان"),d:G("Berkata baik atau diam.","Speak good or remain silent.","قل خيرًا أو اصمت."),
   arab:"مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ",src:"HR. Bukhari no. 6018, Muslim no. 47",gr:"sahih"}
 ]}
];

:"\"Better than the world and all it contains.\" — Muslim 725.","ar":"«خير من الدنيا وما فيها» — مسلم 725."},"g":"sahih"},{"slot":"subuh","t":{"id":"Subuh berjamaah di masjid","en":"Fajr in congregation at the mosque","ar":"صلاة الفجر جماعة في المسجد"},"d":{"id":"\"Siapa salat Isya berjamaah seakan salat setengah malam; siapa salat Subuh berjamaah seakan salat semalam suntuk.\" — HR Muslim 656. Berjalan ke masjid dalam gelap: cahaya sempurna di hari kiamat — HR Abu Dawud 561, Tirmidzi 223 (sahih).","en":"\"Whoever prays Isha in congregation is as if he prayed half the night; whoever prays Fajr in congregation is as if he prayed the whole night.\" — Muslim 656. Walking to the mosque in darkness: perfect light on the Day of Resurrection — Abu Dawud 561, Tirmidhi 223 (authentic).","ar":"«من صلى العشاء في جماعة فكأنما قام نصف الليل، ومن صلى الصبح في جماعة فكأنما صلى الليل كله» — مسلم 656. والمشّاؤون في الظلم إلى المساجد لهم النور التام يوم القيامة — أبو داود 561 والترمذي 223."},"g":"sahih"},{"slot":"subuh","t":{"id":"Dzikir pagi","en":"Morning adhkar","ar":"أذكار الصباح"},"d":{"id":"Sayyidul istighfar (HR Bukhari 6306), Aṣbaḥnā (HR Muslim 2723), tiga Qul 3× (HR Abu Dawud 5082), Bismillāhilladzī lā yaḍurr 3× (HR Abu Dawud 5088). Lihat tab Doa.","en":"Sayyid al-istighfar (Bukhari 6306), Aṣbaḥnā (Muslim 2723), three Quls 3× (Abu Dawud 5082), Bismillāhilladzī lā yaḍurr 3× (Abu Dawud 5088). See the Supplications tab.","ar":"سيد الاستغفار (البخاري 6306)، أصبحنا (مسلم 2723)، المعوذات ثلاثًا (أبو داود 5082)، بسم الله الذي لا يضر ثلاثًا (أبو داود 5088). انظر تبويب الأدعية."},"g":"sahih"},{"slot":"subuh","t":{"id":"Duduk hingga matahari terbit, lalu 2 rakaat Isyraq","en":"Sit until sunrise, then two rak'ahs of Ishraq","ar":"الجلوس حتى الشروق ثم ركعتا الإشراق"},"d":{"id":"Pahala seperti haji dan umrah yang sempurna — HR Tirmidzi 586 (hasan).","en":"The reward of a complete Hajj and Umrah — Tirmidhi 586 (hasan).","ar":"كأجر حجة وعمرة تامة — الترمذي 586 (حسن)."},"g":"hasan"},{"slot":"subuh","t":{"id":"Sedekah Subuh","en":"Dawn charity","ar":"صدقة الصباح"},"d":{"id":"\"Tidak ada satu pagi pun kecuali dua malaikat turun; yang satu berdoa: Ya Allah, berilah ganti bagi yang berinfak; yang lain: Ya Allah, berilah kehancuran bagi yang menahan.\" — HR Bukhari 1442, Muslim 1010. Sedekah memadamkan dosa seperti air memadamkan api — HR Tirmidzi 614 (hasan sahih).","en":"\"No morning comes but two angels descend; one says: O Allah, give the spender a replacement; the other: O Allah, give the withholder ruin.\" — Bukhari 1442, Muslim 1010. Charity extinguishes sin as water extinguishes fire — Tirmidhi 614 (hasan sahih).","ar":"«ما من يوم يصبح العباد فيه إلا ملكان ينزلان، فيقول أحدهما: اللهم أعط منفقًا خلفًا، ويقول الآخر: اللهم أعط ممسكًا تلفًا» — البخاري 1442 ومسلم 1010. والصدقة تطفئ الخطيئة كما يطفئ الماء النار — الترمذي 614."},"g":"sahih"},{"slot":"pagi","t":{"id":"Membaca Al-Qur'an (minimal satu halaman)","en":"Read the Qur'an (at least one page)","ar":"قراءة القرآن (صفحة على الأقل)"},"d":{"id":"\"Bacalah Al-Qur'an, karena ia datang pada hari kiamat sebagai pemberi syafaat bagi pembacanya.\" — HR Muslim 804. Satu huruf = sepuluh kebaikan — HR Tirmidzi 2910 (sahih).","en":"\"Recite the Qur'an, for it comes on the Day of Resurrection as an intercessor for its companions.\" — Muslim 804. One letter = ten rewards — Tirmidhi 2910 (authentic).","ar":"«اقرؤوا القرآن فإنه يأتي يوم القيامة شفيعًا لأصحابه» — مسلم 804. والحرف بعشر حسنات — الترمذي 2910."},"g":"sahih"},{"slot":"pagi","t":{"id":"Salat Dhuha","en":"Duha prayer","ar":"صلاة الضحى"},"d":{"id":"Sedekah untuk 360 ruas tulang — HR Muslim 720; wasiat Nabi ﷺ — HR Bukhari 1178.","en":"Charity for the 360 joints — Muslim 720; the Prophet's ﷺ advice — Bukhari 1178.","ar":"صدقة عن 360 مفصلًا — مسلم 720؛ ووصية النبي ﷺ — البخاري 1178."},"g":"sahih"},{"slot":"pagi","t":{"id":"Doa keluar rumah & niat nafkah","en":"Supplication on leaving & the intention of providing","ar":"دعاء الخروج ونية النفقة"},"d":{"id":"Bismillāh tawakkaltu 'alallāh — HR Abu Dawud 5095 (sahih). \"Nafkah yang kau berikan kepada keluargamu adalah sedekah.\" — HR Bukhari 55. Bekerja jadi ibadah bila diniatkan.","en":"Bismillāh tawakkaltu 'alallāh — Abu Dawud 5095 (authentic). \"What you spend on your family is charity.\" — Bukhari 55. Work becomes worship when intended so.","ar":"بسم الله توكلت على الله — أبو داود 5095. «وما أنفقت على أهلك فهو لك صدقة» — البخاري 55. فالعمل عبادة بالنية."},"g":"sahih"},{"slot":"pagi","t":{"id":"Senyum, salam, dan kata yang baik","en":"Smile, greet, and speak well","ar":"الابتسامة والسلام والكلمة الطيبة"},"d":{"id":"\"Senyummu kepada saudaramu adalah sedekah.\" — HR Tirmidzi 1956 (hasan). \"Sebarkanlah salam di antara kalian.\" — HR Muslim 54.","en":"\"Your smile to your brother is charity.\" — Tirmidhi 1956 (hasan). \"Spread the salam among you.\" — Muslim 54.","ar":"«تبسمك في وجه أخيك لك صدقة» — الترمذي 1956. «أفشوا السلام بينكم» — مسلم 54."},"g":"sahih"},{"slot":"pagi","t":{"id":"Siwak setiap wudhu","en":"Siwak at every wudu","ar":"السواك عند كل وضوء"},"d":{"id":"\"Seandainya tidak memberatkan umatku, aku perintahkan bersiwak setiap wudhu.\" — HR Bukhari (ta'liq) 887, Ahmad 9928; sahih.","en":"\"Were it not a burden on my ummah, I would have commanded the siwak at every wudu.\" — Bukhari 887 (mu'allaq), Ahmad 9928; authentic.","ar":"«لولا أن أشق على أمتي لأمرتهم بالسواك عند كل وضوء» — البخاري 887 معلقًا وأحمد 9928؛ صحيح."},"g":"sahih"},{"slot":"siang","t":{"id":"Dzuhur berjamaah + rawatib 4 sebelum, 2 sesudah","en":"Dhuhr in congregation + 4 before, 2 after","ar":"الظهر جماعة ورواتبها 4 قبل و2 بعد"},"d":{"id":"Berjamaah 27 derajat — HR Bukhari 645. Rawatib 12 rakaat → rumah di surga — HR Muslim 728.","en":"Congregation: 27 degrees — Bukhari 645. Twelve rawatib → a house in Paradise — Muslim 728.","ar":"الجماعة بسبع وعشرين درجة — البخاري 645. والرواتب الاثنتا عشرة بيت في الجنة — مسلم 728."},"g":"sahih"},{"slot":"siang","t":{"id":"Makan dengan tangan kanan, duduk, dan berdoa","en":"Eat with the right hand, seated, with supplication","ar":"الأكل باليمين جالسًا مع الدعاء"},"d":{"id":"\"Makanlah dengan tangan kananmu dan dari yang dekat denganmu.\" — HR Bukhari 5376. Doa setelah makan: 'Al-ḥamdu lillāhilladzī aṭ'amanī hādzā...' — HR Abu Dawud 4023, Tirmidzi 3458 (hasan).","en":"\"Eat with your right hand and from what is near you.\" — Bukhari 5376. After eating: 'Praise be to Allah who fed me this...' — Abu Dawud 4023, Tirmidhi 3458 (hasan).","ar":"«كل بيمينك وكل مما يليك» — البخاري 5376. وبعد الطعام: «الحمد لله الذي أطعمني هذا...» — أبو داود 4023 والترمذي 3458."},"g":"sahih"},{"slot":"siang","t":{"id":"Qailulah (tidur siang sebentar)","en":"Qaylulah (a short midday nap)","ar":"القيلولة"},"d":{"id":"\"Tidur sianglah, karena setan tidak tidur siang.\" — HR Thabrani (al-Ausath 28), dinilai hasan oleh al-Albani (Shahihul Jami' 4431). Para sahabat biasa qailulah setelah Jumat — HR Bukhari 939.","en":"\"Take the midday nap, for the devils do not.\" — Tabarani (al-Awsat 28), graded hasan by al-Albani (Sahih al-Jami' 4431). The Companions napped after Friday prayer — Bukhari 939.","ar":"«قيلوا فإن الشياطين لا تقيل» — الطبراني في الأوسط 28، حسّنه الألباني (صحيح الجامع 4431). وكان الصحابة يقيلون بعد الجمعة — البخاري 939."},"g":"hasan"},{"slot":"sore","t":{"id":"Ashar berjamaah (salat wustha)","en":"Asr in congregation (the middle prayer)","ar":"العصر جماعة (الصلاة الوسطى)"},"d":{"id":"\"Siapa salat sebelum terbit dan sebelum terbenam matahari (Subuh dan Ashar) tidak masuk neraka.\" — HR Muslim 634. Yang meninggalkan Ashar, gugur amalnya — HR Bukhari 553.","en":"\"Whoever prays before sunrise and before sunset (Fajr and Asr) will not enter the Fire.\" — Muslim 634. Whoever misses Asr, his deeds are void — Bukhari 553.","ar":"«لن يلج النار أحد صلى قبل طلوع الشمس وقبل غروبها» — مسلم 634. ومن ترك العصر حبط عمله — البخاري 553."},"g":"sahih"},{"slot":"sore","t":{"id":"Dzikir petang","en":"Evening adhkar","ar":"أذكار المساء"},"d":{"id":"Amsainā wa amsal-mulku lillāh — HR Muslim 2723; Ayat Kursi petang: dijaga hingga pagi — HR Hakim 1/562 (sahih al-Albani).","en":"Amsainā wa amsal-mulku lillāh — Muslim 2723; Ayat al-Kursi in the evening: protected until morning — Hakim 1/562 (al-Albani: authentic).","ar":"أمسينا وأمسى الملك لله — مسلم 2723؛ وآية الكرسي مساءً: حفظ حتى الصباح — الحاكم 1/562."},"g":"sahih"},{"slot":"sore","t":{"id":"Istighfar 100× sehari","en":"Istighfar 100× a day","ar":"الاستغفار مائة مرة في اليوم"},"d":{"id":"\"Sungguh aku beristighfar kepada Allah seratus kali dalam sehari.\" — HR Muslim 2702.","en":"\"Indeed I seek Allah's forgiveness a hundred times a day.\" — Muslim 2702.","ar":"«إني لأستغفر الله في اليوم مائة مرة» — مسلم 2702."},"g":"sahih"},{"slot":"sore","t":{"id":"Salawat (minimal 10×)","en":"Salawat (at least 10×)","ar":"الصلاة على النبي ﷺ (عشرًا على الأقل)"},"d":{"id":"\"Siapa bersalawat kepadaku sekali, Allah bersalawat kepadanya sepuluh kali.\" — HR Muslim 408.","en":"\"Whoever sends one prayer upon me, Allah sends ten upon him.\" — Muslim 408.","ar":"«من صلى عليّ واحدة صلى الله عليه عشرًا» — مسلم 408."},"g":"sahih"},{"slot":"malam","t":{"id":"Maghrib: segera, rawatib 2 sesudah","en":"Maghrib promptly, 2 rak'ahs after","ar":"المغرب في أول وقتها وراتبتها البعدية"},"d":{"id":"Umatku dalam kebaikan selama tidak mengakhirkan Maghrib hingga bintang bertaburan — HR Abu Dawud 418 (hasan). Rawatib — HR Muslim 728.","en":"My ummah remains in goodness as long as it does not delay Maghrib until the stars crowd — Abu Dawud 418 (hasan). Rawatib — Muslim 728.","ar":"«لا تزال أمتي بخير ما لم يؤخروا المغرب إلى أن تشتبك النجوم» — أبو داود 418. والراتبة — مسلم 728."},"g":"sahih"},{"slot":"malam","t":{"id":"Waktu untuk keluarga: bermain & mengajari anak","en":"Family time: play with and teach the children","ar":"وقت الأسرة: اللعب مع الأبناء وتعليمهم"},"d":{"id":"\"Sebaik-baik kalian adalah yang paling baik kepada keluarganya.\" — HR Tirmidzi 3895 (sahih). \"Perintahkan anak-anak kalian salat pada usia tujuh tahun.\" — HR Abu Dawud 495 (hasan sahih).","en":"\"The best of you is the best to his family.\" — Tirmidhi 3895 (authentic). \"Command your children to pray at seven.\" — Abu Dawud 495 (hasan sahih).","ar":"«خيركم خيركم لأهله» — الترمذي 3895. «مروا أولادكم بالصلاة وهم أبناء سبع» — أبو داود 495."},"g":"sahih"},{"slot":"malam","t":{"id":"Isya berjamaah + rawatib 2 sesudah","en":"Isha in congregation + 2 after","ar":"العشاء جماعة وراتبتها البعدية"},"d":{"id":"Seakan salat setengah malam — HR Muslim 656.","en":"As if praying half the night — Muslim 656.","ar":"فكأنما قام نصف الليل — مسلم 656."},"g":"sahih"},{"slot":"malam","t":{"id":"Muhasabah: evaluasi hari ini (Jurnal)","en":"Self-reckoning: review the day (Journal)","ar":"محاسبة النفس: مراجعة اليوم (اليوميات)"},"d":{"id":"\"Hendaklah setiap diri memperhatikan apa yang telah diperbuatnya untuk hari esok.\" — QS Al-Hasyr 18. Umar: \"Hisablah dirimu sebelum kalian dihisab.\" — atsar, Tirmidzi 2459.","en":"\"Let every soul look to what it has sent ahead for tomorrow.\" — Al-Hashr 18. Umar: \"Call yourselves to account before you are called to account.\" — athar, Tirmidhi 2459.","ar":"﴿ولتنظر نفس ما قدمت لغد﴾ — الحشر 18. عمر: «حاسبوا أنفسكم قبل أن تحاسبوا» — أثر، الترمذي 2459."},"g":"sahih"},{"slot":"tidur","t":{"id":"Membaca Al-Mulk sebelum tidur","en":"Recite Al-Mulk before sleeping","ar":"قراءة الملك قبل النوم"},"d":{"id":"\"Ada surah tiga puluh ayat yang memberi syafaat bagi pembacanya hingga diampuni: Tabārakalladzī biyadihil-mulk.\" — HR Tirmidzi 2891, Abu Dawud 1400 (hasan). Nabi ﷺ tidak tidur sebelum membaca As-Sajdah dan Al-Mulk — HR Tirmidzi 2892 (sahih).","en":"\"A surah of thirty verses intercedes for its reader until he is forgiven: Tabārakalladzī biyadihil-mulk.\" — Tirmidhi 2891, Abu Dawud 1400 (hasan). The Prophet ﷺ did not sleep before reciting As-Sajdah and Al-Mulk — Tirmidhi 2892 (authentic).","ar":"«سورة من القرآن ثلاثون آية شفعت لرجل حتى غُفر له: تبارك الذي بيده الملك» — الترمذي 2891 وأبو داود 1400. وكان ﷺ لا ينام حتى يقرأ السجدة والملك — الترمذي 2892."},"g":"hasan"},{"slot":"tidur","t":{"id":"Wudhu, miring kanan, dzikir tidur","en":"Wudu, right side, sleep adhkar","ar":"الوضوء والاضطجاع على الأيمن وأذكار النوم"},"d":{"id":"HR Bukhari 247 (wudhu & miring kanan), 2311 (Ayat Kursi), 5009 (akhir Al-Baqarah), 5017 (tiga Qul), 6318 (tasbih 33/33/34), 6324 (Bismika).","en":"Bukhari 247 (wudu & right side), 2311 (Ayat al-Kursi), 5009 (end of Al-Baqarah), 5017 (three Quls), 6318 (33/33/34), 6324 (Bismika).","ar":"البخاري 247 (الوضوء والشق الأيمن)، 2311 (آية الكرسي)، 5009 (خاتمة البقرة)، 5017 (المعوذات)، 6318 (33/33/34)، 6324 (باسمك)."},"g":"sahih"},{"slot":"tidur","t":{"id":"Memaafkan semua orang sebelum tidur","en":"Forgive everyone before sleeping","ar":"العفو عن الجميع قبل النوم"},"d":{"id":"Amalan sahabat Anshar yang disebut Nabi ﷺ 'penghuni surga': \"Aku tidak tidur dengan menyimpan dendam kepada seorang muslim pun.\" — HR Ahmad 12697 (sanadnya sahih menurut sebagian ulama; dinilai lemah oleh yang lain). Dalil umum: \"Hendaklah mereka memaafkan dan berlapang dada.\" — QS An-Nur 22.","en":"The practice of the Ansari whom the Prophet ﷺ called 'a man of Paradise': \"I do not sleep bearing a grudge against any Muslim.\" — Ahmad 12697 (chain graded authentic by some, weak by others). General evidence: \"Let them pardon and overlook.\" — An-Nur 22.","ar":"عمل الأنصاري الذي بشّره النبي ﷺ بالجنة: «ما أبيت وفي نفسي غش لمسلم» — أحمد 12697 (صحّحه بعضهم وضعّفه آخرون). والأصل: ﴿وليعفوا وليصفحوا﴾ — النور 22."},"g":"khilaf"},{"slot":"tidur","t":{"id":"Tidur awal, bangun untuk tahajud","en":"Sleep early, rise for tahajjud","ar":"النوم مبكرًا والقيام للتهجد"},"d":{"id":"Nabi ﷺ membenci tidur sebelum Isya dan mengobrol sesudahnya — HR Bukhari 568. Tidur adalah persiapan qiyam.","en":"The Prophet ﷺ disliked sleeping before Isha and chatting after it — Bukhari 568. Sleep is preparation for standing at night.","ar":"كان ﷺ يكره النوم قبل العشاء والحديث بعدها — البخاري 568. فالنوم استعداد للقيام."},"g":"sahih"},{"slot":"mingguan","weekly":true,"t":{"id":"Puasa Senin & Kamis","en":"Fast on Monday & Thursday","ar":"صيام الاثنين والخميس"},"d":{"id":"\"Amal diperlihatkan pada hari Senin dan Kamis, dan aku suka amalku diperlihatkan saat aku berpuasa.\" — HR Tirmidzi 747 (hasan). Senin: hari kelahiran Nabi ﷺ — HR Muslim 1162.","en":"\"Deeds are presented on Monday and Thursday, and I love that my deeds be presented while I am fasting.\" — Tirmidhi 747 (hasan). Monday: the Prophet's ﷺ birthday — Muslim 1162.","ar":"«تُعرض الأعمال يوم الاثنين والخميس فأحب أن يُعرض عملي وأنا صائم» — الترمذي 747. والاثنين يوم مولده ﷺ — مسلم 1162."},"g":"hasan"},{"slot":"mingguan","weekly":true,"t":{"id":"Puasa Ayyamul Bidh (13, 14, 15 Hijriah)","en":"Fast the White Days (13, 14, 15)","ar":"صيام الأيام البيض (13 و14 و15)"},"d":{"id":"Wasiat Nabi ﷺ: puasa tiga hari tiap bulan — HR Bukhari 1178; ditentukan 13–15 — HR Tirmidzi 761, Nasa'i 2422 (hasan).","en":"The Prophet's ﷺ advice: fast three days a month — Bukhari 1178; specified as 13–15 — Tirmidhi 761, Nasa'i 2422 (hasan).","ar":"وصيته ﷺ بصيام ثلاثة أيام من كل شهر — البخاري 1178؛ وتعيينها 13–15 — الترمذي 761 والنسائي 2422."},"g":"hasan"},{"slot":"mingguan","weekly":true,"t":{"id":"Jumat: Al-Kahfi, mandi, bersegera, salawat","en":"Friday: Al-Kahf, ghusl, go early, salawat","ar":"الجمعة: الكهف والغسل والتبكير والصلاة على النبي"},"d":{"id":"Al-Kahfi: cahaya antara dua Jumat — HR Hakim 2/368, Baihaqi (sahih al-Albani). Mandi Jumat wajib/sunnah muakkad — HR Bukhari 879. Perbanyak salawat pada hari Jumat — HR Abu Dawud 1047 (sahih).","en":"Al-Kahf: a light between two Fridays — Hakim 2/368, Bayhaqi (al-Albani: authentic). Friday ghusl — Bukhari 879. Increase salawat on Friday — Abu Dawud 1047 (authentic).","ar":"الكهف: نور ما بين الجمعتين — الحاكم 2/368 والبيهقي. وغسل الجمعة — البخاري 879. والإكثار من الصلاة على النبي يوم الجمعة — أبو داود 1047."},"g":"sahih"}]

 {k:"cuci_tangan",v:2,g:"bangun",after:"siwak",arab:"إِذَا اسْتَيْقَظَ أَحَدُكُمْ مِنْ نَوْمِهِ فَلَا يَغْمِسْ يَدَهُ فِي الْإِنَاءِ حَتَّى يَغْسِلَهَا ثَلَاثًا",src:"HR. Muslim no. 278",gr:"sahih"},
 {k:"isyraq",v:7,g:"subuh",after:"dzikir_pagi",arab:"مَنْ صَلَّى الْغَدَاةَ فِي جَمَاعَةٍ ثُمَّ قَعَدَ يَذْكُرُ اللَّهَ حَتَّى تَطْلُعَ الشَّمْسُ ثُمَّ صَلَّى رَكْعَتَيْنِ كَانَتْ لَهُ كَأَجْرِ حَجَّةٍ وَعُمْرَةٍ تَامَّةٍ تَامَّةٍ تَامَّةٍ",src:"HR. Tirmidzi no. 586 (hasan)",gr:"hasan"},
 {k:"senyum_salam",v:12,g:"pagi",arab:"تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ",src:"HR. Tirmidzi no. 1956 (hasan); Muslim no. 54",gr:"hasan"},
 {k:"siwak_wudhu",v:13,g:"sepanjang",arab:"لَوْلَا أَنْ أَشُقَّ عَلَى أُمَّتِي لَأَمَرْتُهُمْ بِالسِّوَاكِ مَعَ كُلِّ وُضُوءٍ",src:"HR. Bukhari no. 887 (mu'allaq), Ahmad no. 9928",gr:"sahih"},
 {k:"keluarga",v:22,g:"maghrib",after:"maghrib",arab:"خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ",src:"HR. Tirmidzi no. 3895; Abu Dawud no. 495",gr:"sahih"},
 {k:"memaafkan",v:27,g:"tidur",arab:"وَلْيَعْفُوا وَلْيَصْفَحُوا ۗ أَلَا تُحِبُّونَ أَن يَغْفِرَ اللَّهُ لَكُمْ",src:"QS. An-Nur [24]: 22; HR. Ahmad no. 12697 (diperselisihkan)",gr:"khilaf"},
 {k:"tidur_awal",v:28,g:"tidur",arab:"كَانَ يَكْرَهُ النَّوْمَ قَبْلَ الْعِشَاءِ وَالْحَدِيثَ بَعْدَهَا",src:"HR. Bukhari no. 568",gr:"sahih"},
 {k:"bidh",v:30,g:"mingguan",w:true,arab:"أَوْصَانِي خَلِيلِي ﷺ بِثَلَاثٍ: صِيَامِ ثَلَاثَةِ أَيَّامٍ مِنْ كُلِّ شَهْرٍ، وَرَكْعَتَيِ الضُّحَى، وَأَنْ أُوتِرَ قَبْلَ أَنْ أَنَامَ",src:"HR. Bukhari no. 1178; Tirmidzi no. 761, Nasa'i no. 2422 (hasan)",gr:"sahih"},
 {k:"jumat",v:31,g:"mingguan",w:true,arab:"غُسْلُ يَوْمِ الْجُمُعَةِ وَاجِبٌ عَلَى كُلِّ مُحْتَلِمٍ",src:"HR. Bukhari no. 879",gr:"sahih"}
];
(function(){
  const find=k=>{ for(const sec of DAILY){ const i=sec.items.findIndex(x=>x.k===k); if(i>=0) return [sec,i]; } return [null,-1]; };
  // move Senin-Kamis fasting into weekly group
  DAILY.push({g:"mingguan",items:[]});
  const [ss,si]=find("sahur"); const sah=ss.items.splice(si,1)[0]; sah.w=true; DAILY[DAILY.length-1].items.push(sah);
  Object.entries(V2MAP).forEach(([i,ks])=>ks.forEach(k=>{ const [sec,j]=find(k); const it=sec.items[j]; it.x=(it.x||[]).concat([V2[i].d]); it.v2=(it.v2||[]).concat([+i]); }));
  NEWI.forEach(n=>{ const v=V2[n.v]; const it={k:n.k,t:v.t,d:v.d,arab:n.arab,src:n.src,gr:n.gr,w:!!n.w,v2:[n.v]};
    const sec=DAILY.find(s=>s.g===n.g); if(n.after){ const j=sec.items.findIndex(x=>x.k===n.after); sec.items.splice(j+1,0,it); } else sec.items.push(it); });
})();
const ALL=DAILY.flatMap(s=>s.items);
const ALLD=ALL.filter(i=>!i.w);
const dn=s=>ALLD.filter(i=>s.includes(i.k)).length;
const GRADE={khilaf:["Diperselisihkan","Disputed","مختلف فيه"],quran:["Al-Qur'an","Qur'an","قرآن"],sahih:["Sahih","Sahih","صحيح"],hasan:["Hasan","Hasan","حسن"]};

/* ---------------- I18N engine ---------------- */
const LANGS=["id","en","ar"];
let lang=store.get("rk_lang",["id","en","ar"].includes((navigator.language||"id").slice(0,2))?(navigator.language||"id").slice(0,2):"id"); if(!LANGS.includes(lang)) lang="id";
const T=k=>(UI[lang]&&UI[lang][k])||UI.id[k]||k;
const tx=o=>o[lang]||o.id;
function applyLang(){
  $$("[data-i18n]").forEach(el=>el.textContent=T(el.dataset.i18n));
  $$("#tilList [data-q]").forEach(b=>{ b.querySelector("span").textContent=T("q"+(+b.dataset.q)); });
  Harian.render();
}
/* ---------------- Theme ---------------- */
const Theme={ init(){ const t=store.get("rk_theme","dark"); this.set(t); $("#themeBtn").addEventListener("click",()=>this.set(document.documentElement.dataset.theme==="light"?"dark":"light")); },
  set(t){ document.documentElement.dataset.theme=t; store.set("rk_theme",t); $("#themeBtn").innerHTML=t==="light"?"☾":"☀"; $("#themeBtn").setAttribute("aria-label",t==="light"?"Dark mode":"Light mode"); } };

/* ---------------- Harian module ---------------- */
const Harian={
  filter:"all", open:new Set(),
  key:()=>"rk_harian_"+dkey(),
  state(){ return store.get(this.key(),[]); },
  save(s){ store.set(this.key(),s); const h=store.get("rk_harian_hist",{}); h[dkey()]=Math.round(dn(s)/ALLD.length*100); store.set("rk_harian_hist",h); },
  streak(){ const h=store.get("rk_harian_hist",{}); let n=0; const d=new Date(); if((h[dkey(d)]||0)<60) d.setDate(d.getDate()-1);
    while((h[dkey(d)]||0)>=60){ n++; d.setDate(d.getDate()-1); } const best=Math.max(n,store.get("rk_harian_best",0)); store.set("rk_harian_best",best); return [n,best]; },
  migrate(){
    if(store.get("rk_harian_migrated_v1",false)) return;
    const h=store.get("rk_harian_hist",{});
    try{ Object.keys(localStorage).forEach(key=>{ const m=key.match(/^rk_daily_(\d{4}-\d{2}-\d{2})$/); if(!m) return;
      const old=store.get(key,[]); if(!Array.isArray(old)) return; const mk="rk_harian_"+m[1]; const cur=new Set(store.get(mk,[]));
      old.forEach(i=>{ ALL.forEach(it=>{ if((it.v2||[]).includes(+i)) cur.add(it.k); }); });
      const arr=[...cur]; store.set(mk,arr); h[m[1]]=Math.round(dn(arr)/ALLD.length*100); }); }catch(e){}
    try{ Object.keys(localStorage).forEach(key=>{ const m=key.match(/^rk_harian_(\d{4}-\d{2}-\d{2})$/); if(m) h[m[1]]=Math.round(dn(store.get(key,[]))/ALLD.length*100); }); }catch(e){}
    store.set("rk_harian_hist",h); store.set("rk_harian_migrated_v1",true);
  },
  init(){
    this.migrate();
    const ob=document.getElementById("openHarianBtn"); if(ob) ob.addEventListener("click",()=>{ const b=document.querySelector('#nav button[data-p="harian"]'); b&&b.click(); });
    const root=$("#harianList");
    root.addEventListener("click",e=>{
      const dl=e.target.closest("[data-dalil]"); if(dl){ const k=dl.dataset.dalil; this.open.has(k)?this.open.delete(k):this.open.add(k); const card=$(`.hitem[data-k="${k}"]`); card.classList.toggle("open"); dl.setAttribute("aria-expanded",card.classList.contains("open")); return; }
      const it=e.target.closest(".hitem .hmain"); if(!it) return; this.toggle(it.parentElement.dataset.k);
    });
    root.addEventListener("keydown",e=>{ if((e.key===" "||e.key==="Enter")&&e.target.classList.contains("hmain")){ e.preventDefault(); this.toggle(e.target.parentElement.dataset.k); } });
    $("#hReset").addEventListener("click",()=>{ if(confirm(T("reset")+"?")){ this.save([]); this.render(); } });
    $("#hExpand").addEventListener("click",()=>{ if(this.open.size<ALL.length) ALL.forEach(i=>this.open.add(i.k)); else this.open.clear(); this.render(); });
    $$("#hFilter button").forEach(b=>b.addEventListener("click",()=>{ this.filter=b.dataset.f; this.render(); }));
    let day=dkey(); setInterval(()=>{ if(dkey()!==day){ day=dkey(); this.render(); } },60000);
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) this.render(); });
  },
  toggle(k){ let s=this.state(); const was=s.includes(k); s=was?s.filter(x=>x!==k):[...s,k]; this.save(s);
    const it=ALL.find(i=>i.k===k); this.render(k);
    if(!was){ if(navigator.vibrate) try{navigator.vibrate(15);}catch(e){}
      if(dn(s)===ALLD.length) window.__rkToast&&window.__rkToast(T("allDone"));
      else if(it.fardhu && ALL.filter(i=>i.fardhu).every(i=>s.includes(i.k))) window.__rkToast&&window.__rkToast(T("fardhuDone")); } },
  render(pulse){
    const root=$("#harianList"); if(!root) return; const s=this.state(); const L=LANGS.indexOf(lang);
    const pct=Math.round(dn(s)/ALLD.length*100); const [st,best]=this.streak();
    const C=2*Math.PI*52; $("#hRing").style.strokeDashoffset=String(C*(1-pct/100)); $("#hRing").style.strokeDasharray=String(C);
    $("#hPct").textContent=pct+"%"; $("#hCount").textContent=`${dn(s)}/${ALLD.length} ${T("done")}`;
    $("#hStreak").textContent=st; $("#hBest").textContent=`${T("best")}: ${best}`;
    $("#hDate").textContent=new Date().toLocaleDateString(lang==="ar"?"ar":lang==="en"?"en-GB":"id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    $("#hExpand").textContent=this.open.size>=ALL.length?T("collapse"):T("expand");
    $$("#hFilter button").forEach(b=>{ b.classList.toggle("on",b.dataset.f===this.filter); b.textContent=T(b.dataset.f==="all"?"filterAll":"filterTodo"); });
    // week bars
    const h=store.get("rk_harian_hist",{}); let wk=""; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const v=h[dkey(d)]||0; const lb=d.toLocaleDateString(lang==="ar"?"ar":lang==="en"?"en-GB":"id-ID",{weekday:"narrow"}); wk+=`<div class="wbar${i===0?" now":""}" title="${dkey(d)}: ${v}%"><i style="height:${Math.max(4,v)}%"></i><span>${lb}</span></div>`; }
    $("#hWeek").innerHTML=wk;
    root.innerHTML=DAILY.map(sec=>{
      const items=sec.items.filter(i=>this.filter==="all"||!s.includes(i.k)); if(!items.length) return "";
      const dn=sec.items.filter(i=>s.includes(i.k)).length;
      return `<div class="hsec"><div class="hsech"><span class="eyebrow">${esc(T("g_"+sec.g))}</span><span class="dim">${dn}/${sec.items.length}</span></div>`+
       items.map(i=>{ const on=s.includes(i.k), op=this.open.has(i.k);
        return `<div class="hitem${on?" on":""}${op?" open":""}${pulse===i.k?" pulse":""}" data-k="${i.k}">
         <div class="hmain" role="checkbox" tabindex="0" aria-checked="${on}">
          <div class="box"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div>
          <div class="htx"><div class="t">${esc(tx(i.t))}${i.w?` <span class="chip">${esc(T("weekly"))}</span>`:""}${i.opt?` <span class="chip">${esc(T("optional"))}</span>`:""}${i.fardhu?` <span class="chip f">فرض</span>`:""}</div><div class="d">${esc(tx(i.d))}</div></div>
          <button class="dbtn" data-dalil="${i.k}" aria-expanded="${op}" aria-label="${esc(T("dalil"))}"><svg viewBox="0 0 24 24"><path d="M4 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg></button>
         </div>
         <div class="hdalil"><div class="inner"><div class="arab" dir="rtl" lang="ar">${esc(i.arab)}</div>
          <div class="hsrc"><span class="grade g-${i.gr}">${esc(GRADE[i.gr][L])}</span><span dir="ltr">${esc(i.src)}</span></div>${(i.x||[]).map(x=>`<p class="hx">${esc(tx(x))}</p>`).join("")}</div></div>
        </div>`; }).join("")+`</div>`;
    }).join("");
  }
};

/* ---------------- Tilawah streaming (HTML5 audio, inside murattal sheet) ---------------- */
const QARI="https://server8.mp3quran.net/afs/"; // Mishary Rashid Alafasy
const FALLBACK="https://download.quranicaudio.com/quran/mishaari_raashid_al_3afaasee/";
const Tilawah={ el:null, cur:null,
  init(){
    $("#tilList").addEventListener("click",e=>{ const b=e.target.closest("[data-q]"); if(!b) return; const c=b.dataset.q; (this.cur===c&&this.el&&!this.el.paused)?this.stop():this.play(c); });
    const v=$("#tilVol"); v.value=store.get("rk_tvol",.6); v.addEventListener("input",()=>{ store.set("rk_tvol",+v.value); if(this.el) this.el.volume=+v.value; });
    const own=$("#audioEl"); if(own) own.addEventListener("play",()=>this.stop());
    const fw=$("#farewellBtn"); if(fw) fw.addEventListener("click",()=>this.stop());
  },
  play(code){ this.stop(); const own=$("#audioEl"); if(own&&!own.paused) own.pause();
    const a=new Audio(); a.loop=true; a.preload="auto"; a.volume=store.get("rk_tvol",.6); this.el=a; this.cur=code; let tried=false;
    a.onerror=()=>{ if(!tried){ tried=true; a.src=FALLBACK+code+".mp3"; a.play().catch(()=>{}); } else { window.__rkToast&&window.__rkToast(T("audioErr")); this.stop(); } };
    a.src=QARI+code+".mp3"; a.play().catch(()=>{}); this.ui(); },
  stop(){ if(this.el){ try{ this.el.pause(); this.el.removeAttribute("src"); this.el.load(); }catch(e){} this.el=null; } this.cur=null; this.ui(); },
  ui(){ $$("#tilList [data-q]").forEach(b=>b.classList.toggle("on",b.dataset.q===this.cur)); const own=$("#audioEl"); const ownPlaying=own&&!own.paused&&own.src;
    $("#murBtn")&&$("#murBtn").classList.toggle("playing",!!this.cur||!!ownPlaying); }
};
window.__rkTilawah=Tilawah;

/* ---------------- Boot ---------------- */
function boot(){
  window.__rkToast=window.__rkToast||(m=>{ const t=$("#toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),2400); });
  document.addEventListener("rk:lang",e=>{ lang=LANGS.includes(e.detail)?e.detail:"id"; applyLang(); });
    Theme.init(); Harian.init(); Tilawah.init(); applyLang();
}
document.readyState==="loading"?document.addEventListener("DOMContentLoaded",boot):boot();
})();

</script>
