<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ruang Khusyuk</title>
<meta name="description" content="Ruang Khusyuk — checklist ibadah harian & kehadiran hati dalam salat">
<meta name="theme-color" content="#090c12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app shell — sticky glass header, scrolling view, fixed bottom tab bar.
   Dark Zen: a lamp-lit prayer room before Fajr. Single deliberate dark theme. */
:root{
  --bg:#090c12; --bg2:#0e131b; --bg3:#131a24;
  --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.085); --line:rgba(255,255,255,.10); --line2:rgba(217,184,106,.28);
  --fg:#ede8dd; --fg2:#bcb6a9; --fg3:#847f74;
  --gold:#d9b86a; --gold2:#f0d79a; --gold3:#b8933f;
  --jade:#7ec9ad; --jade2:#a9e3cc; --rose:#d98b8b; --rose2:#f0b8b8;
  --font-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --font-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-arab:"Amiri","Scheherazade New","Traditional Arabic",serif;
  --font-ar-ui:"Noto Naskh Arabic","Amiri","Segoe UI",system-ui,sans-serif;
  --r:20px; --nav-h:66px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{height:100%;display:flex;flex-direction:column;position:relative;
  background:radial-gradient(900px 520px at 50% -12%,rgba(217,184,106,.11),transparent 60%),radial-gradient(640px 420px at 100% 100%,rgba(126,201,173,.07),transparent 60%),var(--bg)}
.app[dir=rtl]{font-family:var(--font-ar-ui);font-size:16px}
.app[dir=rtl] h1,.app[dir=rtl] h2,.app[dir=rtl] h3,.app[dir=rtl] .brand b{font-family:var(--font-arab);font-weight:700}
.app[dir=rtl] .eyebrow,.app[dir=rtl] .pill,.app[dir=rtl] .tap{letter-spacing:0}
.pattern{position:fixed;inset:0;pointer-events:none;opacity:.045;z-index:0}
.pattern svg{width:100%;height:100%}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(9,12,18,.66);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;flex:none}
.brand .tx{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-family:var(--font-display);font-weight:500;font-size:21px;letter-spacing:.02em;white-space:nowrap}
.brand span{font-size:10.5px;color:var(--fg3);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .right{display:flex;align-items:center;gap:8px;flex:none}
.langseg{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}
.langseg button{border:0;background:transparent;color:var(--fg3);font-family:var(--font-body);font-weight:800;font-size:11px;letter-spacing:.06em;padding:6px 8px;border-radius:999px;cursor:pointer;transition:all .2s}
.langseg button.on{background:rgba(217,184,106,.18);color:var(--gold2)}
.murbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--glass);color:var(--fg2);border-radius:999px;padding:7px 11px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.murbtn .eq{display:flex;gap:2px;align-items:flex-end;height:14px}
.murbtn .eq i{width:3px;background:var(--jade);border-radius:2px;height:4px}
.murbtn.playing .eq i{animation:eq 1.2s ease-in-out infinite}
.murbtn.playing .eq i:nth-child(2){animation-delay:.2s}.murbtn.playing .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.hijri{font-size:11px;color:var(--fg3);letter-spacing:.04em;margin-top:2px}

.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;z-index:1;
  padding-block:16px calc(var(--nav-h) + 28px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{display:none;max-width:740px;margin:0 auto;animation:fade .4s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  background:rgba(9,12,18,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nav button{flex:1;max-width:124px;height:var(--nav-h);background:none;border:0;color:var(--fg3);font-family:inherit;font-size:10.5px;font-weight:600;letter-spacing:.02em;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;transition:color .2s}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.nav button.on{color:var(--gold2)}
.nav button.on svg{transform:translateY(-2px)}
.nav button.on::after{content:"";position:absolute;top:0;width:28px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--jade));box-shadow:0 0 12px rgba(217,184,106,.6)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

h1,h2,h3{font-family:var(--font-display);font-weight:500;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:32px}h2{font-size:25px}h3{font-size:19.5px}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.muted{color:var(--fg2)}.dim{color:var(--fg3);font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0;position:relative}
.card.lit{background:linear-gradient(160deg,rgba(217,184,106,.15),rgba(217,184,106,.03));border-color:var(--line2)}
.card.lit::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px 120px at 85% -10%,rgba(240,215,154,.18),transparent 70%)}
.btn{appearance:none;border:1px solid var(--line);background:var(--glass2);color:var(--fg);font-family:inherit;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;cursor:pointer;transition:transform .15s,background .2s,border-color .2s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:rgba(255,255,255,.12)}.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold3));color:#1a1405;border-color:transparent;box-shadow:0 8px 24px -10px rgba(217,184,106,.6)}
.btn.jade{background:rgba(126,201,173,.16);border-color:rgba(126,201,173,.4);color:var(--jade2)}
.btn.sm{padding:7px 12px;font-size:13px}.btn.ghost{background:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:13px;color:var(--fg2);cursor:pointer;user-select:none;transition:all .2s}
.chip.on{background:rgba(126,201,173,.18);border-color:rgba(126,201,173,.5);color:var(--jade2)}
.chip.gold.on{background:rgba(217,184,106,.18);border-color:rgba(217,184,106,.5);color:var(--gold2)}
.chip.rose.on{background:rgba(217,139,139,.18);border-color:rgba(217,139,139,.5);color:var(--rose2)}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--fg3);font-family:inherit;font-weight:700;font-size:13px;padding:8px 13px;border-radius:999px;cursor:pointer;transition:all .2s}
.seg button.on{background:var(--glass2);color:var(--gold2);box-shadow:inset 0 0 0 1px var(--line2)}
.arab{font-family:var(--font-arab);font-size:28px;line-height:2;direction:rtl;text-align:right;color:var(--gold2)}
.arab.sm{font-size:22px;line-height:1.9}
.arab.center{text-align:center}
.latin{font-style:italic;color:var(--fg2);font-size:14px}
.arti{color:var(--fg)}
.dalil{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--fg3);border-inline-start:2px solid rgba(217,184,106,.45);padding-inline-start:10px}
.dalil b{color:var(--gold);font-weight:700}
.makna{background:rgba(126,201,173,.08);border:1px solid rgba(126,201,173,.25);border-radius:14px;padding:14px;color:var(--jade2);font-family:var(--font-display);font-size:18px;line-height:1.45}
.app[dir=rtl] .makna{font-family:var(--font-arab);font-size:19px}
.reflect{display:none;animation:fade .4s ease}
.item.open .reflect,.sun.open .reflect{display:block}
.item{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.item:first-child{border-top:0;padding-top:0}
.tap{display:inline-flex;align-items:center;gap:6px;color:var(--jade);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;background:none;border:0;font-family:inherit;padding:0}
.tap svg{width:14px;height:14px;transition:transform .3s}
.item.open .tap svg,.sun.open .tap svg{transform:rotate(45deg)}
.ayat{display:grid;grid-template-columns:1fr;gap:10px;padding:12px;border-radius:14px;background:var(--glass);cursor:pointer;transition:background .2s}
.ayat:hover{background:var(--glass2)}
.ayat .jawab{display:none;color:var(--jade2);font-size:14px;border-top:1px dashed rgba(126,201,173,.35);padding-top:8px}
.ayat.open .jawab{display:block;animation:fade .3s}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check .box{width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid var(--fg3);display:grid;place-items:center;transition:all .25s;margin-top:2px}
.check .box svg{width:14px;height:14px;stroke:#1a1405;stroke-width:3;fill:none;opacity:0;transform:scale(.5);transition:all .25s}
.check.on .box{background:var(--gold);border-color:var(--gold)}
.check.on .box svg{opacity:1;transform:none}
.check.on .t{color:var(--fg3);text-decoration:line-through}
.check .t{font-weight:700}
.check .d{font-size:12.5px;color:var(--fg3)}
.progress{height:6px;border-radius:99px;background:var(--glass2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--jade));transition:width .4s ease}

/* daily sunnah ring */
.ringbox{display:flex;align-items:center;gap:16px}
.ringbox svg{width:84px;height:84px;flex:none}
.ringbox .big{font-family:var(--font-display);font-size:34px;line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums}
.slot{margin-top:6px}
.slot .sh{display:flex;align-items:center;gap:10px;padding:10px 0 4px}
.slot .sh .eyebrow{color:var(--jade)}
.slot .sh i{flex:1;height:1px;background:var(--line)}

/* figure / gerakan */
.fig-wrap{position:relative;border-radius:var(--r);background:radial-gradient(420px 280px at 50% 100%,rgba(217,184,106,.13),transparent 70%),var(--bg2);border:1px solid var(--line);overflow:hidden}
.fig-wrap svg.fig{width:100%;height:auto;display:block;max-width:100%}
.layers{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line);background:rgba(0,0,0,.25)}
.legend{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 10px;min-height:0}
.scrub{padding:10px 14px 6px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);background:rgba(0,0,0,.2)}
.scrub input[type=range]{flex:1;accent-color:var(--gold);margin:0}
.ticks{display:flex;font-size:9px;color:var(--fg3);padding:0 10px 8px;letter-spacing:.02em;background:rgba(0,0,0,.2)}
.ticks span{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .pill{white-space:normal;text-transform:none;letter-spacing:0;font-size:11.5px;text-align:start}
.pose-nav{display:flex;align-items:center;gap:8px;justify-content:space-between}
.pose-nav .name{font-family:var(--font-display);font-size:26px;text-align:center;flex:1;min-width:0}
.pose-nav .name small{display:block;font-family:var(--font-body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}
.app[dir=rtl] .pose-nav .name{font-family:var(--font-arab)}
.app[dir=rtl] .pose-nav .name small{font-family:var(--font-ar-ui);letter-spacing:0}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--fg3);font-family:inherit;font-weight:700;font-size:13px;padding:10px 12px;cursor:pointer;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
.tabpane{display:none}.tabpane.on{display:flex;flex-direction:column;gap:12px;animation:fade .3s}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv b{color:var(--gold);font-weight:700;white-space:nowrap}
ul.clean{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;letter-spacing:.06em;font-weight:700;text-transform:uppercase;white-space:nowrap}
.pill.gold{background:rgba(217,184,106,.16);color:var(--gold2)}
.pill.jade{background:rgba(126,201,173,.16);color:var(--jade2)}
.pill.rose{background:rgba(217,139,139,.16);color:var(--rose2)}
.pill.dot::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:6px;background:currentColor;vertical-align:middle}
.wrongbox{display:none;background:rgba(217,139,139,.08);border:1px solid rgba(217,139,139,.3);border-radius:14px;padding:12px 14px;color:var(--rose2);font-size:14px}
.wrongbox.on{display:block;animation:fade .3s}

/* tasbih */
.tasbih{position:relative;display:grid;place-items:center;padding:10px 0}
.tasbih canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bead{position:relative;width:min(68vw,250px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(217,184,106,.45);
  background:radial-gradient(circle at 35% 30%,rgba(240,215,154,.35),rgba(217,184,106,.08) 45%,rgba(0,0,0,.35) 100%);
  display:grid;place-items:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  box-shadow:0 0 0 0 rgba(217,184,106,.3),inset 0 0 40px rgba(0,0,0,.4);transition:transform .12s,box-shadow .4s}
.bead:active{transform:scale(.96)}
.bead .n{font-family:var(--font-display);font-size:64px;line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums}
.bead .of{font-size:12px;letter-spacing:.14em;color:var(--fg3);text-transform:uppercase;margin-top:6px}
.ring{position:absolute;inset:-6px;border-radius:50%;pointer-events:none}
.ring circle{fill:none;stroke-width:3;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}

/* breathing */
.breath{display:grid;place-items:center;height:280px;position:relative}
.breath .orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(169,227,204,.9),rgba(126,201,173,.35) 55%,rgba(126,201,173,.05));box-shadow:0 0 60px rgba(126,201,173,.25);transform:scale(.6);transition:transform 4s cubic-bezier(.4,0,.2,1)}
.breath .lbl{position:absolute;bottom:14px;font-family:var(--font-display);font-size:22px;color:var(--jade2)}
.breath .cnt{position:absolute;top:14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);font-variant-numeric:tabular-nums}

/* overlays & sheets */
.overlay{position:fixed;inset:0;z-index:50;background:#06080c;display:none;place-items:center;text-align:center;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:40px}
.overlay.on{display:grid;animation:fade .8s}
.overlay .q{font-family:var(--font-display);font-size:clamp(24px,5vw,38px);line-height:1.3;max-width:560px;color:var(--gold2)}
.app[dir=rtl] .overlay .q{font-family:var(--font-arab)}
.overlay .src{margin-top:16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}
.overlay .cd{margin-top:36px;font-size:13px;color:var(--fg3);font-variant-numeric:tabular-nums}
.overlay .x{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));inset-inline-end:calc(16px + env(safe-area-inset-right,0px))}
.sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.sheet.on{display:flex}
.sheet .panel{width:100%;max-width:640px;max-height:86%;overflow-y:auto;background:var(--bg3);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.track{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.track:first-child{border-top:0}
.track .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.track.on .nm{color:var(--gold2)}
.player{display:flex;align-items:center;gap:10px;margin-top:12px}
.player .pp{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold3));color:#1a1405;border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.player .pp svg{width:22px;height:22px;fill:currentColor}
.player .bar{flex:1;min-width:0}
.player .bar input{width:100%;accent-color:var(--gold);margin:0}
.player .tm{font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}

/* journal */
input[type=text],textarea,select{width:100%;background:var(--glass);border:1px solid var(--line);border-radius:12px;color:var(--fg);font-family:inherit;font-size:14px;padding:11px 12px}
textarea{min-height:88px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=file]{display:none}
.score{font-family:var(--font-display);font-size:54px;line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums}
.entry{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}

<script>
/* Helper trilingual: T(id, en, ar) */
const T=(id,en,ar)=>({id,en,ar});

/* =========================================================
   BACAAN SALAT — Arab, transliterasi, arti (3 bahasa), dalil (3 bahasa), makna batin (3 bahasa)
   Default fiqh: Syafi'i; riwayat lain ditampilkan sebagai variasi.
   ========================================================= */
const BACAAN = [
  { id:"takbir", nama:T("Takbiratul Ihram","Opening Takbir","تكبيرة الإحرام"), kelompok:"pembuka",
    intro:T("Gerbang masuk. Dengan dua kata ini, segala yang halal di luar salat (bicara, makan, bergerak) menjadi terlarang; itulah sebabnya disebut <em>ihram</em>.",
            "The gate of entry. With these two words, everything permitted outside prayer (speech, food, movement) becomes forbidden; that is why it is called <em>ihram</em>.",
            "باب الدخول. بهاتين الكلمتين يحرم ما كان حلالاً خارج الصلاة من كلام وأكل وحركة، ولذلك سُمّيت <em>تكبيرة الإحرام</em>."),
    items:[
      { arab:"اللهُ أَكْبَرُ", latin:"Allāhu akbar",
        arti:T("Allah Maha Besar.","Allah is the Greatest.","الله أكبر."),
        dalil:[["HR Abu Dawud 61, Tirmidzi 3",T("\"Kunci salat adalah bersuci, pengharamnya adalah takbir, dan penghalalnya adalah salam.\"","\"The key to prayer is purification, what makes it binding is the takbir, and what releases from it is the salam.\"","«مِفْتَاحُ الصَّلَاةِ الطُّهُورُ، وَتَحْرِيمُهَا التَّكْبِيرُ، وَتَحْلِيلُهَا التَّسْلِيمُ»")],
               ["HR Bukhari 735, Muslim 390",T("Nabi ﷺ mengangkat kedua tangan sejajar bahu ketika memulai salat.","The Prophet ﷺ raised both hands level with his shoulders when beginning the prayer.","كان النبي ﷺ يرفع يديه حذو منكبيه إذا افتتح الصلاة.")]],
        makna:T("Bukan sekadar 'Allah Maha Besar', tetapi 'Allah LEBIH besar' — lebih besar dari pekerjaan yang kutinggalkan di meja, dari kecemasan yang kubawa, dari siapa pun yang kuharapkan. Saat tangan terangkat, bayangkan semua itu dilempar ke belakang punggung. Yang di hadapanmu kini hanya Dia.",
                "Not merely 'Allah is great' but 'Allah is GREATER' — greater than the work I left on the desk, than the worry I carry, than anyone I hope in. As the hands rise, imagine all of it thrown behind your back. Before you now is only Him.",
                "ليست «الله عظيم» فحسب، بل «الله أكبر»: أكبر من العمل الذي تركتُه على المكتب، ومن القلق الذي أحمله، ومن كل من أرجوه. حين ترفع يديك تخيّل أنك تلقي كل ذلك خلف ظهرك؛ فلم يبق أمامك إلا هو.") }
    ]},
  { id:"iftitah", nama:T("Doa Iftitah","Opening Supplication","دعاء الاستفتاح"), kelompok:"pembuka",
    intro:T("Hukumnya sunnah, dibaca pelan setelah takbir pertama. Nabi ﷺ mengamalkan beberapa redaksi yang berbeda; semua di bawah ini sahih. Pilih satu, pahami, dan sesekali bergantilah agar lisan tidak berjalan tanpa hati.",
            "Recommended (sunnah), recited quietly after the first takbir. The Prophet ﷺ used several different wordings; all below are authentic. Choose one, understand it, and alternate occasionally so the tongue does not run ahead of the heart.",
            "سنّة تُقرأ سرًّا بعد التكبيرة الأولى. وردت عن النبي ﷺ صيغ متعددة كلها صحيحة. اختر واحدة وافهمها، وبدّل أحيانًا حتى لا يجري اللسان بلا قلب."),
    items:[
      { judul:T("Riwayat 1 — Abu Hurairah (dibaca Nabi ﷺ saat diam sejenak setelah takbir)","Narration 1 — Abu Hurairah (recited during the Prophet's ﷺ brief silence after the takbir)","الرواية الأولى — أبو هريرة (ما كان يقوله ﷺ في سكتته بعد التكبير)"),
        arab:"اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ، اللَّهُمَّ نَقِّنِي مِنْ خَطَايَايَ كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ اغْسِلْنِي مِنْ خَطَايَايَ بِالثَّلْجِ وَالْمَاءِ وَالْبَرَدِ",
        latin:"Allāhumma bā'id bainī wa baina khaṭāyāya kamā bā'adta bainal-masyriqi wal-maghrib. Allāhumma naqqinī min khaṭāyāya kamā yunaqqats-tsaubul-abyaḍu minad-danas. Allāhummaghsilnī min khaṭāyāya bits-tsalji wal-mā'i wal-barad.",
        arti:T("Ya Allah, jauhkanlah antara aku dan kesalahan-kesalahanku sebagaimana Engkau jauhkan timur dan barat. Ya Allah, bersihkanlah aku dari kesalahan-kesalahanku sebagaimana pakaian putih dibersihkan dari noda. Ya Allah, cucilah aku dari kesalahan-kesalahanku dengan salju, air, dan embun.",
               "O Allah, distance me from my sins as You have distanced the East from the West. O Allah, cleanse me of my sins as a white garment is cleansed of dirt. O Allah, wash me of my sins with snow, water, and hail.",
               "اللهم باعد بيني وبين خطاياي كما باعدت بين المشرق والمغرب، اللهم نقّني من خطاياي كما يُنقّى الثوب الأبيض من الدنس، اللهم اغسلني من خطاياي بالثلج والماء والبرد."),
        dalil:[["HR Bukhari 744, Muslim 598",T("Abu Hurairah bertanya mengapa Nabi ﷺ diam antara takbir dan bacaan; beliau menjawab bahwa beliau membaca doa ini.","Abu Hurairah asked why the Prophet ﷺ was silent between the takbir and the recitation; he replied that he recited this supplication.","سأل أبو هريرة النبي ﷺ عن سكوته بين التكبير والقراءة، فأخبره أنه يقول هذا الدعاء.")]],
        makna:T("Tiga permohonan berlapis: dijauhkan dari dosa yang akan datang, dibersihkan dari yang sudah lewat, dan dicuci dengan tiga bahan yang semuanya dingin — karena dosa itu panas, dan ampunan menyejukkan. Masuklah ke salat dengan sadar bahwa engkau sedang dicuci.",
                "Three layered requests: to be kept from future sins, cleansed of past ones, and washed with three things that are all cold — because sin burns, and forgiveness cools. Enter the prayer aware that you are being washed.",
                "ثلاث طلبات متدرجة: المباعدة عن الذنوب الآتية، والتنقية من الماضية، والغسل بثلاثة أشياء كلها باردة؛ لأن الذنب حرارة والمغفرة برد. ادخل الصلاة وأنت تشعر أنك تُغسل.") },
      { judul:T("Riwayat 2 — Ali bin Abi Thalib (doa Wajjahtu, dipakai luas di Indonesia)","Narration 2 — Ali ibn Abi Talib (the Wajjahtu supplication, widely used in Indonesia)","الرواية الثانية — علي بن أبي طالب (دعاء «وجّهت»)"),
        arab:"وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ، إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ، لَا شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ",
        latin:"Wajjahtu wajhiya lilladzī faṭaras-samāwāti wal-arḍa ḥanīfan wa mā ana minal-musyrikīn. Inna ṣalātī wa nusukī wa maḥyāya wa mamātī lillāhi rabbil-'ālamīn. Lā syarīka lahu wa bidzālika umirtu wa ana minal-muslimīn.",
        arti:T("Kuhadapkan wajahku kepada Dzat yang menciptakan langit dan bumi dengan lurus, dan aku bukan termasuk orang musyrik. Sesungguhnya salatku, ibadahku, hidupku, dan matiku hanya untuk Allah, Tuhan semesta alam. Tiada sekutu bagi-Nya; dengan itulah aku diperintah, dan aku termasuk orang-orang yang berserah diri.",
               "I have turned my face toward the One who created the heavens and the earth, upright, and I am not of the polytheists. Indeed my prayer, my worship, my living and my dying are for Allah, Lord of the worlds. He has no partner; with this I was commanded, and I am of those who submit.",
               "وجّهت وجهي للذي فطر السماوات والأرض حنيفًا وما أنا من المشركين، إن صلاتي ونسكي ومحياي ومماتي لله رب العالمين، لا شريك له وبذلك أُمرت وأنا من المسلمين."),
        dalil:[["HR Muslim 771",T("Dari Ali bin Abi Thalib; redaksi lengkapnya berlanjut: \"Allāhumma antal-malik, lā ilāha illā anta, anta rabbī wa ana 'abduka, ẓalamtu nafsī wa'taraftu bidzanbī faghfir lī dzunūbī jamī'an...\" (Ya Allah, Engkau Raja, tiada tuhan selain Engkau. Engkau Tuhanku dan aku hamba-Mu. Aku telah menzalimi diriku dan mengakui dosaku, maka ampunilah seluruh dosaku).","From Ali ibn Abi Talib; the full wording continues: \"O Allah, You are the King, there is no god but You. You are my Lord and I am Your servant. I have wronged myself and I confess my sin, so forgive me all my sins...\"","عن علي بن أبي طالب؛ وتمامه: «اللهم أنت الملك لا إله إلا أنت، أنت ربي وأنا عبدك، ظلمت نفسي واعترفت بذنبي فاغفر لي ذنوبي جميعًا...»")],
               ["QS Al-An'am 79 & 162–163",T("Kalimatnya diambil dari ucapan Nabi Ibrahim dan perintah Allah kepada Nabi Muhammad ﷺ.","Its words are taken from the speech of Prophet Ibrahim and Allah's command to Prophet Muhammad ﷺ.","ألفاظه مأخوذة من قول إبراهيم عليه السلام ومن أمر الله لنبيه ﷺ.")]],
        makna:T("Ini deklarasi orientasi hidup. 'Wajah' dalam bahasa Arab mewakili seluruh diri. Engkau sedang memutuskan: arah hadapku bukan ke pasar, bukan ke proyek, bukan ke penilaian manusia. Lalu dilanjutkan pengakuan paling jujur seorang hamba: 'aku telah menzalimi diriku'. Salat dimulai dari kejujuran, bukan dari merasa layak.",
                "This is a declaration of life's orientation. 'Face' in Arabic stands for the whole self. You are deciding: I face not the market, not the project, not people's judgment. Then follows a servant's most honest confession: 'I have wronged myself.' Prayer begins with honesty, not with feeling worthy.",
                "هذا إعلان لوجهة الحياة. «الوجه» في العربية يعبّر عن الذات كلها. أنت تقرر: وجهتي ليست السوق ولا المشروع ولا أحكام الناس. ثم يأتي أصدق اعتراف للعبد: «ظلمت نفسي». تبدأ الصلاة بالصدق لا بالشعور بالاستحقاق.") },
      { judul:T("Riwayat 3 — Abu Sa'id al-Khudri & Aisyah (Subhanaka)","Narration 3 — Abu Sa'id al-Khudri & Aisha (Subhanaka)","الرواية الثالثة — أبو سعيد الخدري وعائشة («سبحانك اللهم»)"),
        arab:"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلَا إِلَهَ غَيْرُكَ",
        latin:"Subḥānakallāhumma wa biḥamdika, wa tabārakasmuka, wa ta'ālā jadduka, wa lā ilāha ghairuk.",
        arti:T("Maha Suci Engkau ya Allah, dengan memuji-Mu. Maha Berkah nama-Mu, Maha Tinggi keagungan-Mu, dan tiada tuhan selain Engkau.","Glory be to You, O Allah, and with Your praise. Blessed is Your name, exalted is Your majesty, and there is no god besides You.","سبحانك اللهم وبحمدك، وتبارك اسمك، وتعالى جدّك، ولا إله غيرك."),
        dalil:[["HR Abu Dawud 775–776, Tirmidzi 242–243, Ibnu Majah 804",T("Dinilai sahih oleh al-Albani dengan gabungan jalur; diamalkan Umar bin Khattab dengan suara keras untuk mengajari manusia (HR Muslim 399).","Graded authentic by al-Albani through combined chains; Umar ibn al-Khattab recited it aloud to teach the people (Muslim 399).","صحّحه الألباني بمجموع طرقه؛ وكان عمر بن الخطاب يجهر به ليعلّم الناس (مسلم 399).")]],
        makna:T("Empat pernyataan tentang Allah, bukan tentang diri: suci dari kekurangan, berkah nama-Nya, tinggi keagungan-Nya, tunggal ketuhanan-Nya. Ini iftitah bagi hati yang ingin langsung tenggelam dalam pengagungan, tanpa banyak bicara tentang dirinya sendiri.","Four statements about Allah, none about the self: free of all deficiency, blessed in His name, exalted in majesty, alone in divinity. An opening for a heart that wants to sink straight into glorification without speaking much of itself.","أربع جمل كلها عن الله لا عن النفس: منزّه عن النقص، مبارك اسمه، عظيم جلاله، متفرد بالألوهية. استفتاح لقلب يريد أن يغرق في التعظيم مباشرة دون أن يتحدث كثيرًا عن نفسه.") },
      { judul:T("Riwayat 4 — Ibnu Umar (takbir, tahmid, tasbih)","Narration 4 — Ibn Umar (takbir, tahmid, tasbih)","الرواية الرابعة — ابن عمر (تكبير وتحميد وتسبيح)"),
        arab:"اللهُ أَكْبَرُ كَبِيرًا، وَالْحَمْدُ لِلَّهِ كَثِيرًا، وَسُبْحَانَ اللهِ بُكْرَةً وَأَصِيلًا",
        latin:"Allāhu akbaru kabīrā, wal-ḥamdu lillāhi katsīrā, wa subḥānallāhi bukratan wa aṣīlā.",
        arti:T("Allah Maha Besar dengan sebesar-besarnya, segala puji bagi Allah dengan pujian yang banyak, dan Maha Suci Allah pada waktu pagi dan petang.","Allah is the Greatest, truly great; abundant praise be to Allah; and glory be to Allah morning and evening.","الله أكبر كبيرًا، والحمد لله كثيرًا، وسبحان الله بكرةً وأصيلًا."),
        dalil:[["HR Muslim 601",T("Seorang sahabat mengucapkannya; Nabi ﷺ berkata: \"Aku takjub kepadanya, dibukakan baginya pintu-pintu langit.\" Sejak itu Ibnu Umar tidak pernah meninggalkannya.","A Companion said it; the Prophet ﷺ remarked: \"I marveled at it — the gates of heaven were opened for it.\" Ibn Umar never left it afterward.","قالها رجل من الصحابة فقال ﷺ: «عجبت لها، فُتحت لها أبواب السماء»، فما تركها ابن عمر بعد ذلك.")]],
        makna:T("Doa yang 'dibukakan pintu-pintu langit' untuknya. Pendek, padat, dan sering digabungkan di Indonesia dengan doa Wajjahtu. Bayangkan kalimat ini naik, dan pintu terbuka.","The supplication for which 'the gates of heaven were opened'. Short, dense, and in Indonesia often joined to the Wajjahtu. Picture these words rising, and a gate opening.","الدعاء الذي «فُتحت له أبواب السماء». قصير مركّز، ويُجمع في إندونيسيا غالبًا مع «وجّهت». تخيّل هذه الكلمات تصعد والباب يُفتح.") }
    ]},
  { id:"fatihah", nama:T("Al-Fatihah","Al-Fatihah","الفاتحة"), kelompok:"rukun",
    intro:T("Rukun salat; tanpa Al-Fatihah tidak ada salat (HR Bukhari 756, Muslim 394). Dalam hadits qudsi, Allah membaginya dua: separuh untuk-Nya, separuh untuk hamba — dan <strong>Allah menjawab setiap ayat</strong>. Ketuk tiap ayat untuk melihat jawaban-Nya (HR Muslim 395).",
            "A pillar of prayer; without Al-Fatihah there is no prayer (Bukhari 756, Muslim 394). In a hadith qudsi, Allah divides it in two: half for Him, half for the servant — and <strong>Allah answers every verse</strong>. Tap each verse to see His reply (Muslim 395).",
            "ركن من أركان الصلاة؛ «لا صلاة لمن لم يقرأ بفاتحة الكتاب» (البخاري 756، مسلم 394). وفي الحديث القدسي قسمها الله نصفين: نصف له ونصف لعبده، <strong>ويجيب الله عن كل آية</strong>. اضغط على كل آية لترى جوابه (مسلم 395)."),
    fatihah:[
      ["بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ","Bismillāhir-raḥmānir-raḥīm",T("Dengan nama Allah Yang Maha Pengasih, Maha Penyayang.","In the name of Allah, the Most Gracious, the Most Merciful.","بسم الله الرحمن الرحيم."),T("Memulai dengan nama-Nya: setiap ayat di bawah ini kuucapkan bukan dengan kekuatanku.","Beginning with His name: every verse below I utter not by my own strength.","البدء باسمه: كل آية بعدها أقولها لا بقوتي.")],
      ["الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","Al-ḥamdu lillāhi rabbil-'ālamīn",T("Segala puji bagi Allah, Tuhan seluruh alam.","All praise is for Allah, Lord of the worlds.","الحمد لله رب العالمين."),T("Allah menjawab: «Hamba-Ku telah memuji-Ku.»","Allah replies: «My servant has praised Me.»","يقول الله: «حَمِدَني عبدي».")],
      ["الرَّحْمَنِ الرَّحِيمِ","Ar-raḥmānir-raḥīm",T("Yang Maha Pengasih, Maha Penyayang.","The Most Gracious, the Most Merciful.","الرحمن الرحيم."),T("Allah menjawab: «Hamba-Ku telah menyanjung-Ku.»","Allah replies: «My servant has extolled Me.»","يقول الله: «أثنى عليّ عبدي».")],
      ["مَالِكِ يَوْمِ الدِّينِ","Māliki yaumid-dīn",T("Pemilik hari pembalasan.","Master of the Day of Judgment.","مالك يوم الدين."),T("Allah menjawab: «Hamba-Ku telah mengagungkan-Ku.» (dalam riwayat lain: «Hamba-Ku telah menyerahkan urusannya kepada-Ku.»)","Allah replies: «My servant has glorified Me.» (another narration: «My servant has entrusted his affairs to Me.»)","يقول الله: «مجّدني عبدي» (وفي رواية: «فوّض إليّ عبدي»).")],
      ["إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","Iyyāka na'budu wa iyyāka nasta'īn",T("Hanya kepada-Mu kami menyembah dan hanya kepada-Mu kami memohon pertolongan.","You alone we worship, and You alone we ask for help.","إياك نعبد وإياك نستعين."),T("Allah menjawab: «Ini antara Aku dan hamba-Ku, dan bagi hamba-Ku apa yang ia minta.» — Inilah titik tengah: separuh pertama milik Allah, separuh kedua milik kita.","Allah replies: «This is between Me and My servant, and My servant shall have what he asks.» — The midpoint: the first half is Allah's, the second half is ours.","يقول الله: «هذا بيني وبين عبدي، ولعبدي ما سأل». هذه نقطة الوسط: النصف الأول لله والنصف الثاني لنا.")],
      ["اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","Ihdinaṣ-ṣirāṭal-mustaqīm",T("Tunjukilah kami jalan yang lurus.","Guide us to the straight path.","اهدنا الصراط المستقيم."),T("Allah menjawab: «Ini untuk hamba-Ku, dan bagi hamba-Ku apa yang ia minta.»","Allah replies: «This is for My servant, and My servant shall have what he asks.»","يقول الله: «هذا لعبدي، ولعبدي ما سأل».")],
      ["صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ","Ṣirāṭalladzīna an'amta 'alaihim ghairil-maghḍūbi 'alaihim walaḍ-ḍāllīn",T("Jalan orang-orang yang Engkau beri nikmat, bukan jalan mereka yang dimurkai dan bukan pula jalan mereka yang sesat.","The path of those You have favored, not of those who earned anger, nor of those astray.","صراط الذين أنعمت عليهم غير المغضوب عليهم ولا الضالين."),T("Allah menjawab: «Ini untuk hamba-Ku, dan bagi hamba-Ku apa yang ia minta.» — Lalu ucapkan āmīn; jika bertepatan dengan āmīn malaikat, diampuni dosa yang telah lalu (HR Bukhari 780).","Allah replies: «This is for My servant, and My servant shall have what he asks.» — Then say āmīn; if it coincides with the angels' āmīn, past sins are forgiven (Bukhari 780).","يقول الله: «هذا لعبدي، ولعبدي ما سأل». ثم قل آمين؛ فمن وافق تأمينه تأمين الملائكة غُفر له ما تقدم من ذنبه (البخاري 780).")]
    ],
    items:[
      { makna:T("Al-Fatihah adalah <em>dialog</em>, bukan monolog. Berhentilah sejenak di akhir tiap ayat seperti Nabi ﷺ yang membacanya terputus-putus ayat demi ayat (HR Abu Dawud 4001). Pada 'iyyāka na'budu' rasakan hanya ada dua pihak di ruangan itu. Pada 'ihdinā' mintalah sungguh-sungguh: inilah doa yang paling sering kita ucapkan dan paling jarang kita maksudkan.",
                "Al-Fatihah is a <em>dialogue</em>, not a monologue. Pause briefly at the end of each verse as the Prophet ﷺ did, verse by verse (Abu Dawud 4001). At 'iyyāka na'budu' feel that only two parties are in the room. At 'ihdinā' ask in earnest: it is the prayer we say most often and mean least.",
                "الفاتحة <em>حوار</em> لا كلام من طرف واحد. قف قليلًا عند نهاية كل آية كما كان ﷺ يقطّع قراءته آية آية (أبو داود 4001). عند «إياك نعبد» اشعر أنه لا أحد في الغرفة إلا طرفان. وعند «اهدنا» اسأل بصدق؛ فهو أكثر دعاء نردده وأقلّه قصدًا.") }
    ]},
  { id:"surah", nama:T("Surah Pendek","Short Surahs","قصار السور"), kelompok:"rukun",
    intro:T("Sunnah setelah Al-Fatihah pada dua rakaat pertama. Tiga surah di bawah pendek, tetapi tiap-tiapnya punya bobot yang Nabi ﷺ sendiri tegaskan.","Recommended after Al-Fatihah in the first two rak'ahs. The three surahs below are short, but each carries a weight the Prophet ﷺ himself affirmed.","سنّة بعد الفاتحة في الركعتين الأوليين. السور الثلاث التالية قصيرة، لكن لكل منها وزن أكّده النبي ﷺ بنفسه."),
    items:[
      { judul:T("Al-Ikhlas — sepertiga Al-Qur'an","Al-Ikhlas — a third of the Qur'an","الإخلاص — ثلث القرآن"),
        arab:"قُلْ هُوَ اللهُ أَحَدٌ ۝ اللهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ",
        latin:"Qul huwallāhu aḥad. Allāhuṣ-ṣamad. Lam yalid wa lam yūlad. Wa lam yakul lahū kufuwan aḥad.",
        arti:T("Katakanlah: Dialah Allah, Yang Maha Esa. Allah tempat bergantung segala sesuatu. Dia tidak beranak dan tidak diperanakkan. Dan tidak ada sesuatu pun yang setara dengan-Nya.","Say: He is Allah, the One. Allah, the Eternal Refuge. He neither begets nor is born. And there is none comparable to Him.","قل هو الله أحد، الله الصمد، لم يلد ولم يولد، ولم يكن له كفوًا أحد."),
        dalil:[["HR Bukhari 5013, Muslim 811",T("\"Surah ini menyamai sepertiga Al-Qur'an.\"","\"This surah equals a third of the Qur'an.\"","«إنها لتعدل ثلث القرآن».")],["HR Bukhari 7375",T("Seorang imam selalu mengakhiri bacaannya dengan surah ini karena mencintainya; Nabi ﷺ: \"Kecintaanmu kepadanya memasukkanmu ke surga.\"","An imam always ended his recitation with it because he loved it; the Prophet ﷺ said: \"Your love for it has admitted you to Paradise.\"","كان رجل يختم قراءته بها لحبه إياها، فقال ﷺ: «حبك إياها أدخلك الجنة».")]],
        makna:T("<em>Aṣ-Ṣamad</em>: Yang semua makhluk bergantung kepada-Nya, sedang Dia tak bergantung pada apa pun. Saat membacanya, periksa: kepada siapa sebenarnya aku bergantung hari ini — kepada klien, kepada bank, kepada kesehatanku? Surah ini meluruskan arah sandaran.","<em>Aṣ-Ṣamad</em>: the One all creation depends on, who depends on nothing. As you recite it, check: on whom do I actually depend today — a client, a bank, my health? This surah straightens the direction of reliance.","<em>الصمد</em>: الذي يفتقر إليه كل مخلوق ولا يفتقر إلى شيء. حين تقرؤها راجع نفسك: على من أعتمد اليوم حقًّا؟ على العميل أم المصرف أم صحتي؟ هذه السورة تقوّم اتجاه الاعتماد.") },
      { judul:T("Al-Kautsar — surah terpendek, janji terbesar","Al-Kawthar — the shortest surah, the greatest promise","الكوثر — أقصر سورة وأعظم وعد"),
        arab:"إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ ۝ فَصَلِّ لِرَبِّكَ وَانْحَرْ ۝ إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ",
        latin:"Innā a'ṭainākal-kautsar. Fa ṣalli li rabbika wanḥar. Inna syāni'aka huwal-abtar.",
        arti:T("Sungguh, Kami telah memberimu nikmat yang banyak. Maka laksanakanlah salat karena Tuhanmu dan berkurbanlah. Sungguh, orang yang membencimu, dialah yang terputus.","Indeed, We have granted you abundance. So pray to your Lord and sacrifice. Indeed, your enemy is the one cut off.","إنا أعطيناك الكوثر، فصلّ لربك وانحر، إن شانئك هو الأبتر."),
        dalil:[["HR Muslim 400",T("Nabi ﷺ menjelaskan Al-Kautsar adalah sungai di surga yang dijanjikan Allah kepadanya.","The Prophet ﷺ explained that Al-Kawthar is a river in Paradise promised to him by Allah.","بيّن ﷺ أن الكوثر نهر في الجنة وعده الله إياه.")]],
        makna:T("Urutannya mengajar: nikmat dulu, baru perintah salat. Salat adalah <em>respons</em> atas pemberian, bukan transaksi untuk mendapatkannya. Masuklah ke rakaat ini sebagai orang yang sudah diberi.","The order teaches: the gift comes first, then the command to pray. Prayer is a <em>response</em> to what was given, not a transaction to obtain it. Enter this rak'ah as one who has already been given.","الترتيب يعلّم: النعمة أولًا ثم الأمر بالصلاة. الصلاة <em>استجابة</em> للعطاء لا صفقة لنيله. ادخل هذه الركعة بوصفك من أُعطي.") },
      { judul:T("Al-'Ashr — ringkasan jalan keselamatan","Al-'Asr — the summary of the path to salvation","العصر — خلاصة طريق النجاة"),
        arab:"وَالْعَصْرِ ۝ إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ ۝ إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ",
        latin:"Wal-'aṣr. Innal-insāna lafī khusr. Illalladzīna āmanū wa 'amiluṣ-ṣāliḥāti wa tawāṣau bil-ḥaqqi wa tawāṣau biṣ-ṣabr.",
        arti:T("Demi masa. Sungguh, manusia berada dalam kerugian, kecuali orang-orang yang beriman dan mengerjakan kebajikan serta saling menasihati untuk kebenaran dan saling menasihati untuk kesabaran.","By time. Indeed, mankind is in loss, except those who believe and do righteous deeds and counsel one another to truth and counsel one another to patience.","والعصر، إن الإنسان لفي خسر، إلا الذين آمنوا وعملوا الصالحات وتواصوا بالحق وتواصوا بالصبر."),
        dalil:[["Imam Syafi'i (Tafsir Ibnu Katsir)",T("\"Seandainya manusia merenungkan surah ini, niscaya cukuplah bagi mereka.\"","\"If people reflected on this surah, it would suffice them.\"","«لو تدبّر الناس هذه السورة لكفتهم».")],["HR Thabrani (al-Mu'jam al-Ausath)",T("Para sahabat bila bertemu tidak berpisah sebelum salah satunya membacakan Al-'Ashr kepada yang lain.","When Companions met, they would not part until one recited Al-'Asr to the other.","كان الصحابة إذا التقيا لم يتفرقا حتى يقرأ أحدهما على الآخر سورة العصر.")]],
        makna:T("Allah bersumpah dengan waktu — modal yang paling sering kau rasa kurang. Empat syarat selamat; dua pertama tentang dirimu, dua terakhir tentang orang lain. Ini surah untuk pemimpin: imanmu belum lengkap sebelum kau menasihati dan sabar menanggung orang-orang di bawahmu.","Allah swears by time — the capital you most often feel short of. Four conditions for safety; the first two about you, the last two about others. A surah for leaders: your faith is incomplete until you counsel, and patiently bear, those in your care.","أقسم الله بالوقت، وهو رأس المال الذي تشعر دائمًا بنقصه. أربعة شروط للنجاة: اثنان عنك واثنان عن غيرك. سورة للقادة: إيمانك لا يكتمل حتى تنصح من تحت يدك وتصبر عليهم.") }
    ]},
  { id:"ruku", nama:T("Ruku'","Bowing (Ruku')","الركوع"), kelompok:"rukun",
    intro:T("Membungkuk dengan punggung rata dan tumaninah. Bacaan intinya adalah pengagungan (<em>ta'zhim</em>); Nabi ﷺ melarang membaca Al-Qur'an dalam ruku' dan sujud (HR Muslim 480).","Bowing with a level back and stillness. Its core recitation is glorification (<em>ta'zhim</em>); the Prophet ﷺ forbade reciting Qur'an in bowing and prostration (Muslim 480).","الانحناء مع استواء الظهر والطمأنينة. جوهر الذكر فيه التعظيم؛ ونهى ﷺ عن قراءة القرآن في الركوع والسجود (مسلم 480)."),
    items:[
      { arab:"سُبْحَانَ رَبِّيَ الْعَظِيمِ", latin:"Subḥāna rabbiyal-'aẓīm (3×)", arti:T("Maha Suci Tuhanku Yang Maha Agung.","Glory be to my Lord, the Most Great.","سبحان ربي العظيم."),
        dalil:[["HR Muslim 772",T("Hudzaifah salat bersama Nabi ﷺ; dalam ruku' beliau membaca 'Subḥāna rabbiyal-'aẓīm'.","Hudhayfah prayed with the Prophet ﷺ; in bowing he said 'Subḥāna rabbiyal-'aẓīm'.","صلّى حذيفة مع النبي ﷺ فكان يقول في ركوعه: «سبحان ربي العظيم».")],["HR Abu Dawud 869, Ibnu Majah 887",T("Ketika turun ayat 'Fasabbiḥ bismi rabbikal-'aẓīm', Nabi ﷺ bersabda: \"Jadikanlah ia dalam ruku' kalian.\"","When 'Fasabbiḥ bismi rabbikal-'aẓīm' was revealed, the Prophet ﷺ said: \"Place it in your bowing.\"","لما نزلت ﴿فسبّح باسم ربك العظيم﴾ قال ﷺ: «اجعلوها في ركوعكم».")]],
        makna:T("Posisi tubuh dan kalimat saling menegaskan: kepala yang biasanya tegak kini setara dengan punggung, dan lisan berkata 'Yang Maha Agung'. Inilah tempat menurunkan ego seorang direktur, seorang ayah, seorang yang biasa didengar. Rasakan tulang punggungmu tunduk.","Posture and words confirm each other: the head usually held high is now level with the back, and the tongue says 'the Most Great'. This is where the ego of a director, a father, a man used to being heard, is lowered. Feel your spine submit.","الهيئة والكلمة تؤكد إحداهما الأخرى: الرأس الذي اعتاد الارتفاع صار مستويًا مع الظهر، واللسان يقول «العظيم». هنا يُخفض كبرياء المدير والأب ومن اعتاد أن يُسمع. اشعر بعمودك الفقري يخضع.") },
      { judul:T("Tambahan yang dicontohkan Nabi ﷺ","Additions practiced by the Prophet ﷺ","زيادات ثابتة عنه ﷺ"),
        arab:"سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي", latin:"Subḥānakallāhumma rabbanā wa biḥamdika, allāhummaghfir lī", arti:T("Maha Suci Engkau ya Allah Tuhan kami, dengan memuji-Mu. Ya Allah, ampunilah aku.","Glory be to You, O Allah our Lord, and with Your praise. O Allah, forgive me.","سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي."),
        dalil:[["HR Bukhari 794, Muslim 484",T("Aisyah: Nabi ﷺ memperbanyak membacanya dalam ruku' dan sujud, mengamalkan perintah QS An-Nashr 3.","Aisha: the Prophet ﷺ said it often in bowing and prostration, acting on Surah An-Nasr 3.","عائشة: كان ﷺ يكثر منه في ركوعه وسجوده يتأوّل القرآن (النصر 3).")],["HR Muslim 487",T("Juga: 'Subbūḥun quddūsun rabbul-malā'ikati war-rūḥ' (Maha Suci, Maha Kudus, Tuhan para malaikat dan Jibril).","Also: 'Subbūḥun quddūsun rabbul-malā'ikati war-rūḥ' (All-Glorious, All-Holy, Lord of the angels and the Spirit).","وأيضًا: «سبّوح قدّوس رب الملائكة والروح».")]],
        makna:T("Pengagungan diikuti permohonan ampun. Semakin kau sadar betapa Agung Dia, semakin kau sadar betapa kurangnya pengabdianmu.","Glorification followed by a plea for forgiveness. The more you realize how Great He is, the more you realize how little your service is.","تعظيم يتبعه استغفار. كلما أدركت عظمته أدركت تقصيرك في عبادته.") }
    ]},
  { id:"itidal", nama:T("I'tidal","Rising (I'tidal)","الاعتدال"), kelompok:"rukun",
    intro:T("Bangkit dari ruku' hingga berdiri tegak sempurna. Nabi ﷺ berdiri lama di sini hingga sahabat mengira beliau lupa (HR Bukhari 800). Jangan dicepat-cepatkan.","Rising from bowing to stand fully upright. The Prophet ﷺ stood so long here that Companions thought he had forgotten (Bukhari 800). Do not rush it.","الرفع من الركوع حتى الاستواء التام. كان ﷺ يطيل القيام هنا حتى يُظن أنه نسي (البخاري 800). لا تستعجل."),
    items:[
      { arab:"سَمِعَ اللهُ لِمَنْ حَمِدَهُ", latin:"Sami'allāhu liman ḥamidah", arti:T("Allah mendengar orang yang memuji-Nya.","Allah hears the one who praises Him.","سمع الله لمن حمده."),
        dalil:[["HR Bukhari 689, Muslim 411",T("Diucapkan saat mengangkat punggung dari ruku'.","Said while raising the back from bowing.","يُقال عند رفع الظهر من الركوع.")]],
        makna:T("Kalimat ini bukan doa, tetapi <em>pengumuman</em>: Allah mendengar. Maka pujian sesudahnya diucapkan oleh orang yang yakin sedang didengar.","Not a supplication but an <em>announcement</em>: Allah hears. So the praise that follows is spoken by one certain of being heard.","هذه ليست دعاءً بل <em>إعلان</em>: الله يسمع. فالحمد الذي يليه يقوله من يوقن أنه مسموع.") },
      { arab:"رَبَّنَا وَلَكَ الْحَمْدُ، حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ", latin:"Rabbanā wa lakal-ḥamd, ḥamdan katsīran ṭayyiban mubārakan fīh", arti:T("Wahai Tuhan kami, bagi-Mu segala puji; pujian yang banyak, baik, dan diberkahi.","Our Lord, to You is all praise; abundant, pure, blessed praise.","ربنا ولك الحمد، حمدًا كثيرًا طيبًا مباركًا فيه."),
        dalil:[["HR Bukhari 796",T("\"Rabbanā wa lakal-ḥamd\" — bila ucapan makmum bertepatan dengan ucapan malaikat, diampuni dosanya yang lalu.","\"Rabbanā wa lakal-ḥamd\" — when the follower's words coincide with the angels', past sins are forgiven.","«ربنا ولك الحمد»: من وافق قوله قول الملائكة غُفر له ما تقدم من ذنبه.")],["HR Bukhari 799",T("Seorang sahabat menambahkan 'ḥamdan katsīran ṭayyiban mubārakan fīh'; Nabi ﷺ: \"Aku melihat lebih dari tiga puluh malaikat berlomba siapa yang lebih dulu mencatatnya.\"","A Companion added 'ḥamdan katsīran ṭayyiban mubārakan fīh'; the Prophet ﷺ said: \"I saw over thirty angels racing to be first to write it down.\"","زاد رجل «حمدًا كثيرًا طيبًا مباركًا فيه» فقال ﷺ: «رأيت بضعة وثلاثين ملكًا يبتدرونها أيهم يكتبها أول».")],["HR Muslim 476",T("Tambahan: 'mil'as-samāwāti wa mil'al-arḍi wa mil'a mā syi'ta min syai'in ba'du' (sepenuh langit, sepenuh bumi, dan sepenuh apa saja yang Engkau kehendaki setelahnya).","Addition: 'mil'as-samāwāti wa mil'al-arḍi wa mil'a mā syi'ta min syai'in ba'du' (filling the heavens, the earth, and whatever else You will).","وزيادة: «ملء السماوات وملء الأرض وملء ما شئت من شيء بعد».")]],
        makna:T("Bayangkan tiga puluh malaikat berebut mencatat pujianmu. Pujian yang 'katsīr, ṭayyib, mubārak': banyak, bersih dari pamrih, dan membawa berkah. Berdirilah tegak sebagai orang yang baru saja didengar.","Picture thirty angels racing to record your praise. Praise that is 'katsīr, ṭayyib, mubārak': abundant, free of self-interest, and blessed. Stand upright as one who has just been heard.","تخيّل ثلاثين ملكًا يتسابقون لكتابة حمدك. حمد «كثير طيب مبارك»: وافر، خالٍ من الرياء، مبارك. قف منتصبًا بوصفك من سُمع للتو.") }
    ]},
  { id:"sujud", nama:T("Sujud","Prostration (Sujud)","السجود"), kelompok:"rukun",
    intro:T("Titik terdekat hamba dengan Tuhannya. Tujuh anggota badan menyentuh bumi. Di sinilah Nabi ﷺ memerintahkan memperbanyak doa.","The closest a servant comes to his Lord. Seven parts of the body touch the ground. Here the Prophet ﷺ commanded abundant supplication.","أقرب ما يكون العبد من ربه. سبعة أعضاء تلامس الأرض. وهنا أمر ﷺ بالإكثار من الدعاء."),
    items:[
      { arab:"سُبْحَانَ رَبِّيَ الْأَعْلَى", latin:"Subḥāna rabbiyal-a'lā (3×)", arti:T("Maha Suci Tuhanku Yang Maha Tinggi.","Glory be to my Lord, the Most High.","سبحان ربي الأعلى."),
        dalil:[["HR Muslim 772, Abu Dawud 871",T("Bacaan sujud Nabi ﷺ.","The Prophet's ﷺ recitation in prostration.","ذكر النبي ﷺ في سجوده.")],["HR Muslim 482",T("\"Keadaan paling dekat seorang hamba dengan Tuhannya adalah ketika ia sujud, maka perbanyaklah doa.\"","\"The closest a servant is to his Lord is when he prostrates, so make much supplication.\"","«أقرب ما يكون العبد من ربه وهو ساجد، فأكثروا الدعاء».")],["HR Bukhari 812, Muslim 490",T("\"Aku diperintahkan sujud di atas tujuh tulang: dahi (beliau menunjuk hidung), dua tangan, dua lutut, dan ujung-ujung kaki.\"","\"I was commanded to prostrate on seven bones: the forehead (and he pointed to the nose), the two hands, the two knees, and the tips of the feet.\"","«أُمرت أن أسجد على سبعة أعظم: على الجبهة — وأشار إلى أنفه — واليدين والركبتين وأطراف القدمين».")]],
        makna:T("Dalam ruku' kau menyebut-Nya 'Agung'; dalam sujud kau menyebut-Nya 'Maha Tinggi' — tepat saat kepalamu berada di titik terendah. Semakin rendah dahimu, semakin tinggi Dia di hatimu. Dahi yang biasa diangkat di ruang rapat, letakkan di tanah yang kelak menjadi kuburmu.","In bowing you call Him 'Great'; in prostration 'Most High' — precisely when your head is at its lowest. The lower your forehead, the higher He is in your heart. The forehead held high in the boardroom, lay it on the earth that will one day be your grave.","في الركوع تسمّيه «العظيم»، وفي السجود «الأعلى» في اللحظة التي يكون فيها رأسك في أدنى نقطة. كلما انخفضت جبهتك علا هو في قلبك. الجبهة التي ترفعها في قاعة الاجتماعات ضعها على التراب الذي سيكون قبرك يومًا.") },
      { judul:T("Doa dalam sujud yang dicontohkan","A supplication in prostration from the Sunnah","دعاء مأثور في السجود"),
        arab:"اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ", latin:"Allāhummaghfir lī dzanbī kullah, diqqahu wa jillah, wa awwalahu wa ākhirah, wa 'alāniyatahu wa sirrah", arti:T("Ya Allah, ampunilah seluruh dosaku: yang kecil dan yang besar, yang pertama dan yang terakhir, yang terang-terangan dan yang tersembunyi.","O Allah, forgive me all my sins: the small and the great, the first and the last, the open and the hidden.","اللهم اغفر لي ذنبي كله، دقّه وجلّه، وأوله وآخره، وعلانيته وسرّه."),
        dalil:[["HR Muslim 483",T("Dari Abu Hurairah, bacaan Nabi ﷺ dalam sujud.","From Abu Hurairah, the Prophet's ﷺ words in prostration.","عن أبي هريرة، مما كان يقوله ﷺ في سجوده.")],["Catatan fiqh",T("Dalam madzhab Syafi'i, doa dalam salat dengan bahasa Arab lebih utama; doa berbahasa non-Arab di dalam salat dihindari. Doa dengan bahasa hati tanpa lisan tidak membatalkan.","In the Shafi'i school, supplication in prayer is best in Arabic; non-Arabic supplication inside the prayer is avoided. Silent supplication of the heart does not invalidate it.","عند الشافعية الدعاء داخل الصلاة بالعربية أولى، ويُتجنب الدعاء بغير العربية فيها، ودعاء القلب بلا لسان لا يبطلها.")]],
        makna:T("Enam pasang kata yang menutup semua celah: tak ada dosa yang luput. Rasulullah ﷺ yang telah diampuni masih memohon seperti ini dalam sujud — lalu apa alasanmu untuk tergesa bangkit?","Six pairs of words that close every gap: no sin escapes. The Messenger ﷺ, already forgiven, still pleaded like this in prostration — so what excuse have you to rise in haste?","ست ثنائيات تسدّ كل ثغرة؛ لا يفلت ذنب. رسول الله ﷺ المغفور له كان يدعو هكذا في سجوده، فما عذرك في استعجال الرفع؟") }
    ]},
  { id:"duduk", nama:T("Duduk di antara dua sujud","Sitting between the two prostrations","الجلسة بين السجدتين"), kelompok:"rukun",
    intro:T("Duduk <em>iftirasy</em> dengan tumaninah; Nabi ﷺ memanjangkannya hampir sepanjang sujud (HR Bukhari 820). Bacaannya adalah tujuh permohonan yang merangkum semua kebutuhan manusia.","Sitting <em>iftirash</em> with stillness; the Prophet ﷺ prolonged it nearly as long as the prostration (Bukhari 820). Its recitation is seven requests that cover every human need.","جلوس الافتراش مع الطمأنينة؛ كان ﷺ يطيلها قريبًا من سجوده (البخاري 820). وذكرها سبع طلبات تجمع حاجات الإنسان كلها."),
    items:[
      { arab:"رَبِّ اغْفِرْ لِي، وَارْحَمْنِي، وَاجْبُرْنِي، وَارْفَعْنِي، وَارْزُقْنِي، وَاهْدِنِي، وَعَافِنِي", latin:"Rabbighfir lī, warḥamnī, wajburnī, warfa'nī, warzuqnī, wahdinī, wa 'āfinī", arti:T("Tuhanku, ampunilah aku, sayangilah aku, cukupkanlah (tambal kekuranganku), angkatlah derajatku, berilah aku rezeki, berilah aku petunjuk, dan berilah aku kesehatan.","My Lord, forgive me, have mercy on me, mend me, raise me, provide for me, guide me, and grant me well-being.","رب اغفر لي، وارحمني، واجبرني، وارفعني، وارزقني، واهدني، وعافني."),
        dalil:[["HR Abu Dawud 850, Tirmidzi 284, Ibnu Majah 898",T("Dari Ibnu Abbas; dinilai hasan. Redaksi riwayat berbeda-beda urutannya, sebagian tanpa 'wa 'āfinī'.","From Ibn Abbas; graded hasan. Narrations differ in order; some omit 'wa 'āfinī'.","عن ابن عباس؛ حسن. تختلف الروايات في الترتيب وبعضها بلا «وعافني».")],["HR Abu Dawud 874, Nasa'i 1145",T("Riwayat Hudzaifah yang lebih ringkas: 'Rabbighfir lī, rabbighfir lī' (sahih).","Hudhayfah's shorter version: 'Rabbighfir lī, rabbighfir lī' (authentic).","رواية حذيفة الأخصر: «رب اغفر لي، رب اغفر لي» (صحيح).")]],
        makna:T("<em>Wajburnī</em> berasal dari kata yang sama dengan 'menyambung tulang yang patah'. Engkau sedang minta ditambal: bagian dirimu yang retak oleh kegagalan, oleh kata-kata orang, oleh dosamu sendiri. Tujuh permintaan ini urutannya indah: ampunan dulu, baru kasih sayang, baru pemulihan, baru diangkat, baru rezeki. Rezeki ada di urutan kelima, bukan pertama.","<em>Wajburnī</em> shares its root with 'setting a broken bone'. You are asking to be mended: the parts of you cracked by failure, by people's words, by your own sins. The order is beautiful: forgiveness first, then mercy, then mending, then raising, then provision. Provision is fifth, not first.","«اجبرني» من جبر العظم المكسور. أنت تطلب أن يُرمَّم ما انكسر فيك بالفشل وكلام الناس وذنوبك. ترتيب الطلبات السبع بديع: المغفرة أولًا ثم الرحمة ثم الجبر ثم الرفع ثم الرزق. الرزق في المرتبة الخامسة لا الأولى.") }
    ]},
  { id:"tasyahud", nama:T("Tasyahud","Tashahhud","التشهد"), kelompok:"rukun",
    intro:T("Tasyahud akhir adalah rukun; tasyahud awal sunnah muakkadah (Syafi'i). Dua redaksi sahih: Ibnu Mas'ud (yang 'diajarkan Nabi ﷺ seperti mengajarkan surah Al-Qur'an') dan Ibnu Abbas (yang dipilih madzhab Syafi'i).","The final tashahhud is a pillar; the first is an emphasized sunnah (Shafi'i). Two authentic wordings: Ibn Mas'ud's (which the Prophet ﷺ 'taught as he taught a surah of the Qur'an') and Ibn Abbas's (preferred by the Shafi'i school).","التشهد الأخير ركن، والأول سنة مؤكدة عند الشافعية. صيغتان صحيحتان: صيغة ابن مسعود (التي علّمها ﷺ كما يعلّم السورة من القرآن) وصيغة ابن عباس (مختارة الشافعية)."),
    items:[
      { judul:T("Riwayat Ibnu Abbas — pilihan madzhab Syafi'i","Ibn Abbas's narration — preferred by the Shafi'i school","رواية ابن عباس — اختيار الشافعية"),
        arab:"التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللهِ",
        latin:"At-taḥiyyātul-mubārakātuṣ-ṣalawātuṭ-ṭayyibātu lillāh. As-salāmu 'alaika ayyuhan-nabiyyu wa raḥmatullāhi wa barakātuh. As-salāmu 'alainā wa 'alā 'ibādillāhiṣ-ṣāliḥīn. Asyhadu allā ilāha illallāh, wa asyhadu anna Muḥammadar-rasūlullāh.",
        arti:T("Segala penghormatan yang penuh berkah, salawat dan kebaikan hanya milik Allah. Salam sejahtera atasmu wahai Nabi, beserta rahmat Allah dan berkah-Nya. Salam sejahtera atas kami dan atas hamba-hamba Allah yang saleh. Aku bersaksi tiada tuhan selain Allah, dan aku bersaksi Muhammad adalah utusan Allah.","All blessed greetings, prayers and good things are for Allah. Peace be upon you, O Prophet, and the mercy of Allah and His blessings. Peace be upon us and upon the righteous servants of Allah. I bear witness that there is no god but Allah, and I bear witness that Muhammad is the Messenger of Allah.","التحيات المباركات الصلوات الطيبات لله، السلام عليك أيها النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، أشهد أن لا إله إلا الله وأشهد أن محمدًا رسول الله."),
        dalil:[["HR Muslim 403",T("Ibnu Abbas: \"Rasulullah ﷺ mengajarkan tasyahud kepada kami sebagaimana mengajarkan surah Al-Qur'an.\"","Ibn Abbas: \"The Messenger of Allah ﷺ taught us the tashahhud as he taught us a surah of the Qur'an.\"","ابن عباس: «كان رسول الله ﷺ يعلّمنا التشهد كما يعلّمنا السورة من القرآن».")]],
        makna:T("Ini rekaman percakapan Mi'raj. Nabi ﷺ memuji Allah; Allah menjawab 'salam atasmu wahai Nabi'; Nabi ﷺ tak ingin selamat sendirian: 'salam atas kami dan hamba-hamba yang saleh'. Setiap kali kau membacanya, kau diikutkan dalam doa itu. 'As-salāmu 'alainā' — rasakan 'kami': keluargamu, timmu, umat ini.","A record of the Mi'raj conversation. The Prophet ﷺ praises Allah; Allah replies 'peace be upon you, O Prophet'; the Prophet ﷺ refuses to be saved alone: 'peace be upon us and the righteous servants'. Every time you recite it, you are included in that prayer. 'As-salāmu 'alainā' — feel the 'us': your family, your team, this ummah.","هذا تسجيل لحوار المعراج. أثنى النبي ﷺ على الله، فردّ الله: «السلام عليك أيها النبي»، فلم يرضَ ﷺ أن ينجو وحده: «السلام علينا وعلى عباد الله الصالحين». كلما قرأته دخلت في ذلك الدعاء. «علينا»: اشعر بـ«نا»: أهلك وفريقك وهذه الأمة.") },
      { judul:T("Riwayat Ibnu Mas'ud — yang paling banyak jalurnya","Ibn Mas'ud's narration — the most widely transmitted","رواية ابن مسعود — أكثرها طرقًا"),
        arab:"التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ",
        latin:"At-taḥiyyātu lillāhi waṣ-ṣalawātu waṭ-ṭayyibāt. As-salāmu 'alaika ayyuhan-nabiyyu wa raḥmatullāhi wa barakātuh. As-salāmu 'alainā wa 'alā 'ibādillāhiṣ-ṣāliḥīn. Asyhadu allā ilāha illallāh, wa asyhadu anna Muḥammadan 'abduhu wa rasūluh.",
        arti:T("Segala penghormatan milik Allah, juga salawat dan kebaikan. Salam sejahtera atasmu wahai Nabi, beserta rahmat Allah dan berkah-Nya. Salam sejahtera atas kami dan atas hamba-hamba Allah yang saleh. Aku bersaksi tiada tuhan selain Allah, dan aku bersaksi Muhammad adalah hamba dan utusan-Nya.","All greetings are for Allah, and prayers and good things. Peace be upon you, O Prophet, and the mercy of Allah and His blessings. Peace be upon us and upon the righteous servants of Allah. I bear witness that there is no god but Allah, and I bear witness that Muhammad is His servant and Messenger.","التحيات لله والصلوات والطيبات، السلام عليك أيها النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، أشهد أن لا إله إلا الله وأشهد أن محمدًا عبده ورسوله."),
        dalil:[["HR Bukhari 831, Muslim 402",T("Ibnu Mas'ud: Nabi ﷺ mengajarkannya dengan telapak tangannya di antara kedua telapak tanganku.","Ibn Mas'ud: the Prophet ﷺ taught it to me with my hand between his hands.","ابن مسعود: علّمني رسول الله ﷺ التشهد وكفّي بين كفّيه.")],["HR Muslim 402",T("\"Jika kalian mengucapkan 'as-salāmu 'alā 'ibādillāhiṣ-ṣāliḥīn', ia mengenai setiap hamba saleh di langit dan di bumi.\"","\"When you say 'peace be upon the righteous servants of Allah', it reaches every righteous servant in the heavens and the earth.\"","«فإنكم إذا قلتم ذلك أصابت كل عبد صالح في السماء والأرض».")]],
        makna:T("'Abduhu wa rasūluh' — hamba disebut sebelum utusan. Kemuliaan tertinggi manusia adalah menjadi hamba. Saat jari telunjuk terangkat pada syahadat, itu isyarat tauhid: satu. Pandanglah jarimu.","'His servant and Messenger' — servant is named before Messenger. The highest honor of a human being is to be a servant. When the index finger rises at the testimony, it signals tawhid: one. Look at your finger.","«عبده ورسوله»: قُدّمت العبودية على الرسالة. أعلى شرف للإنسان أن يكون عبدًا. حين ترفع السبابة عند الشهادة فهي إشارة التوحيد: واحد. انظر إلى إصبعك.") },
      { judul:T("Salawat Ibrahimiyah (rukun dalam tasyahud akhir menurut Syafi'i)","The Ibrahimi salawat (a pillar in the final tashahhud per Shafi'i)","الصلاة الإبراهيمية (ركن في التشهد الأخير عند الشافعية)"),
        arab:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ",
        latin:"Allāhumma ṣalli 'alā Muḥammad wa 'alā āli Muḥammad, kamā ṣallaita 'alā Ibrāhīm wa 'alā āli Ibrāhīm, innaka ḥamīdum majīd. Allāhumma bārik 'alā Muḥammad wa 'alā āli Muḥammad, kamā bārakta 'alā Ibrāhīm wa 'alā āli Ibrāhīm, innaka ḥamīdum majīd.",
        arti:T("Ya Allah, limpahkanlah salawat kepada Muhammad dan keluarga Muhammad, sebagaimana Engkau limpahkan kepada Ibrahim dan keluarga Ibrahim; sesungguhnya Engkau Maha Terpuji, Maha Mulia. Ya Allah, berkahilah Muhammad dan keluarga Muhammad, sebagaimana Engkau berkahi Ibrahim dan keluarga Ibrahim; sesungguhnya Engkau Maha Terpuji, Maha Mulia.","O Allah, send prayers upon Muhammad and the family of Muhammad as You sent prayers upon Ibrahim and the family of Ibrahim; You are Praiseworthy, Glorious. O Allah, bless Muhammad and the family of Muhammad as You blessed Ibrahim and the family of Ibrahim; You are Praiseworthy, Glorious.","اللهم صل على محمد وعلى آل محمد كما صليت على إبراهيم وعلى آل إبراهيم إنك حميد مجيد، اللهم بارك على محمد وعلى آل محمد كما باركت على إبراهيم وعلى آل إبراهيم إنك حميد مجيد."),
        dalil:[["HR Bukhari 3370, Muslim 406",T("Para sahabat bertanya bagaimana bersalawat; Nabi ﷺ mengajarkan redaksi ini.","The Companions asked how to send salawat; the Prophet ﷺ taught this wording.","سأل الصحابة كيف يصلّون عليه فعلّمهم ﷺ هذه الصيغة.")],["HR Muslim 408",T("\"Siapa bersalawat kepadaku sekali, Allah bersalawat kepadanya sepuluh kali.\"","\"Whoever sends one prayer upon me, Allah sends ten upon him.\"","«من صلى عليّ واحدة صلى الله عليه عشرًا».")]],
        makna:T("Sebelum berdoa untuk dirimu, kau mendoakan orang yang telah berdoa untukmu sebelum kau lahir. Ibrahim disebut sebagai teladan: bapak yang mengorbankan, membangun, dan mendoakan keturunannya. Engkau seorang ayah; mintalah kepada Allah berkah seperti itu untuk rumahmu.","Before praying for yourself, you pray for the one who prayed for you before you were born. Ibrahim is named as the model: a father who sacrificed, built, and prayed for his descendants. You are a father; ask Allah for that kind of blessing on your home.","قبل أن تدعو لنفسك تدعو لمن دعا لك قبل أن تولد. وذُكر إبراهيم قدوةً: أب ضحّى وبنى ودعا لذريته. أنت أب؛ فاسأل الله مثل تلك البركة لبيتك.") },
      { judul:T("Doa sebelum salam","Supplication before the salam","الدعاء قبل السلام"),
        arab:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، وَمِنْ عَذَابِ جَهَنَّمَ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ",
        latin:"Allāhumma innī a'ūdzu bika min 'adzābil-qabr, wa min 'adzābi jahannam, wa min fitnatil-maḥyā wal-mamāt, wa min syarri fitnatil-masīḥid-dajjāl.",
        arti:T("Ya Allah, aku berlindung kepada-Mu dari azab kubur, dari azab Jahanam, dari fitnah kehidupan dan kematian, dan dari keburukan fitnah Al-Masih Dajjal.","O Allah, I seek refuge in You from the punishment of the grave, from the punishment of Hell, from the trials of life and death, and from the evil of the trial of the False Messiah.","اللهم إني أعوذ بك من عذاب القبر، ومن عذاب جهنم، ومن فتنة المحيا والممات، ومن شر فتنة المسيح الدجال."),
        dalil:[["HR Bukhari 1377, Muslim 588",T("\"Jika salah seorang kalian selesai tasyahud akhir, hendaklah berlindung dari empat hal...\"","\"When one of you finishes the final tashahhud, let him seek refuge from four things...\"","«إذا تشهد أحدكم فليستعذ بالله من أربع...»")],["HR Bukhari 834, Muslim 2705",T("Doa Abu Bakar yang diajarkan Nabi ﷺ untuk dibaca dalam salat: 'Allāhumma innī ẓalamtu nafsī ẓulman katsīrā, wa lā yaghfirudz-dzunūba illā anta, faghfir lī maghfiratan min 'indika warḥamnī, innaka antal-ghafūrur-raḥīm.'","Abu Bakr's supplication taught by the Prophet ﷺ for prayer: 'O Allah, I have wronged myself greatly, and none forgives sins but You; so grant me forgiveness from You and have mercy on me; You are the Forgiving, the Merciful.'","دعاء أبي بكر الذي علّمه النبي ﷺ ليقوله في صلاته: «اللهم إني ظلمت نفسي ظلمًا كثيرًا ولا يغفر الذنوب إلا أنت، فاغفر لي مغفرة من عندك وارحمني إنك أنت الغفور الرحيم».")]],
        makna:T("Empat perlindungan: dua tentang akhirat, dua tentang dunia. 'Fitnah kehidupan' adalah ujian harta, jabatan, dan keluarga — persis yang kau hadapi setiap hari setelah salam. Doa ini adalah bekal keluar dari masjid ke kantor.","Four protections: two about the Hereafter, two about this world. 'The trial of life' is the test of wealth, position, and family — exactly what you face daily after the salam. This supplication is provision for leaving the mosque for the office.","أربع استعاذات: اثنتان للآخرة واثنتان للدنيا. «فتنة المحيا» هي امتحان المال والمنصب والأهل، وهو ما تواجهه كل يوم بعد السلام. هذا الدعاء زادك من المسجد إلى المكتب.") }
    ]},
  { id:"salam", nama:T("Salam","Salam","السلام"), kelompok:"penutup",
    intro:T("Rukun penutup. Menoleh ke kanan lalu ke kiri hingga pipi terlihat dari belakang (HR Muslim 582).","The closing pillar. Turning right then left until the cheek is visible from behind (Muslim 582).","الركن الخاتم. الالتفات يمينًا ثم يسارًا حتى يُرى بياض الخد (مسلم 582)."),
    items:[
      { arab:"السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ", latin:"As-salāmu 'alaikum wa raḥmatullāh", arti:T("Semoga keselamatan dan rahmat Allah tercurah atas kalian.","Peace and the mercy of Allah be upon you.","السلام عليكم ورحمة الله."),
        dalil:[["HR Muslim 582, Abu Dawud 996",T("Nabi ﷺ salam ke kanan dan ke kiri hingga terlihat putih pipinya.","The Prophet ﷺ gave salam to the right and left until the whiteness of his cheek was seen.","كان ﷺ يسلّم عن يمينه وعن يساره حتى يُرى بياض خده.")],["HR Abu Dawud 61",T("\"...dan penghalalnya adalah salam.\"","\"...and what releases from it is the salam.\"","«...وتحليلها التسليم».")]],
        makna:T("Salat dibuka dengan menghadap Allah dan ditutup dengan menghadap manusia — ke kanan dan ke kiri, kepada malaikat, kepada jamaah, kepada dunia. Orang yang khusyuk keluar dari salat membawa <em>salām</em>: keselamatan bagi orang-orang di sekitarnya. Ukuran kekhusyukanmu bukan air mata di sajadah, tetapi apakah orang-orang di rumah dan kantormu merasa aman darimu.","Prayer opens facing Allah and closes facing people — right and left, toward the angels, the congregation, the world. One who prays with presence leaves carrying <em>salām</em>: safety for those around him. The measure of your khushu' is not tears on the prayer mat but whether the people in your home and office feel safe from you.","تُفتتح الصلاة بالتوجه إلى الله وتُختم بالتوجه إلى الناس يمينًا ويسارًا: إلى الملائكة والجماعة والدنيا. الخاشع يخرج من صلاته حاملًا <em>السلام</em>: أمانًا لمن حوله. مقياس خشوعك ليس الدمع على السجادة بل هل يأمنك أهل بيتك ومكتبك.") }
    ]}

     d:T("Bahu membungkuk, kepala maju 5 cm: beban pada leher naik hampir tiga kali lipat dan dada tertutup sehingga napas pendek.","Hunched shoulders, head 5 cm forward: load on the neck nearly triples and the chest closes, shortening the breath.","انحناء الكتفين وتقدم الرأس 5 سم: يتضاعف الحمل على الرقبة ثلاث مرات تقريبًا وينغلق الصدر فيقصر النفس.")},
   fiqh:[
     [T("Berdiri bagi yang mampu","Standing for those able","القيام للقادر"),T("Rukun. \"Salatlah dengan berdiri; jika tidak mampu, duduk; jika tidak mampu, berbaring.\" — HR Bukhari 1117.","A pillar. \"Pray standing; if you cannot, sitting; if you cannot, on your side.\" — Bukhari 1117.","ركن. «صلّ قائمًا، فإن لم تستطع فقاعدًا، فإن لم تستطع فعلى جنب» — البخاري 1117.")],
     [T("Tangan di dada","Hands on the chest","وضع اليدين على الصدر"),T("Sahl bin Sa'd: \"Orang-orang diperintahkan meletakkan tangan kanan di atas lengan kiri dalam salat.\" — HR Bukhari 740. Wail bin Hujr: Nabi ﷺ meletakkannya di dada — HR Ibnu Khuzaimah 479. Madzhab Syafi'i: di bawah dada, di atas pusar.","Sahl ibn Sa'd: \"People were commanded to place the right hand over the left forearm in prayer.\" — Bukhari 740. Wa'il ibn Hujr: the Prophet ﷺ placed them on his chest — Ibn Khuzaymah 479. Shafi'i school: below the chest, above the navel.","سهل بن سعد: «كان الناس يُؤمرون أن يضع الرجل اليد اليمنى على ذراعه اليسرى في الصلاة» — البخاري 740. وائل بن حجر: وضعهما ﷺ على صدره — ابن خزيمة 479. الشافعية: تحت الصدر فوق السرة.")],
     [T("Pandangan ke tempat sujud","Gaze at the place of prostration","النظر إلى موضع السجود"),T("Nabi ﷺ saat masuk Ka'bah tidak mengalihkan pandangan dari tempat sujud hingga keluar — HR Hakim 1761, Baihaqi; sahih. Mengangkat pandangan ke langit dilarang keras — HR Bukhari 750.","When the Prophet ﷺ entered the Ka'bah he did not lift his gaze from the place of prostration until he left — Hakim 1761, Bayhaqi; authentic. Raising the eyes to the sky is sternly forbidden — Bukhari 750.","لما دخل ﷺ الكعبة ما خلّف بصره موضع سجوده حتى خرج — الحاكم 1761 والبيهقي؛ صحيح. ورفع البصر إلى السماء منهي عنه بشدة — البخاري 750.")],
     [T("Jarak kaki","Foot spacing","التفريج بين القدمين"),T("Wajar, tidak terlalu rapat atau lebar; para sahabat merapatkan mata kaki dengan mata kaki saudaranya dalam saf — HR Bukhari 725 (ta'liq), Abu Dawud 662.","Natural, neither tight nor wide; Companions aligned ankle to ankle in the row — Bukhari 725, Abu Dawud 662.","معتدل غير ملتصق ولا متباعد؛ كان الصحابة يلزق أحدهم كعبه بكعب صاحبه في الصف — البخاري 725 وأبو داود 662.")]],
   fisio:[
     [T("Beban","Load","الحمل"),T("Terbagi rata di tiga titik telapak: tumit, pangkal jempol, pangkal kelingking. Hindari bertumpu pada satu kaki (pinggul miring).","Spread evenly over three points of the sole: heel, ball of the big toe, ball of the little toe. Avoid leaning on one leg (tilted pelvis).","يتوزع على ثلاث نقاط من القدم: الكعب وأصل الإبهام وأصل الخنصر. تجنب الاتكاء على قدم واحدة (ميل الحوض).")],
     [T("Tulang belakang","Spine","العمود الفقري"),T("Posisi netral: lekuk alami leher, punggung atas, dan pinggang. Telinga, bahu, pinggul, dan mata kaki segaris dari samping.","Neutral: the natural curves of neck, upper back and lower back. Ear, shoulder, hip and ankle in one line from the side.","وضع محايد بانحناءات الرقبة والظهر العلوي والقطن الطبيعية. الأذن والكتف والورك والكاحل على خط واحد من الجانب.")],
     [T("Lutut","Knees","الركبتان"),T("Lurus tetapi tidak dikunci; mengunci lutut menekan sendi dan mengganggu aliran darah balik, penyebab pusing saat berdiri lama.","Straight but not locked; locking compresses the joint and hampers venous return, a cause of dizziness when standing long.","مستقيمتان غير مقفلتين؛ قفل الركبة يضغط المفصل ويعيق عودة الدم فيسبب الدوار عند طول القيام.")],
     [T("Bahu","Shoulders","الكتفان"),T("Rileks ke bawah dan sedikit ke belakang; lengan bersedekap tanpa mengangkat bahu ke telinga.","Relaxed down and slightly back; arms folded without hiking the shoulders toward the ears.","مسترخيان إلى الأسفل والخلف قليلًا؛ تُضم اليدان دون رفع الكتفين نحو الأذنين.")]],
   sehat:[T("Melatih otot postural (erector spinae, gluteus, betis) yang melemah karena duduk lama di kantor dan mobil.","Trains the postural muscles (erector spinae, glutes, calves) weakened by long sitting at desks and in cars.","يقوّي عضلات القوام (ناصبة الفقار والألوية والساق) التي يضعفها طول الجلوس في المكتب والسيارة."),T("Berdiri tenang dengan napas teratur menurunkan tonus simpatis: denyut jantung dan tekanan darah turun.","Standing still with regular breathing lowers sympathetic tone: heart rate and blood pressure drop.","الوقوف الساكن مع تنفس منتظم يخفض التوتر الودي: ينخفض النبض وضغط الدم."),T("Pandangan ke satu titik adalah latihan atensi: mata yang diam menenangkan pikiran yang liar.","Fixing the gaze on one point trains attention: still eyes calm a restless mind.","تثبيت البصر على نقطة واحدة تدريب للانتباه: العين الساكنة تهدّئ الذهن المضطرب.")],
   hikmah:T("Berdiri adalah posisi seorang hamba yang menghadap. Kaki yang tidak bergeser dan mata yang tidak berkeliling adalah terjemahan jasmani dari hati yang tidak ke mana-mana. Al-Ghazali menyebut qiyam sebagai 'berdirinya hati di hadapan Allah' (Ihya', Asrar ash-Shalat).","Standing is the posture of a servant facing his Master. Feet that do not shift and eyes that do not wander are the body's translation of a heart that goes nowhere else. Al-Ghazali called qiyam 'the standing of the heart before Allah' (Ihya', Asrar as-Salah).","القيام هيئة عبد يواجه سيده. قدم لا تتزحزح وعين لا تجول ترجمة جسدية لقلب لا يذهب إلى مكان آخر. سمّاه الغزالي «قيام القلب بين يدي الله» (الإحياء، أسرار الصلاة).")
  },
  {id:"ruku", nama:T("Ruku'","Bowing","الركوع"), sub:T("Membungkuk — punggung rata","Bowing — level back","الانحناء مع استواء الظهر"),

   pressure:[{p:[142,292],l:T("telapak kaki","soles","باطن القدم")},{p:[150,238],l:T("telapak di lutut","palms on knees","الكفان على الركبتين")}],
