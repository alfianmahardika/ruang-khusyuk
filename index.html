   breath:T("Hembuskan napas saat turun; napas tenang selama tumaninah.","Exhale as you go down; breathe calmly during the pause.","ازفر عند النزول؛ وتنفس بهدوء أثناء الطمأنينة."),
   wrong:{pts:{head:[52,232],neck:[66,214],sh:[78,202],el:[108,228],wr:[148,238],hip:[160,186],kn:[158,240],an:[158,288],toe:[126,292],kn2:[166,240],an2:[166,288],toe2:[134,292]},ctrl:[112,156],
     d:T("Punggung membulat dan kepala menunduk: 'air akan tumpah'. Beban pindah ke cakram L4–L5 — ini pola yang sama dengan mengangkat barang secara salah.","Rounded back with the head dropped: 'the water would spill'. Load shifts to the L4–L5 discs — the same pattern as lifting wrongly.","تقوّس الظهر وتدلي الرأس: «لو صُبّ الماء لانسكب». ينتقل الحمل إلى غضاريف L4–L5، وهو نمط الرفع الخاطئ نفسه.")},
   fiqh:[
     [T("Punggung rata","Level back","استواء الظهر"),T("Nabi ﷺ bila ruku' meratakan punggungnya, \"seandainya air dituangkan di atasnya niscaya tetap\" — HR Ibnu Majah 872, Thabrani; sahih (al-Albani). Kepala tidak diangkat dan tidak ditundukkan — HR Muslim 498.","When the Prophet ﷺ bowed he leveled his back, \"so that if water were poured on it, it would stay\" — Ibn Majah 872, Tabarani; authentic (al-Albani). The head neither raised nor dropped — Muslim 498.","كان ﷺ إذا ركع بسط ظهره «لو صُبّ عليه الماء لاستقر» — ابن ماجه 872 والطبراني؛ صححه الألباني. ولا يرفع رأسه ولا يصوّبه — مسلم 498.")],
     [T("Tangan di lutut","Hands on the knees","اليدان على الركبتين"),T("Abu Humaid as-Sa'idi: \"Beliau meletakkan kedua tangannya di lutut seperti menggenggamnya, dan merenggangkan jari-jari.\" — HR Bukhari 828, Abu Dawud 731.","Abu Humayd as-Sa'idi: \"He placed his hands on his knees as if grasping them, with the fingers spread.\" — Bukhari 828, Abu Dawud 731.","أبو حميد الساعدي: «ثم وضع يديه على ركبتيه كالقابض عليهما وفرّج بين أصابعه» — البخاري 828 وأبو داود 731.")],
     [T("Siku dijauhkan","Elbows away from the sides","مجافاة المرفقين"),T("Siku direnggangkan dari lambung (tajafi) bagi laki-laki — HR Abu Dawud 734, Tirmidzi 260.","Elbows held away from the flanks (tajafi) for men — Abu Dawud 734, Tirmidhi 260.","يجافي الرجل مرفقيه عن جنبيه — أبو داود 734 والترمذي 260.")],
     [T("Tumaninah","Stillness (tuma'ninah)","الطمأنينة"),T("Rukun. \"...lalu ruku'lah hingga engkau tenang dalam ruku'.\" — HR Bukhari 757, Muslim 397. Orang yang tidak menyempurnakan ruku' dan sujud disebut pencuri terburuk — HR Ahmad 22695, Hakim; sahih.","A pillar. \"...then bow until you are at rest in bowing.\" — Bukhari 757, Muslim 397. One who does not complete bowing and prostration is called the worst of thieves — Ahmad 22695, Hakim; authentic.","ركن. «...ثم اركع حتى تطمئن راكعًا» — البخاري 757 ومسلم 397. ومن لا يتم ركوعه وسجوده هو أسوأ الناس سرقة — أحمد 22695 والحاكم؛ صحيح.")]],
   fisio:[
     [T("Gerakannya","The movement","الحركة"),T("Hip hinge, bukan membungkukkan pinggang: dorong pinggul ke belakang, lipat di sendi panggul, biarkan tubuh turun hingga torso sejajar lantai (≈90° di pinggul).","A hip hinge, not a waist bend: push the hips back, fold at the hip joint, let the trunk descend until parallel to the floor (≈90° at the hip).","ثني من الورك لا من الخصر: ادفع الوركين إلى الخلف واثنِ من مفصل الحوض حتى يوازي الجذع الأرض (≈90° عند الورك).")],
     [T("Tulang belakang","Spine","العمود الفقري"),T("Tetap netral dan memanjang dari tulang ekor sampai ubun-ubun; jangan membulatkan punggung karena itu memindahkan beban ke cakram tulang belakang bawah (L4–L5).","Stays neutral and long from tailbone to crown; do not round the back, which shifts load onto the lower discs (L4–L5).","يبقى محايدًا ممتدًا من العصعص إلى قمة الرأس؛ لا تقوّس الظهر فذلك ينقل الحمل إلى الغضاريف القطنية (L4–L5).")],
     [T("Lutut & hamstring","Knees & hamstrings","الركبتان والمأبضية"),T("Lutut lurus-lunak. Hamstring yang kaku akan 'menarik' panggul dan memaksa punggung membulat; dorong tangan ke lutut untuk menopang sebagian beban torso.","Knees soft-straight. Tight hamstrings 'pull' the pelvis and force the back to round; press the hands into the knees to support part of the trunk's weight.","الركبتان مستقيمتان بلين. تشدّ المأبضية الحوض وتجبر الظهر على التقوس؛ ادفع يديك على ركبتيك لتحمل جزءًا من وزن الجذع.")],
     [T("Leher","Neck","الرقبة"),T("Lanjutan garis punggung; pandangan ke tempat sujud, bukan ke kaki atau ke depan.","A continuation of the back line; gaze at the place of prostration, not the feet nor straight ahead.","امتداد لخط الظهر؛ النظر إلى موضع السجود لا إلى القدمين ولا إلى الأمام.")]],
   sehat:[T("Peregangan aktif hamstring, gluteus, dan erector spinae — otot-otot yang memendek pada orang yang banyak duduk.","Active stretch of hamstrings, glutes and erector spinae — muscles that shorten with prolonged sitting.","إطالة نشطة للمأبضية والألوية وناصبة الفقار، وهي عضلات تقصر بكثرة الجلوس."),T("Melatih pola hip hinge yang benar, pola gerak yang sama dengan mengangkat barang dengan aman; ruku' yang benar lima kali sehari adalah latihan pencegahan nyeri punggung bawah.","Trains the correct hip-hinge pattern, the same movement as safe lifting; correct bowing five times a day is preventive training against low-back pain.","يدرّب نمط الثني الصحيح من الورك، وهو نمط الرفع الآمن؛ فالركوع الصحيح خمس مرات يوميًا وقاية من آلام أسفل الظهر."),T("Posisi kepala sejajar jantung sejenak melatih refleks baroreseptor (adaptasi tekanan darah).","Having the head level with the heart briefly trains the baroreceptor reflex (blood-pressure adaptation).","مستوى الرأس مع القلب لحظات يدرّب منعكس مستقبلات الضغط (تكيف ضغط الدم).")],
   hikmah:T("Ruku' adalah tunduk sebelum tersungkur: pengakuan keagungan sebelum pengakuan kehinaan diri. Punggung yang rata adalah kesetaraan: kepala pemimpin dan kepala pegawai berada di ketinggian yang sama di hadapan Allah.","Bowing is submission before prostration: acknowledging His greatness before acknowledging one's own lowliness. The level back is equality: the head of the leader and the head of the employee at the same height before Allah.","الركوع خضوع قبل السجود: إقرار بالعظمة قبل الإقرار بالذل. والظهر المستوي مساواة: رأس القائد ورأس الموظف في ارتفاع واحد بين يدي الله.")
  },

   muscles:[{a:"hip",b:"kn",t:"active",n:T("gluteus & paha belakang (ekstensi panggul)","glutes & hamstrings (hip extension)","الألوية والمأبضية (بسط الورك)")},{a:"sh",b:"hip",t:"active",n:T("erector spinae","erector spinae","ناصبة الفقار")}],
   breath:T("Buang napas saat bangkit; jangan menahan napas.","Exhale as you rise; do not hold the breath.","ازفر عند النهوض؛ لا تحبس النفس."),

     d:T("Belum tegak sudah turun ke sujud: rukun tumaninah hilang; inilah yang Nabi ﷺ sebut 'pencuri salat'. Secara fisik, cakram tak sempat kembali ke tingginya.","Dropping to prostration before fully upright: the pillar of stillness is lost — what the Prophet ﷺ called 'stealing from the prayer'. Physically, the discs never regain their height.","الهويّ إلى السجود قبل تمام الاستواء: يضيع ركن الطمأنينة، وهو ما سماه ﷺ سرقة الصلاة. وبدنيًا لا تجد الغضاريف وقتًا لاستعادة ارتفاعها.")},
   fiqh:[
     [T("Tegak hingga setiap ruas kembali","Upright until every joint returns","الاستواء حتى يعود كل فقار"),T("Abu Humaid: \"Beliau mengangkat kepalanya lalu berdiri tegak hingga setiap ruas tulang kembali ke tempatnya.\" — HR Bukhari 828.","Abu Humayd: \"He raised his head and stood straight until every bone returned to its place.\" — Bukhari 828.","أبو حميد: «ثم رفع رأسه فاستوى حتى يعود كل فقار مكانه» — البخاري 828.")],
     [T("Lama dan tenang","Long and calm","الإطالة والسكينة"),T("Nabi ﷺ berdiri lama setelah ruku' hingga sahabat berkata 'ia telah lupa' — HR Bukhari 800, Muslim 472. Tumaninah di sini rukun.","The Prophet ﷺ stood so long after bowing that Companions said 'he has forgotten' — Bukhari 800, Muslim 472. Stillness here is a pillar.","كان ﷺ يطيل القيام بعد الركوع حتى يقول القائل: قد نسي — البخاري 800 ومسلم 472. والطمأنينة هنا ركن.")],
     [T("Posisi tangan","Hand position","وضع اليدين"),T("Madzhab Syafi'i: tangan dilepas lurus ke bawah (irsal) setelah ruku'; sebagian ulama membolehkan kembali bersedekap. Pilih yang menenangkan dan konsisten.","Shafi'i school: arms hang straight (irsal) after bowing; some scholars allow refolding. Choose what calms you and stay consistent.","الشافعية: إرسال اليدين بعد الركوع؛ وأجاز بعض العلماء إعادة القبض. اختر ما يطمئنك واثبت عليه.")],
     [T("Mengangkat tangan","Raising the hands","رفع اليدين"),T("Sunnah mengangkat tangan saat bangkit dari ruku' — HR Bukhari 735.","It is sunnah to raise the hands when rising from bowing — Bukhari 735.","يُسن رفع اليدين عند الرفع من الركوع — البخاري 735.")]],
   fisio:[
     [T("Gerakannya","The movement","الحركة"),T("Bangkit dengan mendorong pinggul ke depan (ekstensi panggul oleh gluteus), bukan dengan 'menarik' punggung. Kepala bangun terakhir.","Rise by driving the hips forward (hip extension by the glutes), not by 'pulling' with the back. The head comes up last.","انهض بدفع الوركين إلى الأمام (بسط الورك بالألوية) لا بشدّ الظهر. ويرتفع الرأس أخيرًا.")],
     [T("Dekompresi","Decompression","إزالة الانضغاط"),T("Berdiri tegak penuh membiarkan cakram tulang belakang kembali ke tinggi semula — persis makna 'setiap tulang kembali ke tempatnya'.","Standing fully upright lets the spinal discs regain their height — exactly the meaning of 'every bone returns to its place'.","الاستواء التام يتيح للغضاريف استعادة ارتفاعها، وهو عين معنى «يعود كل فقار مكانه».")],
     [T("Napas","Breath","النفس"),T("Buang napas saat bangkit; menahan napas (Valsalva) memicu lonjakan tekanan darah.","Exhale on rising; holding the breath (Valsalva) spikes blood pressure.","ازفر عند النهوض؛ حبس النفس (فالسالفا) يرفع ضغط الدم فجأة.")]],
   sehat:[T("Menguatkan gluteus dan paha belakang melalui pola ekstensi panggul berulang.","Strengthens glutes and hamstrings through repeated hip extension.","يقوّي الألوية والمأبضية بتكرار بسط الورك."),T("Menjaga kelincahan transisi bungkuk–tegak yang menurun seiring usia; penurunan ini prediktor risiko jatuh pada lansia.","Maintains the bend-to-stand transition that declines with age; its loss predicts fall risk in the elderly.","يحافظ على رشاقة الانتقال من الانحناء إلى الوقوف التي تتراجع مع العمر، وتراجعها مؤشر لخطر السقوط."),T("Jeda tegak sebelum sujud memberi waktu sistem kardiovaskular menyesuaikan sebelum kepala turun di bawah jantung.","The upright pause before prostration gives the cardiovascular system time to adjust before the head drops below the heart.","وقفة الاستواء قبل السجود تمنح الجهاز الدوري وقتًا للتكيف قبل نزول الرأس تحت القلب.")],
   hikmah:T("Bangkit dari ruku' adalah gambaran harapan setelah tunduk: Allah mendengar, maka kau berdiri. Jangan jatuhkan dirimu ke sujud sebelum benar-benar tegak; orang yang tergesa di sini tergesa dalam seluruh hidupnya.","Rising from bowing is the picture of hope after submission: Allah hears, so you stand. Do not throw yourself into prostration before fully upright; one who rushes here rushes through his whole life.","الرفع من الركوع صورة الرجاء بعد الخضوع: سمع الله فقمت. لا تهوِ إلى السجود قبل تمام الاستواء؛ فمن استعجل هنا استعجل في حياته كلها.")
  },

   breath:T("Napas perlahan; rasakan perut mengembang ke paha. Tempat terbaik untuk doa panjang.","Slow breathing; feel the belly expand toward the thighs. The best place for long supplication.","تنفس ببطء واشعر بتمدد البطن نحو الفخذين. أفضل موضع لإطالة الدعاء."),
   wrong:{pts:{head:[62,270],neck:[88,252],sh:[100,246],el:[104,290],wr:[66,290],hip:[186,232],kn:[210,286],an:[236,262],toe:[244,292],kn2:[218,286],an2:[244,262],toe2:[252,292]},ctrl:null,
     d:T("Siku dan lengan bawah menempel lantai 'seperti anjing' (HR Bukhari 822): dada tertutup, napas pendek, dan bahu tidak bekerja.","Elbows and forearms flat on the floor 'like a dog' (Bukhari 822): the chest closes, breathing shortens, and the shoulders do no work.","افتراش الذراعين على الأرض «كالكلب» (البخاري 822): ينغلق الصدر ويقصر النفس ولا يعمل الكتفان.")},
   fiqh:[
     [T("Tujuh anggota","Seven limbs","الأعضاء السبعة"),T("\"Aku diperintahkan sujud di atas tujuh tulang: dahi — beliau menunjuk hidungnya —, dua tangan, dua lutut, dan ujung kedua kaki.\" — HR Bukhari 812, Muslim 490. Syafi'i: dahi wajib, hidung sunnah.","\"I was commanded to prostrate on seven bones: the forehead — and he pointed to his nose —, the two hands, the two knees, and the tips of the feet.\" — Bukhari 812, Muslim 490. Shafi'i: forehead obligatory, nose recommended.","«أُمرت أن أسجد على سبعة أعظم: على الجبهة — وأشار بيده على أنفه — واليدين والركبتين وأطراف القدمين» — البخاري 812 ومسلم 490. الشافعية: الجبهة واجبة والأنف سنة.")],
     [T("Siku terangkat","Elbows raised","رفع المرفقين"),T("\"Luruslah dalam sujud, dan jangan seorang pun membentangkan lengannya seperti anjing.\" — HR Bukhari 822, Muslim 493.","\"Be balanced in prostration, and let none of you spread his forearms like a dog.\" — Bukhari 822, Muslim 493.","«اعتدلوا في السجود ولا يبسط أحدكم ذراعيه انبساط الكلب» — البخاري 822 ومسلم 493.")],
     [T("Tangan sejajar bahu/telinga","Hands level with shoulders/ears","اليدان حذو المنكبين أو الأذنين"),T("Sejajar bahu (HR Abu Dawud 734) atau sejajar telinga (HR Muslim 401); jari rapat menghadap kiblat.","Level with the shoulders (Abu Dawud 734) or the ears (Muslim 401); fingers together, pointing to the qiblah.","حذو المنكبين (أبو داود 734) أو حذو الأذنين (مسلم 401)، والأصابع مضمومة نحو القبلة.")],
     [T("Perut jauh dari paha","Belly away from the thighs","مجافاة البطن عن الفخذين"),T("Nabi ﷺ merenggangkan lengan dari lambung hingga terlihat putih ketiaknya, dan menjauhkan perut dari paha — HR Bukhari 390, Abu Dawud 735.","The Prophet ﷺ kept his arms from his sides until the whiteness of his armpits showed, and his belly from his thighs — Bukhari 390, Abu Dawud 735.","كان ﷺ يجافي يديه عن جنبيه حتى يُرى بياض إبطيه، ويجافي بطنه عن فخذيه — البخاري 390 وأبو داود 735.")],
     [T("Jari kaki ke kiblat","Toes toward the qiblah","أصابع القدمين إلى القبلة"),T("Ujung jari kaki ditekuk menghadap kiblat, tumit dirapatkan — HR Bukhari 828 (Abu Humaid), Baihaqi 2/116 (Aisyah).","Toes bent toward the qiblah, heels together — Bukhari 828 (Abu Humayd), Bayhaqi 2/116 (Aisha).","أطراف الأصابع مثنية إلى القبلة والعقبان مضمومان — البخاري 828 (أبو حميد) والبيهقي 2/116 (عائشة).")]],
   fisio:[
     [T("Distribusi beban","Load distribution","توزيع الحمل"),T("Beban torso dibagi antara telapak tangan (≈30%), lutut (≈50%), dan dahi (≈20%). Dahi menempel ringan, bukan menekan; jangan menumpukan beban di leher.","Trunk weight is shared by the palms (≈30%), knees (≈50%) and forehead (≈20%). The forehead rests lightly, never pressing; no load on the neck.","يتوزع وزن الجذع بين الكفين (≈30%) والركبتين (≈50%) والجبهة (≈20%). تلامس الجبهة الأرض برفق لا بضغط، ولا حمل على الرقبة.")],
     [T("Leher","Neck","الرقبة"),T("Netral — garis leher melanjutkan punggung. Hidung menyentuh lantai bersama dahi menjaga leher tetap lurus.","Neutral — the neck continues the line of the back. The nose touching with the forehead keeps the neck straight.","محايدة: خط الرقبة امتداد للظهر. ملامسة الأنف مع الجبهة تحفظ استقامة الرقبة.")],
     [T("Lutut & pergelangan kaki","Knees & ankles","الركبتان والكاحلان"),T("Lutut menekuk ≈70°, pergelangan kaki dorsifleksi penuh dengan jari ditekuk (peregangan plantar fascia dan betis).","Knees bent ≈70°, ankles fully dorsiflexed with the toes bent (stretching the plantar fascia and calves).","تنثني الركبتان ≈70°، والكاحلان في عطف ظهري كامل مع ثني الأصابع (إطالة اللفافة الأخمصية والساق).")],
     [T("Siku & bahu","Elbows & shoulders","المرفقان والكتفان"),T("Siku terangkat, lengan bawah tidak menempel: mengaktifkan bahu dan trisep, menjaga ruang dada terbuka sehingga napas tetap lega.","Elbows up, forearms off the floor: engages shoulders and triceps and keeps the chest open so breathing stays easy.","المرفقان مرفوعان والساعدان لا يلامسان الأرض: يعمل الكتفان وثلاثية الرؤوس ويبقى الصدر مفتوحًا فيسهل النفس.")]],
   sehat:[T("Satu-satunya posisi harian di mana kepala berada di bawah jantung tanpa membalik tubuh: meningkatkan aliran darah ke otak secara ringan dan aman.","The only daily posture with the head below the heart without inverting the body: a gentle, safe increase in cerebral blood flow.","الوضع اليومي الوحيد الذي يكون فيه الرأس تحت القلب دون قلب الجسم: زيادة لطيفة آمنة في تدفق الدم إلى الدماغ."),T("Dorsifleksi penuh jari kaki meregangkan plantar fascia — pencegahan plantar fasciitis.","Full toe dorsiflexion stretches the plantar fascia — prevention of plantar fasciitis.","العطف الظهري الكامل للأصابع يطيل اللفافة الأخمصية، وقاية من التهابها."),T("Tekanan lembut pada organ perut membantu motilitas usus.","Gentle pressure on the abdominal organs aids bowel motility.","ضغط لطيف على أعضاء البطن يعين حركة الأمعاء."),T("Setara 'child's pose' dalam fisioterapi — dipakai untuk meredakan ketegangan punggung bawah dan menurunkan kecemasan.","Equivalent to physiotherapy's 'child's pose' — used to relieve low-back tension and reduce anxiety.","يعادل «وضع الطفل» في العلاج الطبيعي، ويُستخدم لتخفيف توتر أسفل الظهر وخفض القلق.")],
   hikmah:T("Sujud adalah puncak kehambaan: tempat tertinggi dari tubuh diletakkan di tempat terendah. Ibnul Qayyim berkata sujud adalah 'rahasia salat dan rukun terbesarnya'. Di sinilah semua jabatan dilucuti. Dan di sinilah, kata Nabi ﷺ, engkau paling dekat — maka jangan bangkit dengan doa yang belum selesai.","Prostration is the summit of servitude: the highest part of the body placed at the lowest point. Ibn al-Qayyim called it 'the secret of prayer and its greatest pillar'. Here every title is stripped away. And here, said the Prophet ﷺ, you are closest — so do not rise with your supplication unfinished.","السجود ذروة العبودية: أعلى الجسد يوضع في أدنى موضع. قال ابن القيم: السجود سر الصلاة وأعظم أركانها. هنا تُنزع كل الألقاب. وهنا، كما قال ﷺ، أنت أقرب ما تكون؛ فلا تنهض ودعاؤك لم يكتمل.")
  },

     d:T("Punggung merosot dan dagu maju: duduk 'di atas tulang ekor' bukan tulang duduk. Napas terjepit dan bacaan tujuh permohonan jadi tergesa.","Slumped back with the chin forward: sitting 'on the tailbone' instead of the sit bones. Breathing is pinched and the seven requests get rushed.","تقوّس الظهر وتقدّم الذقن: جلوس على العصعص لا على عظمي الجلوس. يُحشر النفس وتُستعجل الطلبات السبع.")},
   fiqh:[
     [T("Cara duduk","How to sit","صفة الجلوس"),T("Abu Humaid: \"Ketika duduk pada rakaat kedua beliau duduk di atas kaki kirinya dan menegakkan kaki kanannya.\" — HR Bukhari 828. Dipakai antara dua sujud dan tasyahud awal.","Abu Humayd: \"When he sat in the second rak'ah he sat on his left foot and set the right upright.\" — Bukhari 828. Used between the prostrations and in the first tashahhud.","أبو حميد: «فإذا جلس في الركعتين جلس على رجله اليسرى ونصب اليمنى» — البخاري 828. وهي بين السجدتين وفي التشهد الأول.")],
     [T("Tangan di paha","Hands on the thighs","اليدان على الفخذين"),T("Telapak tangan di atas paha/lutut, jari menghadap kiblat — HR Muslim 580.","Palms on the thighs/knees, fingers toward the qiblah — Muslim 580.","الكفان على الفخذين أو الركبتين والأصابع إلى القبلة — مسلم 580.")],
     [T("Tumaninah & lama","Stillness & length","الطمأنينة والإطالة"),T("Nabi ﷺ duduk antara dua sujud hampir selama sujudnya — HR Bukhari 820.","The Prophet ﷺ sat between the prostrations nearly as long as his prostration — Bukhari 820.","كان ﷺ يجلس بين السجدتين قريبًا من سجوده — البخاري 820.")],
     [T("Jari kaki kanan","Right toes","أصابع القدم اليمنى"),T("Ditegakkan dengan jari menghadap kiblat — HR Muslim 579.","Set upright with the toes toward the qiblah — Muslim 579.","تُنصب وتوجَّه أصابعها إلى القبلة — مسلم 579.")]],
   fisio:[
     [T("Lutut","Knees","الركبتان"),T("Fleksi dalam (≈140°) — aman bagi lutut sehat dan menjaga rentang gerak penuh; bagi lutut bermasalah, taruh beban ke tangan di paha, dan boleh duduk di kursi bila sakit (rukhsah).","Deep flexion (≈140°) — safe for healthy knees and maintains full range; with knee problems, shift weight to the hands on the thighs, and a chair is permitted if it hurts (rukhsah).","ثني عميق (≈140°) آمن للركبة السليمة ويحفظ مدى الحركة؛ ومع مشاكل الركبة انقل الوزن إلى اليدين على الفخذين، ويجوز الجلوس على كرسي عند الألم (رخصة).")],
     [T("Pergelangan kaki","Ankles","الكاحلان"),T("Kaki kiri plantarfleksi (punggung kaki menempel), kaki kanan dorsifleksi — dua arah peregangan sekaligus.","Left foot plantarflexed (top of the foot down), right foot dorsiflexed — two stretches at once.","القدم اليسرى في عطف أخمصي (ظهرها على الأرض) واليمنى في عطف ظهري: إطالتان في اتجاهين معًا.")],
     [T("Punggung","Back","الظهر"),T("Tegak, duduk 'di atas tulang duduk', dada terbuka; ubun-ubun ditarik ke atas.","Upright, sitting 'on the sit bones', chest open; the crown drawn upward.","منتصب، جالس على عظمي الجلوس، الصدر مفتوح، وقمة الرأس مشدودة إلى الأعلى.")],
     [T("Transisi","Transition","الانتقال"),T("Bangkit dari sujud ke duduk dengan mendorong tangan, bukan menyentak leher.","Rise from prostration to sitting by pushing with the hands, not jerking the neck.","انهض من السجود إلى الجلوس بدفع اليدين لا بشدّ الرقبة.")]],
   sehat:[T("Mempertahankan fleksi lutut penuh — rentang gerak yang hilang pertama kali pada osteoartritis.","Preserves full knee flexion — the first range lost in osteoarthritis.","يحفظ ثني الركبة الكامل، وهو أول مدى يُفقد في خشونة المفاصل."),T("Peregangan tibialis anterior (kaki kiri) dan betis + plantar fascia (kaki kanan).","Stretches tibialis anterior (left) and calf + plantar fascia (right).","إطالة الظنبوبية الأمامية (اليسرى) والساق واللفافة الأخمصية (اليمنى)."),T("Duduk di lantai secara teratur dikaitkan dengan kemampuan bangun tanpa bantuan — penanda kebugaran fungsional di usia lanjut.","Regular floor sitting is linked to rising unaided — a strong marker of functional fitness in later life.","الجلوس المنتظم على الأرض مرتبط بالقدرة على النهوض دون عون، وهو مؤشر قوي للياقة الوظيفية في الكبر.")],
   hikmah:T("Duduk sejenak antara dua sujud adalah napas di antara dua kerendahan: tempat meminta tujuh hal yang merangkum seluruh kebutuhan manusia. Jangan jadikan ia sekadar 'transisi'; Nabi ﷺ memanjangkannya.","The brief sitting between two prostrations is a breath between two lowerings: the place to ask seven things that cover every human need. Do not treat it as a mere 'transition'; the Prophet ﷺ prolonged it.","الجلسة بين السجدتين نفَس بين خضوعين: موضع طلب سبعة أشياء تجمع حاجات الإنسان. لا تجعلها مجرد «انتقال»؛ فقد كان ﷺ يطيلها.")
  },

   breath:T("Napas paling pelan dalam salat; detak jantung terendah dicapai di sini.","The slowest breathing of the prayer; the heart rate is lowest here.","أبطأ تنفس في الصلاة؛ وهنا يبلغ النبض أدنى معدلاته."),
   wrong:null,
   fiqh:[
     [T("Cara duduk","How to sit","صفة الجلوس"),T("Abu Humaid: \"Pada rakaat terakhir, beliau mengeluarkan kaki kirinya dan menegakkan kaki kanannya, lalu duduk di atas pantatnya.\" — HR Bukhari 828. Syafi'i: tawarruk pada tasyahud yang diikuti salam.","Abu Humayd: \"In the last rak'ah he put his left foot forward (under the right), set the right upright, and sat on his seat.\" — Bukhari 828. Shafi'i: tawarruk in the tashahhud followed by the salam.","أبو حميد: «فإذا جلس في الركعة الأخيرة قدّم رجله اليسرى ونصب الأخرى وقعد على مقعدته» — البخاري 828. الشافعية: التورك في التشهد الذي يعقبه السلام.")],
     [T("Isyarat telunjuk","Pointing the index finger","الإشارة بالسبابة"),T("Nabi ﷺ menggenggam jari tangan kanan dan berisyarat dengan telunjuk; pandangan tidak melampaui isyaratnya — HR Muslim 580, Nasa'i 1275.","The Prophet ﷺ closed the right hand and pointed with the index finger; his gaze did not go beyond it — Muslim 580, Nasa'i 1275.","قبض ﷺ أصابع يده اليمنى وأشار بالسبابة، ولا يجاوز بصره إشارته — مسلم 580 والنسائي 1275.")],
     [T("Tangan kiri","Left hand","اليد اليسرى"),T("Terhampar di atas paha kiri — HR Muslim 580.","Spread over the left thigh — Muslim 580.","مبسوطة على الفخذ اليسرى — مسلم 580.")],
     [T("Tumaninah","Stillness","الطمأنينة"),T("Rukun; di sini dibaca tasyahud, salawat, dan doa perlindungan dari empat hal (HR Muslim 588).","A pillar; here the tashahhud, salawat and the refuge from four things are recited (Muslim 588).","ركن؛ وفيه التشهد والصلاة الإبراهيمية والاستعاذة من أربع (مسلم 588).")]],
   fisio:[
     [T("Panggul","Pelvis","الحوض"),T("Rotasi eksternal pinggul kiri dan beban di tulang duduk; posisi duduk paling stabil (basis tumpuan terlebar) — cocok untuk bagian salat terlama.","External rotation of the left hip with the weight on the sit bones; the most stable seat (widest base) — suited to the longest part of the prayer.","دوران خارجي للورك الأيسر والوزن على عظمي الجلوس؛ أثبت جلسة (أوسع قاعدة) تناسب أطول أجزاء الصلاة.")],
     [T("Lutut kiri","Left knee","الركبة اليسرى"),T("Tertekuk dan terputar ke dalam; bila ada riwayat cedera meniskus, rasa tidak nyaman wajar — cukup duduk iftirasy (sah menurut semua madzhab).","Bent and rotated inward; with a meniscus history some discomfort is normal — iftirash is sufficient (valid in all schools).","مثنية ومدوّرة إلى الداخل؛ ومع تاريخ إصابة الغضروف الهلالي يتوقع بعض الانزعاج، ويكفي الافتراش (صحيح عند جميع المذاهب).")],
     [T("Punggung","Back","الظهر"),T("Tegak, bahu rileks. Bila punggung lelah di akhir salat, itu tanda otot postural perlu dilatih, bukan alasan merosot.","Upright, shoulders relaxed. A tired back at the end of prayer signals postural muscles to train, not a reason to slump.","منتصب والكتفان مسترخيان. تعب الظهر في آخر الصلاة إشارة إلى الحاجة لتدريب عضلات القوام لا مسوّغ للتراخي.")],
     [T("Jari telunjuk","Index finger","السبابة"),T("Isyarat kecil, pergelangan rileks; tidak perlu digerakkan dengan kaku.","A small gesture, relaxed wrist; no stiff waggling.","إشارة خفيفة ومعصم مرتخٍ؛ لا حاجة لتحريك متصلب.")]],
   sehat:[T("Melatih rotasi eksternal pinggul — rentang gerak yang hilang pada orang yang banyak duduk di kursi.","Trains external hip rotation — a range lost in chair-sitters.","يدرّب الدوران الخارجي للورك، وهو مدى يفقده من يكثر الجلوس على الكراسي."),T("Variasi duduk lantai (iftirasy dan tawarruk) merangsang mobilitas sendi panggul dari dua sisi berbeda.","Alternating floor sits (iftirash and tawarruk) mobilizes the hip joints from two different sides.","تنويع الجلوس الأرضي (الافتراش والتورك) يحرّك مفصل الورك من جانبين مختلفين."),T("Jeda hening terpanjang dalam salat; detak jantung paling rendah dicapai di sini.","The longest quiet pause of the prayer; the lowest heart rate is reached here.","أطول سكون في الصلاة؛ وهنا أدنى معدل للنبض.")],
   hikmah:T("Tawarruk adalah duduknya orang yang 'sudah sampai': pangkal paha menyentuh bumi, tak ada lagi yang ditopang. Tasyahud dibaca sebagai orang yang telah menyelesaikan perjalanan — dan telunjuk yang terangkat adalah satu-satunya isyarat yang tersisa: Dia Satu.","Tawarruk is the sitting of one who has 'arrived': the seat touches the earth, nothing is held up anymore. The tashahhud is recited as one who has completed the journey — and the raised finger is the only sign left: He is One.","التورك جلسة من «وصل»: المقعدة على الأرض ولا شيء يُحمل بعدُ. يُقرأ التشهد قراءة من أتمّ الرحلة، والسبابة المرفوعة هي الإشارة الوحيدة الباقية: هو واحد.")
  },

     [T("Dua salam","Two salams","التسليمتان"),T("Nabi ﷺ salam ke kanan dan ke kiri: 'As-salāmu 'alaikum wa raḥmatullāh' hingga terlihat putih pipinya — HR Muslim 582, Abu Dawud 996. Salam pertama rukun, kedua sunnah (Syafi'i).","The Prophet ﷺ gave salam right and left: 'As-salāmu 'alaikum wa raḥmatullāh' until the whiteness of his cheek showed — Muslim 582, Abu Dawud 996. The first is a pillar, the second sunnah (Shafi'i).","كان ﷺ يسلّم عن يمينه وعن يساره: «السلام عليكم ورحمة الله» حتى يُرى بياض خده — مسلم 582 وأبو داود 996. الأولى ركن والثانية سنة (الشافعية).")],
     [T("Niat salam","Intention of the salam","نية السلام"),T("Diniatkan keluar dari salat dan memberi salam kepada malaikat dan jamaah di sisi kanan dan kiri.","Intended as leaving the prayer and greeting the angels and congregation to the right and left.","ينوي الخروج من الصلاة والسلام على الملائكة والمصلين عن يمينه ويساره.")],
     [T("Setelah salam","After the salam","بعد السلام"),T("Istighfar tiga kali lalu 'Allāhumma antas-salām...' — HR Muslim 591. Lihat tab Setelah.","Istighfar three times, then 'Allāhumma antas-salām...' — Muslim 591. See the After tab.","الاستغفار ثلاثًا ثم «اللهم أنت السلام...» — مسلم 591. انظر تبويب «بعد الصلاة».")]],
   fisio:[
     [T("Leher","Neck","الرقبة"),T("Rotasi servikal penuh ke kanan lalu kiri, perlahan, dengan dagu sejajar lantai. Latihan mobilitas leher yang aman jika tanpa sentakan.","Full cervical rotation right then left, slowly, chin level with the floor. A safe neck-mobility exercise when done without jerking.","دوران رقبي كامل يمينًا ثم يسارًا ببطء والذقن موازٍ للأرض. تمرين آمن لحركية الرقبة إذا خلا من الاندفاع.")],
     [T("Pandangan","Gaze","البصر"),T("Mengikuti arah toleh; bahu tetap diam menghadap kiblat.","Follows the turn; the shoulders stay still, facing the qiblah.","يتبع الالتفات؛ والكتفان ثابتان نحو القبلة.")]],
   sehat:[T("Rotasi leher aktif 10× sehari (dua salam × lima waktu) menjaga rentang gerak servikal yang menurun karena menatap layar.","Active neck rotation 10× a day (two salams × five prayers) preserves cervical range lost to screens.","دوران نشط للرقبة عشر مرات يوميًا (تسليمتان × خمس صلوات) يحفظ مدى الحركة الذي تُفقده الشاشات."),T("Transisi dari hening ke bergerak secara perlahan — 'pendinginan' sebelum kembali ke dunia.","A gradual transition from stillness to movement — a 'cool-down' before returning to the world.","انتقال تدريجي من السكون إلى الحركة: «تبريد» قبل العودة إلى الدنيا.")],
   hikmah:T("Salat ditutup dengan menghadap manusia. Orang yang khusyuk bukan yang menghilang dari dunia, tetapi yang kembali ke dunia dengan membawa salam — keselamatan bagi orang-orang di kanan dan kirinya.","Prayer closes by facing people. The one with khushu' is not the one who vanishes from the world, but the one who returns to it carrying salam — safety for those on his right and left.","تُختم الصلاة بالتوجه إلى الناس. الخاشع ليس من يغيب عن الدنيا، بل من يعود إليها حاملًا السلام: أمانًا لمن عن يمينه وشماله.")
  }

  {waktu:T("Pagi, ¼ siang hingga sebelum zawal","Mid-morning until before noon","الضحى حتى قبيل الزوال"), nama:T("Salat Dhuha","Duha Prayer","صلاة الضحى"), rakaat:T("2 hingga 8","2 to 8","من 2 إلى 8"), hukum:T("Sunnah muakkadah — wasiat Nabi ﷺ","Emphasized sunnah — the Prophet's ﷺ advice","سنة مؤكدة، وصية النبي ﷺ"), grade:"sahih",
   dalil:[["HR Muslim 720",T("\"Setiap pagi, tiap ruas tulang kalian wajib disedekahi... dan semua itu dicukupi oleh dua rakaat Dhuha.\"","\"Every morning charity is due from every joint of you... and two rak'ahs of Duha suffice for all of it.\"","«يصبح على كل سلامى من أحدكم صدقة... ويجزئ من ذلك ركعتان يركعهما من الضحى»")],["HR Bukhari 1178, Muslim 721",T("Abu Hurairah: \"Kekasihku ﷺ mewasiatkan: puasa tiga hari tiap bulan, dua rakaat Dhuha, dan witir sebelum tidur.\"","Abu Hurairah: \"My beloved ﷺ advised me: fast three days a month, pray two rak'ahs of Duha, and pray witr before sleeping.\"","أبو هريرة: «أوصاني خليلي ﷺ بثلاث: صيام ثلاثة أيام من كل شهر، وركعتي الضحى، وأن أوتر قبل أن أنام»")],["HR Muslim 719",T("Ummu Hani': beliau salat delapan rakaat pada hari Fathu Makkah di waktu Dhuha.","Umm Hani': he prayed eight rak'ahs at Duha time on the day of the conquest of Makkah.","أم هانئ: صلى ثماني ركعات ضحى يوم الفتح.")],["HR Muslim 748",T("\"Salat awwābīn adalah ketika anak unta mulai kepanasan\" — sekitar pukul 9–10.","\"The prayer of the oft-returning is when the young camels feel the heat\" — about 9–10 a.m.","«صلاة الأوابين حين ترمض الفصال»: نحو الساعة التاسعة أو العاشرة.")]],
   praktik:T("Waktu: sejak matahari setinggi tombak sampai menjelang zawal. Dua rakaat sudah menunaikan 'sedekah 360 ruas'.","Time: from the sun at spear-height until just before noon. Two rak'ahs fulfil the 'charity of the 360 joints'.","وقتها من ارتفاع الشمس قيد رمح إلى قبيل الزوال. وركعتان تجزئان عن «صدقة الـ360 مفصلًا».")},
  {waktu:T("Setiap selesai wudhu","After every wudu","عقب كل وضوء"), nama:T("Sunnah Wudhu","Sunnah of Wudu","سنة الوضوء"), rakaat:T("2","2","ركعتان"), hukum:T("Sunnah","Sunnah","سنة"), grade:"sahih",
   dalil:[["HR Bukhari 160, Muslim 226",T("\"Siapa berwudhu seperti wudhuku ini, lalu salat dua rakaat tanpa berbicara pada dirinya (melamun), diampuni dosanya yang telah lalu.\"","\"Whoever performs wudu as I have, then prays two rak'ahs without his mind wandering, his past sins are forgiven.\"","«من توضأ نحو وضوئي هذا ثم صلى ركعتين لا يحدث فيهما نفسه غُفر له ما تقدم من ذنبه»")],["HR Bukhari 1149, Muslim 2458",T("Nabi ﷺ mendengar suara sandal Bilal di surga; sebabnya Bilal selalu salat dua rakaat setiap kali bersuci.","The Prophet ﷺ heard Bilal's footsteps in Paradise; the reason: Bilal always prayed two rak'ahs after every purification.","سمع ﷺ خشف نعلي بلال في الجنة لأنه ما تطهّر إلا صلى ركعتين.")]],
   praktik:T("Boleh dirangkap dengan tahiyyatul masjid atau rawatib. Syaratnya 'tanpa berbicara pada diri sendiri' — latihan khusyuk paling ringkas.","May be combined with tahiyyat al-masjid or rawatib. Its condition, 'without the mind wandering', is the shortest training in khushu'.","يُجمع مع تحية المسجد أو الرواتب. وشرطه «لا يحدث فيهما نفسه» أقصر تدريب على الخشوع.")},
  {waktu:T("Setiap masuk masjid","On entering the mosque","عند دخول المسجد"), nama:T("Tahiyyatul Masjid","Greeting the Mosque","تحية المسجد"), rakaat:T("2 sebelum duduk","2 before sitting","ركعتان قبل الجلوس"), hukum:T("Sunnah muakkadah; tetap dikerjakan walau khatib berkhutbah","Emphasized sunnah; even during the Friday sermon","سنة مؤكدة ولو كان الخطيب يخطب"), grade:"sahih",
   dalil:[["HR Bukhari 444, Muslim 714",T("\"Jika salah seorang kalian masuk masjid, janganlah duduk sebelum salat dua rakaat.\"","\"When one of you enters the mosque, let him not sit until he prays two rak'ahs.\"","«إذا دخل أحدكم المسجد فلا يجلس حتى يصلي ركعتين»")],["HR Muslim 875",T("Nabi ﷺ menyuruh Sulaik yang datang saat khutbah: \"Berdirilah, salatlah dua rakaat, dan ringankanlah.\"","The Prophet ﷺ told Sulayk, who arrived during the sermon: \"Stand, pray two rak'ahs, and keep them short.\"","قال ﷺ لسُليك وقد دخل والخطيب يخطب: «قم فاركع ركعتين وتجوّز فيهما»")]],
   praktik:T("Gugur jika langsung ikut salat fardhu/rawatib. Di Masjidil Haram, thawaf adalah tahiyyatnya.","Waived if one joins the obligatory or rawatib prayer directly. In the Sacred Mosque, tawaf is its greeting.","تسقط إذا دخل في فريضة أو راتبة مباشرة. وفي المسجد الحرام تحيته الطواف.")},
  {waktu:T("Sebelum & sesudah Dzuhur","Before & after Dhuhr","قبل الظهر وبعده"), nama:T("Rawatib Dzuhur","Rawatib of Dhuhr","رواتب الظهر"), rakaat:T("4 sebelum dan 2 sesudah; atau 4 + 4","4 before and 2 after; or 4 + 4","4 قبل و2 بعد، أو 4 + 4"), hukum:T("Sunnah muakkadah (12 rakaat rawatib)","Emphasized sunnah (the 12 rawatib)","سنة مؤكدة (من الرواتب الاثنتي عشرة)"), grade:"sahih",
   dalil:[["HR Muslim 728, Tirmidzi 415",T("Ummu Habibah: \"Siapa salat dua belas rakaat sunnah dalam sehari semalam, dibangunkan untuknya rumah di surga\": 4 sebelum Dzuhur, 2 sesudahnya, 2 sesudah Maghrib, 2 sesudah Isya, 2 sebelum Subuh.","Umm Habibah: \"Whoever prays twelve voluntary rak'ahs a day has a house built for him in Paradise\": 4 before Dhuhr, 2 after, 2 after Maghrib, 2 after Isha, 2 before Fajr.","أم حبيبة: «من صلى في يوم وليلة ثنتي عشرة ركعة بُني له بيت في الجنة»: أربعًا قبل الظهر وركعتين بعدها، وركعتين بعد المغرب، وركعتين بعد العشاء، وركعتين قبل الفجر.")],["HR Abu Dawud 1269, Tirmidzi 428 (sahih)",T("\"Siapa menjaga empat rakaat sebelum Dzuhur dan empat sesudahnya, Allah mengharamkannya atas neraka.\"","\"Whoever keeps four before Dhuhr and four after, Allah forbids him to the Fire.\"","«من حافظ على أربع ركعات قبل الظهر وأربع بعدها حرّمه الله على النار»")],["HR Bukhari 731, Muslim 781",T("\"Salat seseorang yang paling utama adalah di rumahnya, kecuali salat fardhu.\"","\"The best prayer of a person is in his home, except the obligatory.\"","«أفضل صلاة المرء في بيته إلا المكتوبة»")]],
   praktik:T("Jumat: sebelum Jumat salat mutlak hingga imam naik mimbar; sesudahnya 4 rakaat di masjid atau 2 di rumah (HR Muslim 881–882).","Friday: unrestricted prayer before the imam ascends; afterward 4 in the mosque or 2 at home (Muslim 881–882).","الجمعة: نافلة مطلقة قبل صعود الإمام، وبعدها أربع في المسجد أو ركعتان في البيت (مسلم 881–882).")},
  {waktu:T("Sebelum Ashar","Before Asr","قبل العصر"), nama:T("Qabliyah Ashar","Before Asr (sunnah)","سنة العصر القبلية"), rakaat:T("4 atau 2","4 or 2","4 أو 2"), hukum:T("Sunnah ghairu muakkadah","Non-emphasized sunnah","سنة غير مؤكدة"), grade:"hasan",
   dalil:[["HR Abu Dawud 1271, Tirmidzi 430 (hasan)",T("\"Semoga Allah merahmati orang yang salat empat rakaat sebelum Ashar.\"","\"May Allah have mercy on one who prays four rak'ahs before Asr.\"","«رحم الله امرأً صلى قبل العصر أربعًا»")],["HR Bukhari 627, Muslim 838",T("\"Di antara setiap dua adzan ada salat\" — tiga kali, lalu: \"bagi yang mau.\"","\"Between every two calls there is a prayer\" — three times, then: \"for whoever wishes.\"","«بين كل أذانين صلاة» ثلاثًا، ثم قال: «لمن شاء»")]],
   praktik:T("Tidak ada ba'diyah Ashar: salat setelah Ashar hingga Maghrib dilarang (HR Bukhari 586).","There is no sunnah after Asr: prayer after Asr until Maghrib is forbidden (Bukhari 586).","لا راتبة بعد العصر؛ فالصلاة بعد العصر حتى المغرب منهي عنها (البخاري 586).")},
  {waktu:T("Antara adzan & iqamah Maghrib","Between the Maghrib adhan & iqamah","بين أذان المغرب وإقامته"), nama:T("Qabliyah Maghrib","Before Maghrib (sunnah)","سنة المغرب القبلية"), rakaat:T("2, ringan","2, light","ركعتان خفيفتان"), hukum:T("Sunnah ghairu muakkadah","Non-emphasized sunnah","سنة غير مؤكدة"), grade:"sahih",
   dalil:[["HR Bukhari 1183",T("\"Salatlah sebelum Maghrib\" (tiga kali), lalu: \"bagi yang mau.\"","\"Pray before Maghrib\" (three times), then: \"for whoever wishes.\"","«صلّوا قبل صلاة المغرب» ثلاثًا، ثم قال: «لمن شاء»")],["HR Bukhari 625, Muslim 837",T("Para sahabat senior bergegas salat dua rakaat setelah adzan Maghrib hingga orang asing mengira salat fardhu sudah dimulai.","Senior Companions hurried to pray two rak'ahs after the Maghrib adhan, so that strangers thought the obligatory prayer had begun.","كان كبار الصحابة يبتدرون السواري لركعتين بعد أذان المغرب حتى يظن الغريب أن الصلاة قد صُلّيت.")]],
   praktik:T("Dikerjakan segera setelah adzan karena waktunya sempit.","Done right after the adhan since the time is short.","تُصلى عقب الأذان مباشرة لضيق الوقت.")},
  {waktu:T("Sesudah Maghrib","After Maghrib","بعد المغرب"), nama:T("Ba'diyah Maghrib","After Maghrib (sunnah)","سنة المغرب البعدية"), rakaat:T("2","2","ركعتان"), hukum:T("Sunnah muakkadah (rawatib)","Emphasized sunnah (rawatib)","سنة مؤكدة (راتبة)"), grade:"sahih",
   dalil:[["HR Muslim 728",T("Termasuk 12 rakaat rawatib.","Among the 12 rawatib.","من الرواتب الاثنتي عشرة.")],["HR Tirmidzi 431 (hasan)",T("Dibaca Al-Kafirun dan Al-Ikhlas.","Al-Kafirun and Al-Ikhlas are recited.","يقرأ فيهما بالكافرون والإخلاص.")],["HR Bukhari 1172",T("Ibnu Umar: beliau salat dua rakaat setelah Maghrib di rumahnya.","Ibn Umar: he prayed two rak'ahs after Maghrib at home.","ابن عمر: صلى ركعتين بعد المغرب في بيته.")]],
   praktik:T("Lebih utama di rumah — kesempatan mengajari anak-anak bahwa ayah mereka juga salat sunnah di rumah.","Best at home — a chance to show the children that their father also prays sunnah at home.","الأفضل في البيت؛ فرصة ليرى الأبناء أن أباهم يتنفل في البيت أيضًا.")},
  {waktu:T("Antara Maghrib dan Isya","Between Maghrib and Isha","بين المغرب والعشاء"), nama:T("Salat mutlak antara Maghrib–Isya (\"Awwabin\" 6 rakaat)","Unrestricted prayer between Maghrib–Isha (\"Awwabin\" 6 rak'ahs)","نافلة ما بين المغرب والعشاء («الأوابين» ست ركعات)"), rakaat:T("Bebas, 2–2","Any, two by two","مطلقة، مثنى مثنى"), hukum:T("Salat mutlak dianjurkan; riwayat 6 rakaat khusus lemah","Unrestricted prayer is encouraged; the specific 6-rak'ah report is weak","النافلة المطلقة مستحبة؛ وحديث الست ضعيف"), grade:"dhaif",
   dalil:[["HR Tirmidzi 435 — DHAIF",T("\"Siapa salat enam rakaat setelah Maghrib... setara ibadah dua belas tahun.\" Tirmidzi sendiri menyatakan sanadnya lemah (Umar bin Abi Khats'am, munkar).","\"Whoever prays six rak'ahs after Maghrib... it equals twelve years of worship.\" Tirmidhi himself declared the chain weak (Umar ibn Abi Khath'am, munkar).","«من صلى بعد المغرب ست ركعات... عُدلت له بعبادة ثنتي عشرة سنة». ضعّفه الترمذي نفسه (عمر بن أبي خثعم منكر الحديث).")],["QS As-Sajdah 16",T("\"Lambung mereka jauh dari tempat tidur...\" — sebagian salaf menafsirkannya sebagai salat antara Maghrib dan Isya.","\"Their sides forsake their beds...\" — some of the salaf read it as prayer between Maghrib and Isha.","﴿تتجافى جنوبهم عن المضاجع﴾: فسّره بعض السلف بالصلاة بين المغرب والعشاء.")]],
   praktik:T("Kerjakan sebagai salat mutlak tanpa meyakini keutamaan 'dua belas tahun'. Jangan sebarkan angka pahala yang haditsnya lemah.","Pray it as unrestricted prayer without believing the 'twelve years' merit. Do not spread reward figures from weak hadiths.","صلّها نافلة مطلقة دون اعتقاد فضل «اثنتي عشرة سنة». ولا تنشر مقادير أجر أحاديثها ضعيفة.")},
  {waktu:T("Sesudah Isya","After Isha","بعد العشاء"), nama:T("Ba'diyah Isya","After Isha (sunnah)","سنة العشاء البعدية"), rakaat:T("2","2","ركعتان"), hukum:T("Sunnah muakkadah (rawatib)","Emphasized sunnah (rawatib)","سنة مؤكدة (راتبة)"), grade:"sahih",
   dalil:[["HR Muslim 728",T("Termasuk 12 rakaat rawatib.","Among the 12 rawatib.","من الرواتب الاثنتي عشرة.")],["HR Bukhari 1172",T("Ibnu Umar: beliau salat dua rakaat sesudah Isya di rumahnya.","Ibn Umar: he prayed two after Isha at home.","ابن عمر: صلى ركعتين بعد العشاء في بيته.")]],
   praktik:T("Tidak ada qabliyah Isya yang muakkad; cukup 2 rakaat berdasarkan 'di antara dua adzan ada salat'.","No emphasized sunnah before Isha; two rak'ahs suffice based on 'between every two calls there is a prayer'.","لا راتبة مؤكدة قبل العشاء؛ وتكفي ركعتان لحديث «بين كل أذانين صلاة».")},
  {waktu:T("Sebelum tidur","Before sleeping","قبل النوم"), nama:T("Witir (bila belum) + wudhu + dzikir tidur","Witr (if not yet prayed) + wudu + sleep dhikr","الوتر (إن لم يوتر) والوضوء وأذكار النوم"), rakaat:T("Witir 1 atau 3","Witr 1 or 3","وتر 1 أو 3"), hukum:T("Sunnah","Sunnah","سنة"), grade:"sahih",
   dalil:[["HR Bukhari 1178",T("Wasiat Nabi ﷺ kepada Abu Hurairah: \"...dan witir sebelum tidur.\"","The Prophet's ﷺ advice to Abu Hurairah: \"...and witr before you sleep.\"","وصية النبي ﷺ لأبي هريرة: «...وأن أوتر قبل أن أنام»")],["HR Bukhari 247, Muslim 2710",T("\"Jika mendatangi tempat tidurmu, berwudhulah, berbaringlah di sisi kanan, lalu ucapkan: Allāhumma aslamtu nafsī ilaik... Jika kau mati malam itu, kau mati dalam fitrah.\"","\"When you go to bed, perform wudu, lie on your right side, and say: O Allah, I submit myself to You... If you die that night, you die upon the fitrah.\"","«إذا أتيت مضجعك فتوضأ وضوءك للصلاة ثم اضطجع على شقك الأيمن ثم قل: اللهم أسلمت نفسي إليك... فإن متّ من ليلتك فأنت على الفطرة»")],["HR Bukhari 6318, Muslim 2727",T("Tasbih 33, tahmid 33, takbir 34 sebelum tidur — wasiat kepada Fatimah dan Ali.","33 tasbih, 33 tahmid, 34 takbir before sleep — the advice to Fatimah and Ali.","تسبيح 33 وتحميد 33 وتكبير 34 قبل النوم: وصيته لفاطمة وعلي.")],["HR Bukhari 2311, 5009, 5017",T("Ayat Kursi, dua ayat terakhir Al-Baqarah, dan tiga Qul dengan mengusap tubuh.","Ayat al-Kursi, the last two verses of Al-Baqarah, and the three Quls while wiping the body.","آية الكرسي وخاتمة البقرة والمعوذات مع المسح على الجسد.")]],
   praktik:T("Urutan: wudhu → witir (bila belum) → berbaring miring kanan → Ayat Kursi, akhir Al-Baqarah, tiga Qul + usap → tasbih 33/33/34 → doa tidur.","Order: wudu → witr (if not yet) → lie on the right side → Ayat al-Kursi, end of Al-Baqarah, three Quls + wiping → 33/33/34 → sleep supplication.","الترتيب: وضوء ← وتر (إن لم يوتر) ← اضطجاع على الأيمن ← آية الكرسي وخاتمة البقرة والمعوذات مع المسح ← 33/33/34 ← دعاء النوم.")},
  {waktu:T("Situasional","Situational","حسب الحال"), nama:T("Salat Taubat","Prayer of Repentance","صلاة التوبة"), rakaat:T("2","2","ركعتان"), hukum:T("Sunnah ketika berbuat dosa","Sunnah upon committing a sin","سنة عند الوقوع في ذنب"), grade:"hasan",
   dalil:[["HR Abu Dawud 1521, Tirmidzi 406 (hasan/sahih)",T("Abu Bakar: \"Tidaklah seorang hamba berbuat dosa, lalu bersuci dengan baik, kemudian salat dua rakaat, lalu memohon ampun, kecuali Allah mengampuninya.\" Lalu beliau membaca QS Ali 'Imran 135.","Abu Bakr: \"No servant commits a sin, then purifies himself well, prays two rak'ahs and seeks forgiveness, but Allah forgives him.\" Then he recited Ali 'Imran 135.","أبو بكر: «ما من عبد يذنب ذنبًا فيحسن الطهور ثم يقوم فيصلي ركعتين ثم يستغفر الله إلا غفر الله له»، ثم قرأ آل عمران 135.")]],
   praktik:T("Segera setelah menyadari dosa. Setelah salat: sayyidul istighfar dan 'Rabbighfir lī wa tub 'alayya'.","As soon as you realize the sin. After the prayer: sayyid al-istighfar and 'Rabbighfir lī wa tub 'alayya'.","فور الشعور بالذنب. وبعدها سيد الاستغفار و«رب اغفر لي وتب عليّ».")},
  {waktu:T("Situasional","Situational","حسب الحال"), nama:T("Salat Istikharah","Prayer of Seeking Guidance","صلاة الاستخارة"), rakaat:T("2, lalu doa","2, then the supplication","ركعتان ثم الدعاء"), hukum:T("Sunnah ketika menghadapi pilihan","Sunnah when facing a choice","سنة عند الهمّ بأمر"), grade:"sahih",
   dalil:[["HR Bukhari 1162",T("Jabir: \"Rasulullah ﷺ mengajarkan istikharah dalam segala urusan sebagaimana mengajarkan surah Al-Qur'an.\"","Jabir: \"The Messenger ﷺ taught us istikharah in all matters as he taught us a surah of the Qur'an.\"","جابر: «كان رسول الله ﷺ يعلّمنا الاستخارة في الأمور كلها كما يعلّمنا السورة من القرآن»")]],
   praktik:T("Tidak harus bermimpi; tandanya adalah dimudahkan atau dipalingkan. Boleh diulang.","No dream is required; the sign is ease or being turned away. It may be repeated.","لا يُشترط رؤيا؛ والعلامة التيسير أو الصرف. ويجوز تكرارها.")},
  {waktu:T("Situasional","Situational","حسب الحال"), nama:T("Salat Hajat","Prayer of Need","صلاة الحاجة"), rakaat:T("2","2","ركعتان"), hukum:T("Boleh sebagai salat mutlak + doa; hadits khususnya lemah","Permissible as unrestricted prayer + supplication; the specific hadith is weak","تجوز نافلةً مطلقة مع الدعاء؛ وحديثها الخاص ضعيف"), grade:"dhaif",
   dalil:[["HR Tirmidzi 479, Ibnu Majah 1384 — DHAIF",T("Memuat perawi Fa'id bin Abdurrahman yang matruk; Tirmidzi menyebutnya gharib dan lemah.","Contains the narrator Fa'id ibn Abdurrahman, who is matruk; Tirmidhi called it gharib and weak.","فيه فائد بن عبد الرحمن وهو متروك؛ وقال الترمذي: غريب وفي إسناده مقال.")],["HR Muslim 482 (umum)",T("Salat dua rakaat lalu berdoa — termasuk dalam sujud — disyariatkan secara umum.","Praying two rak'ahs then supplicating — including in prostration — is prescribed in general.","الصلاة ركعتين ثم الدعاء ولو في السجود مشروع على العموم.")]],
   praktik:T("Salatlah dua rakaat dan berdoalah; jangan meyakini tata cara khusus 'salat hajat' sebagai sunnah yang tetap.","Pray two rak'ahs and supplicate; do not hold a specific 'prayer of need' ritual as an established sunnah.","صلّ ركعتين وادعُ؛ ولا تعتقد لصلاة الحاجة كيفية مخصوصة ثابتة.")},
  {waktu:T("Situasional","Situational","حسب الحال"), nama:T("Salat Tasbih","Tasbih Prayer","صلاة التسبيح"), rakaat:T("4 dengan 300 tasbih","4 with 300 tasbih","أربع ركعات بثلاثمائة تسبيحة"), hukum:T("Diperselisihkan: Syafi'iyah & Hanabilah membolehkan","Disputed: Shafi'is & Hanbalis permit it","مختلف فيها: أجازها الشافعية والحنابلة"), grade:"khilaf",
   dalil:[["HR Abu Dawud 1297, Ibnu Majah 1387",T("Dinilai hasan oleh Ibnu Hajar dan al-Albani; dinilai lemah oleh Ibnu Taimiyah dan an-Nawawi (at-Tahdzib).","Graded hasan by Ibn Hajar and al-Albani; weak by Ibn Taymiyyah and an-Nawawi (at-Tahdhib).","حسّنه ابن حجر والألباني؛ وضعّفه ابن تيمية والنووي في التهذيب.")]],
   praktik:T("Boleh sesekali bagi yang menguatkan haditsnya; jangan menyaingi rawatib dan tahajud yang dalilnya pasti.","Occasionally, for those who accept the hadith; it should not rival the rawatib and tahajjud whose evidence is certain.","تجوز أحيانًا لمن قوّى حديثها؛ ولا تُزاحم الرواتب والتهجد الثابتة بيقين.")},
  {waktu:T("Situasional","Situational","حسب الحال"), nama:T("Tarawih, Id, Gerhana, Istisqa'","Tarawih, Eid, Eclipse, Rain prayer","التراويح والعيد والكسوف والاستسقاء"), rakaat:T("Tarawih 8–20 + witir; Id 2; Gerhana 2 (dua ruku' tiap rakaat); Istisqa' 2","Tarawih 8–20 + witr; Eid 2; Eclipse 2 (two bowings each); Rain 2","التراويح 8–20 والوتر؛ العيد 2؛ الكسوف 2 بركوعين؛ الاستسقاء 2"), hukum:T("Sunnah muakkadah pada waktunya","Emphasized sunnah in their time","سنة مؤكدة في وقتها"), grade:"sahih",
   dalil:[["HR Bukhari 37, Muslim 759",T("\"Siapa salat (malam) Ramadan dengan iman dan mengharap pahala, diampuni dosanya yang telah lalu.\"","\"Whoever stands (in prayer) in Ramadan with faith and hope of reward, his past sins are forgiven.\"","«من قام رمضان إيمانًا واحتسابًا غُفر له ما تقدم من ذنبه»")],["HR Bukhari 956; 1041; 1012",T("Id dua rakaat sebelum khutbah; gerhana: \"salatlah hingga tersingkap\"; istisqa' dua rakaat di lapangan.","Eid: two rak'ahs before the sermon; eclipse: \"pray until it clears\"; rain: two rak'ahs in the open.","العيد ركعتان قبل الخطبة؛ الكسوف: «فصلّوا حتى ينجلي»؛ الاستسقاء ركعتان في المصلى.")]],
   praktik:T("Dicantumkan agar peta salat sunnah lengkap.","Listed so the map of voluntary prayers is complete.","أُدرجت لتكتمل خريطة النوافل.")}

const DOA = [
  {g:T("Bangun & malam","Waking & night","الاستيقاظ والليل"), nama:T("Bangun tidur","On waking","عند الاستيقاظ"), arab:"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", latin:"Al-ḥamdu lillāhilladzī aḥyānā ba'da mā amātanā wa ilaihin-nusyūr.", arti:T("Segala puji bagi Allah yang menghidupkan kami setelah mematikan kami, dan kepada-Nya kebangkitan.","Praise be to Allah who gave us life after He caused us to die, and to Him is the resurrection.","الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور."), dalil:"HR Bukhari 6312, Muslim 2711", grade:"sahih"},
  {g:T("Bangun & malam","Waking & night","الاستيقاظ والليل"), nama:T("Terbangun di malam hari (doa yang dikabulkan)","Waking at night (an answered supplication)","التعارّ من الليل (دعاء مستجاب)"), arab:"لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، الْحَمْدُ لِلَّهِ وَسُبْحَانَ اللهِ وَلَا إِلَهَ إِلَّا اللهُ وَاللهُ أَكْبَرُ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ", latin:"Lā ilāha illallāhu waḥdahu lā syarīka lah, lahul-mulku wa lahul-ḥamdu wa huwa 'alā kulli syai'in qadīr. Al-ḥamdu lillāh, wa subḥānallāh, wa lā ilāha illallāh, wallāhu akbar, wa lā ḥaula wa lā quwwata illā billāh.", arti:T("Tiada tuhan selain Allah semata, tiada sekutu bagi-Nya; milik-Nya kerajaan dan pujian, dan Dia Maha Kuasa atas segala sesuatu. Segala puji bagi Allah, Maha Suci Allah, tiada tuhan selain Allah, Allah Maha Besar, tiada daya dan kekuatan kecuali dengan Allah.","There is no god but Allah alone, without partner; His is the dominion and the praise, and He is able over all things. Praise be to Allah, glory be to Allah, there is no god but Allah, Allah is the Greatest, and there is no power nor strength except by Allah.","(النص العربي أعلاه)"), dalil:"HR Bukhari 1154", grade:"sahih", note:T("\"...lalu ia berdoa, niscaya dikabulkan; jika ia berwudhu lalu salat, diterima salatnya.\"","\"...then if he supplicates, he is answered; if he performs wudu and prays, his prayer is accepted.\"","«...ثم قال: اللهم اغفر لي، أو دعا استُجيب له، فإن توضأ وصلى قُبلت صلاته»")},
  {g:T("Bangun & malam","Waking & night","الاستيقاظ والليل"), nama:T("Iftitah tahajud","Opening of tahajjud","استفتاح التهجد"), arab:"اللَّهُمَّ رَبَّ جِبْرَائِيلَ وَمِيكَائِيلَ وَإِسْرَافِيلَ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، أَنْتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ، اهْدِنِي لِمَا اخْتُلِفَ فِيهِ مِنَ الْحَقِّ بِإِذْنِكَ، إِنَّكَ تَهْدِي مَنْ تَشَاءُ إِلَى صِرَاطٍ مُسْتَقِيمٍ", latin:"Allāhumma rabba Jibrā'īla wa Mīkā'īla wa Isrāfīl, fāṭiras-samāwāti wal-arḍ, 'ālimal-ghaibi wasy-syahādah, anta taḥkumu baina 'ibādika fīmā kānū fīhi yakhtalifūn. Ihdinī limakhtulifa fīhi minal-ḥaqqi bi'idznik, innaka tahdī man tasyā'u ilā ṣirāṭim mustaqīm.", arti:T("Ya Allah, Tuhan Jibril, Mikail, dan Israfil; Pencipta langit dan bumi; Yang mengetahui yang gaib dan yang nyata; Engkau yang memutuskan di antara hamba-hamba-Mu dalam apa yang mereka perselisihkan. Tunjukilah aku kebenaran dalam apa yang diperselisihkan dengan izin-Mu; sesungguhnya Engkau memberi petunjuk kepada siapa yang Engkau kehendaki ke jalan yang lurus.","O Allah, Lord of Jibril, Mika'il and Israfil, Creator of the heavens and the earth, Knower of the unseen and the seen; You judge between Your servants in what they differ. Guide me, by Your leave, to the truth in what is disputed; You guide whom You will to a straight path.","(النص العربي أعلاه)"), dalil:"HR Muslim 770", grade:"sahih"},
  {g:T("Bangun & malam","Waking & night","الاستيقاظ والليل"), nama:T("Qunut witir","Witr qunut","قنوت الوتر"), arab:"اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ، وَبَارِكْ لِي فِيمَا أَعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ، فَإِنَّكَ تَقْضِي وَلَا يُقْضَى عَلَيْكَ، إِنَّهُ لَا يَذِلُّ مَنْ وَالَيْتَ، تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ", latin:"Allāhummahdinī fīman hadait, wa 'āfinī fīman 'āfait, wa tawallanī fīman tawallait, wa bārik lī fīmā a'ṭait, wa qinī syarra mā qaḍait, fa innaka taqḍī wa lā yuqḍā 'alaik, innahu lā yadzillu man wālait, tabārakta rabbanā wa ta'ālait.", arti:T("Ya Allah, berilah aku petunjuk bersama orang yang Engkau beri petunjuk, kesehatan bersama orang yang Engkau beri kesehatan, lindungilah aku bersama orang yang Engkau lindungi, berkahilah apa yang Engkau berikan kepadaku, dan jagalah aku dari keburukan apa yang Engkau tetapkan. Sesungguhnya Engkau yang menetapkan dan tidak ada yang menetapkan atas-Mu; tidak akan hina orang yang Engkau lindungi. Maha Berkah Engkau, Tuhan kami, dan Maha Tinggi.","O Allah, guide me among those You have guided, grant me well-being among those You have granted it, take care of me among those You have taken care of, bless me in what You have given, and protect me from the evil of what You have decreed. You decree and none decrees against You; none You befriend is humiliated. Blessed are You, our Lord, and exalted.","(النص العربي أعلاه)"), dalil:"HR Abu Dawud 1425, Tirmidzi 464 (hasan)", grade:"hasan"},
  {g:T("Bangun & malam","Waking & night","الاستيقاظ والليل"), nama:T("Setelah salam witir","After the witr salam","بعد السلام من الوتر"), arab:"سُبْحَانَ الْمَلِكِ الْقُدُّوسِ (٣×)", latin:"Subḥānal-malikil-quddūs (3×)", arti:T("Maha Suci Raja Yang Maha Kudus.","Glory be to the King, the Most Holy.","سبحان الملك القدوس."), dalil:"HR Abu Dawud 1430, Nasa'i 1732 (sahih)", grade:"sahih"},
  {g:T("Wudhu & masjid","Wudu & mosque","الوضوء والمسجد"), nama:T("Setelah wudhu","After wudu","بعد الوضوء"), arab:"أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ. اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ", latin:"Asyhadu allā ilāha illallāhu waḥdahu lā syarīka lah, wa asyhadu anna Muḥammadan 'abduhu wa rasūluh. Allāhummaj'alnī minat-tawwābīna waj'alnī minal-mutaṭahhirīn.", arti:T("Aku bersaksi tiada tuhan selain Allah semata, tiada sekutu bagi-Nya, dan aku bersaksi Muhammad adalah hamba dan utusan-Nya. Ya Allah, jadikanlah aku termasuk orang-orang yang bertaubat dan bersuci.","I bear witness that there is no god but Allah alone, without partner, and that Muhammad is His servant and Messenger. O Allah, make me among those who repent and those who purify themselves.","(النص العربي أعلاه)"), dalil:"HR Muslim 234; Tirmidzi 55 (sahih)", grade:"sahih", note:T("\"Dibukakan baginya delapan pintu surga.\"","\"The eight gates of Paradise are opened for him.\"","«فُتحت له أبواب الجنة الثمانية»")},
  {g:T("Wudhu & masjid","Wudu & mosque","الوضوء والمسجد"), nama:T("Keluar rumah","Leaving the house","الخروج من البيت"), arab:"بِسْمِ اللهِ، تَوَكَّلْتُ عَلَى اللهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ", latin:"Bismillāh, tawakkaltu 'alallāh, wa lā ḥaula wa lā quwwata illā billāh.", arti:T("Dengan nama Allah, aku bertawakal kepada Allah, tiada daya dan kekuatan kecuali dengan Allah.","In the name of Allah, I rely on Allah; there is no power nor strength except by Allah.","(النص العربي أعلاه)"), dalil:"HR Abu Dawud 5095, Tirmidzi 3426 (sahih)", grade:"sahih", note:T("\"Dikatakan kepadanya: engkau dicukupi, dilindungi, dan diberi petunjuk; setan pun menjauh.\"","\"It is said to him: you are sufficed, protected and guided; and the devil withdraws.\"","«يُقال له: هُديت وكُفيت ووُقيت، فيتنحى له الشيطان»")},
  {g:T("Wudhu & masjid","Wudu & mosque","الوضوء والمسجد"), nama:T("Masuk masjid","Entering the mosque","دخول المسجد"), arab:"اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", latin:"Allāhummaftaḥ lī abwāba raḥmatik.", arti:T("Ya Allah, bukakanlah untukku pintu-pintu rahmat-Mu.","O Allah, open for me the gates of Your mercy.","اللهم افتح لي أبواب رحمتك."), dalil:"HR Muslim 713", grade:"sahih"},
  {g:T("Wudhu & masjid","Wudu & mosque","الوضوء والمسجد"), nama:T("Keluar masjid","Leaving the mosque","الخروج من المسجد"), arab:"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", latin:"Allāhumma innī as'aluka min faḍlik.", arti:T("Ya Allah, aku memohon kepada-Mu dari karunia-Mu.","O Allah, I ask You of Your bounty.","اللهم إني أسألك من فضلك."), dalil:"HR Muslim 713", grade:"sahih"},
  {g:T("Wudhu & masjid","Wudu & mosque","الوضوء والمسجد"), nama:T("Setelah adzan","After the adhan","بعد الأذان"), arab:"اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ", latin:"Allāhumma rabba hādzihid-da'watit-tāmmah, waṣ-ṣalātil-qā'imah, āti Muḥammadanil-wasīlata wal-faḍīlah, wab'atshu maqāman maḥmūdanilladzī wa'adtah.", arti:T("Ya Allah, Tuhan pemilik seruan yang sempurna ini dan salat yang akan didirikan, berikanlah kepada Muhammad wasilah dan keutamaan, dan bangkitkanlah ia pada kedudukan terpuji yang telah Engkau janjikan.","O Allah, Lord of this perfect call and the prayer to be established, grant Muhammad the wasilah and excellence, and raise him to the praised station You promised him.","(النص العربي أعلاه)"), dalil:"HR Bukhari 614", grade:"sahih", note:T("\"Halal baginya syafaatku pada hari kiamat.\" Doa antara adzan dan iqamah tidak ditolak (HR Abu Dawud 521).","\"My intercession becomes due for him on the Day of Resurrection.\" Supplication between adhan and iqamah is not rejected (Abu Dawud 521).","«حلّت له شفاعتي يوم القيامة». والدعاء بين الأذان والإقامة لا يُرد (أبو داود 521).")},
  {g:T("Pagi & petang","Morning & evening","الصباح والمساء"), nama:T("Sayyidul Istighfar","The master of seeking forgiveness","سيد الاستغفار"), arab:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", latin:"Allāhumma anta rabbī lā ilāha illā ant, khalaqtanī wa ana 'abduk, wa ana 'alā 'ahdika wa wa'dika mastaṭa't, a'ūdzu bika min syarri mā ṣana't, abū'u laka bini'matika 'alayy, wa abū'u bidzanbī, faghfir lī fa innahu lā yaghfirudz-dzunūba illā ant.", arti:T("Ya Allah, Engkau Tuhanku, tiada tuhan selain Engkau. Engkau menciptakanku dan aku hamba-Mu. Aku berada di atas perjanjian dan janji-Mu semampuku. Aku berlindung kepada-Mu dari keburukan perbuatanku. Aku mengakui nikmat-Mu atasku dan aku mengakui dosaku, maka ampunilah aku; sesungguhnya tidak ada yang mengampuni dosa selain Engkau.","O Allah, You are my Lord, there is no god but You. You created me and I am Your servant, and I keep Your covenant and promise as far as I am able. I seek refuge in You from the evil I have done. I acknowledge Your favor upon me and I acknowledge my sin, so forgive me, for none forgives sins but You.","(النص العربي أعلاه)"), dalil:"HR Bukhari 6306", grade:"sahih", note:T("\"Siapa mengucapkannya di siang hari dengan yakin lalu mati sebelum petang, ia termasuk penghuni surga; demikian pula di malam hari.\"","\"Whoever says it by day with certainty and dies before evening is of the people of Paradise; likewise by night.\"","«من قالها من النهار موقنًا بها فمات من يومه قبل أن يمسي فهو من أهل الجنة، ومن قالها من الليل...»")},
  {g:T("Pagi & petang","Morning & evening","الصباح والمساء"), nama:T("Pagi: Aṣbaḥnā","Morning: Aṣbaḥnā","الصباح: أصبحنا"), arab:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", latin:"Aṣbaḥnā wa aṣbaḥal-mulku lillāh, wal-ḥamdu lillāh, lā ilāha illallāhu waḥdahu lā syarīka lah, lahul-mulku wa lahul-ḥamdu wa huwa 'alā kulli syai'in qadīr. Rabbi as'aluka khaira mā fī hādzal-yaumi wa khaira mā ba'dah, wa a'ūdzu bika min syarri mā fī hādzal-yaumi wa syarri mā ba'dah. Rabbi a'ūdzu bika minal-kasali wa sū'il-kibar, rabbi a'ūdzu bika min 'adzābin fin-nāri wa 'adzābin fil-qabr.", arti:T("Kami memasuki pagi dan kerajaan pun memasuki pagi milik Allah; segala puji bagi Allah. Tiada tuhan selain Allah semata, tiada sekutu bagi-Nya; milik-Nya kerajaan dan pujian, dan Dia Maha Kuasa atas segala sesuatu. Tuhanku, aku memohon kebaikan hari ini dan sesudahnya, dan berlindung dari keburukan hari ini dan sesudahnya. Tuhanku, aku berlindung dari kemalasan dan keburukan masa tua; aku berlindung dari azab neraka dan azab kubur.","We have reached the morning and the dominion belongs to Allah; praise be to Allah. There is no god but Allah alone, without partner; His is the dominion and the praise, and He is able over all things. My Lord, I ask You for the good of this day and what follows it, and I seek refuge from the evil of this day and what follows it. My Lord, I seek refuge from laziness and the misery of old age; I seek refuge from punishment in the Fire and in the grave.","(النص العربي أعلاه)"), dalil:"HR Muslim 2723", grade:"sahih", note:T("Petang: ganti 'aṣbaḥnā' dengan 'amsainā' dan 'hādzal-yaum' dengan 'hādzihil-lailah'.","Evening: replace 'aṣbaḥnā' with 'amsainā' and 'this day' with 'this night'.","في المساء: «أمسينا وأمسى الملك لله... خير ما في هذه الليلة».")},
  {g:T("Pagi & petang","Morning & evening","الصباح والمساء"), nama:T("Bika aṣbaḥnā","Bika aṣbaḥnā","اللهم بك أصبحنا"), arab:"اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ", latin:"Allāhumma bika aṣbaḥnā wa bika amsainā, wa bika naḥyā wa bika namūt, wa ilaikan-nusyūr.", arti:T("Ya Allah, dengan-Mu kami memasuki pagi dan petang; dengan-Mu kami hidup dan mati, dan kepada-Mu kebangkitan.","O Allah, by You we reach the morning and the evening; by You we live and die, and to You is the resurrection.","(النص العربي أعلاه)"), dalil:"HR Tirmidzi 3391, Abu Dawud 5068 (sahih)", grade:"sahih"},
  {g:T("Pagi & petang","Morning & evening","الصباح والمساء"), nama:T("Perlindungan dari segala mudarat (3×)","Protection from all harm (3×)","الحفظ من كل ضر (3×)"), arab:"بِسْمِ اللهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", latin:"Bismillāhilladzī lā yaḍurru ma'asmihi syai'un fil-arḍi wa lā fis-samā'i wa huwas-samī'ul-'alīm.", arti:T("Dengan nama Allah yang bersama nama-Nya tidak ada sesuatu pun di bumi maupun di langit yang dapat memberi mudarat; Dia Maha Mendengar, Maha Mengetahui.","In the name of Allah, with whose name nothing on earth or in heaven can harm; He is the All-Hearing, All-Knowing.","(النص العربي أعلاه)"), dalil:"HR Abu Dawud 5088, Tirmidzi 3388 (sahih)", grade:"sahih"},
  {g:T("Pagi & petang","Morning & evening","الصباح والمساء"), nama:T("Ridha (3×)","Contentment (3×)","الرضا (3×)"), arab:"رَضِيتُ بِاللهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا", latin:"Raḍītu billāhi rabbā, wa bil-islāmi dīnā, wa bi Muḥammadin ṣallallāhu 'alaihi wa sallama nabiyyā.", arti:T("Aku ridha Allah sebagai Tuhan, Islam sebagai agama, dan Muhammad ﷺ sebagai Nabi.","I am content with Allah as Lord, Islam as religion, and Muhammad ﷺ as Prophet.","(النص العربي أعلاه)"), dalil:"HR Abu Dawud 5072, Tirmidzi 3389 (hasan)", grade:"hasan"},
  {g:T("Pagi & petang","Morning & evening","الصباح والمساء"), nama:T("Afiat badan (3×)","Well-being of the body (3×)","عافية البدن (3×)"), arab:"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ", latin:"Allāhumma 'āfinī fī badanī, allāhumma 'āfinī fī sam'ī, allāhumma 'āfinī fī baṣarī, lā ilāha illā ant.", arti:T("Ya Allah, sehatkanlah badanku, pendengaranku, penglihatanku; tiada tuhan selain Engkau.","O Allah, grant me well-being in my body, my hearing, my sight; there is no god but You.","(النص العربي أعلاه)"), dalil:"HR Abu Dawud 5090 (hasan)", grade:"hasan"},
  {g:T("Pagi & petang","Morning & evening","الصباح والمساء"), nama:T("Tiga Qul (3×)","The three Quls (3×)","المعوذات (3×)"), arab:"قُلْ هُوَ اللهُ أَحَدٌ · قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ · قُلْ أَعُوذُ بِرَبِّ النَّاسِ", latin:"Al-Ikhlas, Al-Falaq, An-Nas — 3×", arti:T("Tiga surah perlindungan.","The three surahs of protection.","المعوذات الثلاث."), dalil:"HR Abu Dawud 5082, Tirmidzi 3575 (hasan sahih)", grade:"sahih", note:T("\"Mencukupimu dari segala sesuatu.\"","\"They suffice you against everything.\"","«تكفيك من كل شيء»")},
  {g:T("Seputar salat sunnah","Around voluntary prayer","متعلقات النوافل"), nama:T("Istikharah","Istikharah","الاستخارة"), arab:"اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ، فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ، وَتَعْلَمُ وَلَا أَعْلَمُ، وَأَنْتَ عَلَّامُ الْغُيُوبِ. اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي فَاقْدُرْهُ لِي وَيَسِّرْهُ لِي ثُمَّ بَارِكْ لِي فِيهِ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي فَاصْرِفْهُ عَنِّي وَاصْرِفْنِي عَنْهُ، وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ ثُمَّ أَرْضِنِي بِهِ", latin:"Allāhumma innī astakhīruka bi'ilmik, wa astaqdiruka biqudratik, wa as'aluka min faḍlikal-'aẓīm, fa innaka taqdiru wa lā aqdir, wa ta'lamu wa lā a'lam, wa anta 'allāmul-ghuyūb. Allāhumma in kunta ta'lamu anna hādzal-amra khairun lī fī dīnī wa ma'āsyī wa 'āqibati amrī faqdurhu lī wa yassirhu lī tsumma bārik lī fīh. Wa in kunta ta'lamu anna hādzal-amra syarrun lī fī dīnī wa ma'āsyī wa 'āqibati amrī faṣrifhu 'annī waṣrifnī 'anhu, waqdur liyal-khaira ḥaitsu kāna tsumma arḍinī bih.", arti:T("Ya Allah, aku memohon pilihan yang baik dari-Mu dengan ilmu-Mu, memohon kemampuan dengan kuasa-Mu, dan memohon karunia-Mu yang agung; Engkau mampu dan aku tidak, Engkau mengetahui dan aku tidak, dan Engkau Maha Mengetahui yang gaib. Ya Allah, jika Engkau mengetahui urusan ini baik bagiku dalam agama, kehidupan, dan akhir urusanku, maka takdirkanlah, mudahkanlah, lalu berkahilah. Dan jika Engkau mengetahui urusan ini buruk bagiku, palingkanlah ia dariku dan aku darinya; takdirkanlah kebaikan untukku di mana pun adanya, lalu jadikanlah aku ridha dengannya.","O Allah, I seek Your choice by Your knowledge, Your power by Your might, and I ask of Your great bounty; You are able and I am not, You know and I do not, and You are the Knower of the unseen. O Allah, if You know this matter is good for me in my religion, my livelihood and my end, then decree it for me, ease it for me and bless me in it. And if You know it is bad for me, then turn it from me and me from it, and decree for me the good wherever it is, then make me content with it.","(النص العربي أعلاه)"), dalil:"HR Bukhari 1162", grade:"sahih"},
  {g:T("Seputar salat sunnah","Around voluntary prayer","متعلقات النوافل"), nama:T("Setelah salat Taubat","After the prayer of repentance","بعد صلاة التوبة"), arab:"رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ", latin:"Rabbighfir lī wa tub 'alayya innaka antat-tawwābur-raḥīm.", arti:T("Tuhanku, ampunilah aku dan terimalah taubatku; sesungguhnya Engkau Maha Penerima taubat, Maha Penyayang.","My Lord, forgive me and accept my repentance; You are the Accepter of repentance, the Merciful.","(النص العربي أعلاه)"), dalil:"HR Abu Dawud 1516, Tirmidzi 3434 (sahih)", grade:"sahih", note:T("Ibnu Umar menghitung Nabi ﷺ mengucapkannya seratus kali dalam satu majelis.","Ibn Umar counted the Prophet ﷺ saying it a hundred times in one sitting.","عدّ ابن عمر للنبي ﷺ في المجلس الواحد مائة مرة.")},
  {g:T("Seputar salat sunnah","Around voluntary prayer","متعلقات النوافل"), nama:T("Setelah salat Dhuha — catatan","After Duha — a note","بعد الضحى: تنبيه"), arab:"—", latin:"Allāhumma innaḍ-ḍuḥā'a ḍuḥā'uka...", arti:T("Doa Dhuha yang populer ini tidak bersumber dari hadits Nabi ﷺ; ia susunan ulama belakangan tanpa sanad. Boleh dibaca sebagai doa biasa, tidak diyakini sebagai sunnah khusus.","This popular Duha supplication is not from a hadith of the Prophet ﷺ; it is a later scholarly composition without a chain. It may be said as an ordinary supplication, not held as a specific sunnah.","هذا الدعاء الشائع ليس من حديث النبي ﷺ؛ بل من تأليف متأخر بلا سند. يجوز الدعاء به دعاءً عاديًا لا سنةً خاصة."), dalil:"—", grade:"dhaif"},
  {g:T("Tidur","Sleep","النوم"), nama:T("Menjelang tidur: penyerahan diri","At bedtime: surrender","عند النوم: التسليم"), arab:"اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ", latin:"Allāhumma aslamtu nafsī ilaik, wa fawwaḍtu amrī ilaik, wa wajjahtu wajhī ilaik, wa alja'tu ẓahrī ilaik, raghbatan wa rahbatan ilaik, lā malja'a wa lā manjā minka illā ilaik, āmantu bikitābikalladzī anzalt, wa binabiyyikalladzī arsalt.", arti:T("Ya Allah, aku serahkan diriku kepada-Mu, kuserahkan urusanku kepada-Mu, kuhadapkan wajahku kepada-Mu, kusandarkan punggungku kepada-Mu, dengan harap dan cemas kepada-Mu. Tiada tempat berlindung dari-Mu kecuali kepada-Mu. Aku beriman kepada kitab-Mu dan Nabi-Mu.","O Allah, I submit myself to You, entrust my affair to You, turn my face to You, and lean my back on You, in hope and fear of You. There is no refuge nor escape from You except to You. I believe in Your Book which You revealed and Your Prophet whom You sent.","(النص العربي أعلاه)"), dalil:"HR Bukhari 247, Muslim 2710", grade:"sahih", note:T("Setelah wudhu, berbaring miring kanan; \"jadikan ia ucapan terakhirmu.\"","After wudu, lying on the right side; \"make it the last thing you say.\"","بعد الوضوء على الشق الأيمن؛ «واجعلهن آخر ما تقول».")},
  {g:T("Tidur","Sleep","النوم"), nama:T("Doa tidur","Sleep supplication","دعاء النوم"), arab:"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", latin:"Bismikallāhumma amūtu wa aḥyā.", arti:T("Dengan nama-Mu ya Allah aku mati dan aku hidup.","In Your name, O Allah, I die and I live.","باسمك اللهم أموت وأحيا."), dalil:"HR Bukhari 6324", grade:"sahih"},
  {g:T("Tidur","Sleep","النوم"), nama:T("Tasbih Fatimah sebelum tidur","Fatimah's tasbih before sleep","تسبيح فاطمة قبل النوم"), arab:"سُبْحَانَ اللهِ (٣٣×) الْحَمْدُ لِلَّهِ (٣٣×) اللهُ أَكْبَرُ (٣٤×)", latin:"Subḥānallāh 33×, al-ḥamdu lillāh 33×, Allāhu akbar 34×.", arti:T("Maha Suci Allah, segala puji bagi Allah, Allah Maha Besar.","Glory be to Allah, praise be to Allah, Allah is the Greatest.","سبحان الله، الحمد لله، الله أكبر."), dalil:"HR Bukhari 6318, Muslim 2727", grade:"sahih", note:T("\"Lebih baik bagi kalian berdua daripada seorang pembantu.\"","\"Better for you both than a servant.\"","«فهو خير لكما من خادم»")},
  {g:T("Tidur","Sleep","النوم"), nama:T("Perlindungan sebelum tidur","Protection before sleep","الحفظ قبل النوم"), arab:"آيَةُ الْكُرْسِيِّ · آمَنَ الرَّسُولُ ... (البقرة ٢٨٥–٢٨٦) · قُلْ هُوَ اللهُ أَحَدٌ · قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ · قُلْ أَعُوذُ بِرَبِّ النَّاسِ", latin:"Ayat Kursi; Al-Baqarah 285–286; Al-Ikhlas, Al-Falaq, An-Nas.", arti:T("Ayat Kursi; dua ayat terakhir Al-Baqarah; tiga Qul dengan meniup telapak tangan lalu mengusap tubuh tiga kali.","Ayat al-Kursi; the last two verses of Al-Baqarah; the three Quls, blowing into the palms then wiping the body three times.","آية الكرسي؛ خاتمة البقرة؛ المعوذات مع النفث في الكفين والمسح على الجسد ثلاثًا."), dalil:"HR Bukhari 2311; 5009; 5017", grade:"sahih"}
];
